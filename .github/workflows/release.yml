name: Publish packages (npm)
# Publica os clientes @databolsa (core sdk·cli·mcp + advisor·wallet·credit) no npm via OIDC Trusted Publishing (sem token, com
# provenance) e cria a GitHub Release vX.Y.Z (job github-release).
#
# Disparo manual (workflow_dispatch) após bumpar a versão dos pacotes (mantenha todas
# em lockstep) e dar commit. Republicar é a única forma de atualizar o README exibido
# no npmjs (um patch bump basta).
# Pré-requisito (one-time): Trusted Publisher configurado no npmjs para cada pacote.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        options: [all, cli, sdk, mcp, advisor-sdk, advisor-cli, advisor-mcp, wallet-sdk, wallet-cli, wallet-mcp, credit-sdk, credit-cli, credit-mcp]
        default: all

permissions:
  contents: read
  id-token: write        # OIDC → npm trusted publishing (+ provenance)

jobs:
  # Gate pré-publish: empacota e valida cada cliente num ambiente isolado (import, CLI
  # --version, handshake MCP), sem tocar rede (--offline). Não depende da API estar no
  # ar — uma instabilidade do data-plane nunca segura um release das libs. Se quebrar,
  # NÃO publica.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: node scripts/smoke-packages.mjs --offline

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # packages/<grupo>/<pacote>: core = clientes do contrato core; cada extensão traz os
        # seus em extensions/<extensão>/, um por contrato (advisor, wallet, mesa de crédito).
        include:
          - { pkg: cli, dir: packages/core/cli }
          - { pkg: sdk, dir: packages/core/sdk }
          - { pkg: mcp, dir: packages/core/mcp }
          - { pkg: advisor-sdk, dir: extensions/advisor/advisor-sdk }
          - { pkg: advisor-cli, dir: extensions/advisor/advisor-cli }
          - { pkg: advisor-mcp, dir: extensions/advisor/advisor-mcp }
          - { pkg: wallet-sdk, dir: extensions/wallet/wallet-sdk }
          - { pkg: wallet-cli, dir: extensions/wallet/wallet-cli }
          - { pkg: wallet-mcp, dir: extensions/wallet/wallet-mcp }
          - { pkg: credit-sdk, dir: extensions/credit/credit-sdk }
          - { pkg: credit-cli, dir: extensions/credit/credit-cli }
          - { pkg: credit-mcp, dir: extensions/credit/credit-mcp }
    steps:
      - uses: actions/checkout@v5
      # Every package's `prepack` builds dist with `bun build` (cli/mcp → node, sdk →
      # browser ESM + d.ts), so bun must be on PATH before `npm publish` runs prepack.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # Workspace deps for the build (sdk's prepack runs tsc for the .d.ts).
      - run: bun install
      # O SDK é construído ANTES de qualquer publish: cli, mcp e os clientes das extensões
      # importam `@databolsa/sdk/openapi`, cujo export `import` aponta para `dist/openapi.js`.
      # Cada job da matriz roda isolado, então sem este passo o bundle do cli/mcp não resolve
      # o subpath (03/09/2026: oito dos doze publishes da 3.8.0 caíram com
      # "Could not resolve: @databolsa/sdk/openapi").
      - run: bun run --cwd packages/core/sdk build
      # Idempotente: versão já no registro é pulada em vez de falhar com 403. É o que permite
      # re-rodar `all` depois de um publish parcial e ainda assim criar a GitHub Release.
      - name: Publish @databolsa/${{ matrix.pkg }}
        if: ${{ inputs.package == 'all' || inputs.package == matrix.pkg }}
        working-directory: ${{ matrix.dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} já está no registro — pulando."
          else
            npm publish --provenance   # prepack builds via bun; OIDC = auth + provenance (repo público)
          fi

  # Cria a GitHub Release (aba Releases + badge) automaticamente após publicar `all`.
  # Idempotente: se a tag da versão já existe, pula. `needs: publish` garante que só
  # roda se todos publicaram. Versão lida do package.json (todos andam em lockstep).
  github-release:
    needs: publish
    if: ${{ inputs.package == 'all' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # criar tag + release
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/core/sdk/package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe — pulando."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Clientes @databolsa ${VERSION} — core (sdk·cli·mcp), Advisor, Wallet e mesa de crédito publicados no npm via OIDC trusted publishing (provenance SLSA). Apache-2.0."
          fi

  # Verificação pós-publish: instala a versão recém-publicada DIRETO do registro npm num
  # ambiente isolado e repete o smoke, sem tocar rede (--offline). Confirma que o
  # artefato publicado é instalável e importa/roda. Espera a propagação do npm com
  # algumas tentativas.
  verify:
    needs: publish
    if: ${{ inputs.package == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Smoke da versão publicada (registro)
        run: |
          VERSION=$(node -p "require('./packages/core/sdk/package.json').version")
          # O registro leva alguns minutos para indexar o que acabou de ser publicado (03/09/2026:
          # a 3.8.0 caiu aqui com ETARGET num pacote publicado segundos antes). Espera fixa e um
          # smoke só — sem laço de tentativas escondendo publish que não aconteceu.
          sleep 180
          node scripts/smoke-packages.mjs --source=registry --version="$VERSION" --offline
