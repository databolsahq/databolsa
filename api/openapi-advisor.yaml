openapi: 3.1.0
info:
  title: DataBolsa Advisor API
  description: >-
    Camada organizacional do DataBolsa para escritórios de assessoria,
    consultorias e wealth managers:

    organizações, membros e papéis, clientes e famílias, assessor responsável,
    carteiras por cliente,

    taxas e trilha de auditoria.


    Convenções:

    - Autenticação pela credencial pessoal do membro: sessão do portal, chave
    pessoal ou token OAuth do conector.

    - Todo recurso vive dentro de uma organização; recurso fora do seu escopo
    responde 404.

    - Licença vencida responde 402 (`code: license_required`) nas escritas;
    leituras seguem abertas.

    - Erros seguem RFC 9457 (`application/problem+json`).

    - Toda escrita entra na trilha de auditoria da organização.
  version: 3.8.0
  contact:
    name: DataBolsa
servers:
  - url: https://api.databolsa.com
    description: Produção
security:
  - bearerApiKey: []
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
  schemas: {}
tags:
  - name: Advisor · Conta
    description: Identidade do chamador e organizações acessíveis
  - name: Advisor · Organização
    description: Organização, membros, papéis, convites e licença
  - name: Advisor · Clientes
    description: Clientes, famílias, assessor responsável e perfil
  - name: Advisor · Carteiras
    description: Carteiras por cliente — ativos, ledger e posições
  - name: Advisor · Taxas
    description: Tabelas de taxas do escritório e vínculo por cliente
  - name: Advisor · Auditoria
    description: Trilha de auditoria da organização
paths:
  /v1/advisor/me:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    type: string
                    enum:
                      - member
                      - org_key
                  user_id:
                    type:
                      - string
                      - "null"
                  email:
                    type:
                      - string
                      - "null"
                  name:
                    type:
                      - string
                      - "null"
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        org_id:
                          type: string
                        org_slug:
                          type: string
                        org_name:
                          type: string
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - advisor
                            - viewer
                        member_id:
                          type: string
                      required:
                        - org_id
                        - org_slug
                        - org_name
                        - role
                        - member_id
                required:
                  - principal
                  - user_id
                  - email
                  - name
                  - organizations
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorGetMe
      tags:
        - Advisor · Conta
      parameters: []
      summary: Identidade do chamador e organizações acessíveis
      description: Com credencial pessoal de membro, lista as organizações em que o
        usuário tem assento. Com conta de serviço, retorna a própria organização
        do token.
  /v1/advisor/invitations/accept:
    post:
      responses:
        "200":
          description: Assento criado/reativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    type: string
                  org_slug:
                    type: string
                  member_id:
                    type: string
                  role:
                    type: string
                required:
                  - org_id
                  - org_slug
                  - member_id
                  - role
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorAcceptInvitation
      tags:
        - Advisor · Conta
      parameters: []
      summary: Aceitar convite de organização
      description: Aceita um convite pendente pelo `token` do e-mail e cria o assento
        do Advisor para a conta logada, com o papel do convite. O e-mail da
        sessão precisa ser o do convite.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 16
                  description: Token do convite, do link recebido por e-mail.
              required:
                - token
  /v1/advisor/orgs/{org}:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  slug:
                    type: string
                  name:
                    type: string
                  cnpj:
                    type:
                      - string
                      - "null"
                  cvm_registration:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      client_visibility:
                        type: string
                        enum:
                          - all
                          - assigned
                      seat_assignment:
                        type: string
                        enum:
                          - automatic
                          - manual
                    required:
                      - client_visibility
                      - seat_assignment
                  created_at:
                    type: string
                required:
                  - id
                  - slug
                  - name
                  - cnpj
                  - cvm_registration
                  - status
                  - settings
                  - created_at
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorGetOrganization
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Detalhe da organização
      description: "Cadastro da organização: nome, slug, CNPJ, registro CVM, situação
        e as configurações (`client_visibility`, `seat_assignment`)."
    patch:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  slug:
                    type: string
                  name:
                    type: string
                  cnpj:
                    type:
                      - string
                      - "null"
                  cvm_registration:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      client_visibility:
                        type: string
                        enum:
                          - all
                          - assigned
                      seat_assignment:
                        type: string
                        enum:
                          - automatic
                          - manual
                    required:
                      - client_visibility
                      - seat_assignment
                  created_at:
                    type: string
                required:
                  - id
                  - slug
                  - name
                  - cnpj
                  - cvm_registration
                  - status
                  - settings
                  - created_at
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorUpdateOrganization
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Atualizar nome/configurações da organização
      description: "Inclui `settings.client_visibility`: `all` (todos veem todos os
        clientes) ou `assigned` (assessor/viewer só veem clientes atribuídos); e
        `settings.seat_assignment`: `automatic` (todo membro da organização
        ganha assento na primeira visita) ou `manual` (só dono/administrador da
        organização entram sozinhos; os demais precisam de assento criado em
        `POST /orgs/{org}/members`)."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  description: Novo nome da organização.
                settings:
                  type: object
                  properties:
                    client_visibility:
                      type: string
                      enum:
                        - all
                        - assigned
                      description: all = todo membro vê todos os clientes; assigned = assessor e
                        viewer só veem os clientes atribuídos.
                    seat_assignment:
                      type: string
                      enum:
                        - automatic
                        - manual
                      description: automatic = todo membro da organização ganha assento na primeira
                        visita; manual = só dono/administrador entram sozinhos.
                  description: Configurações; informe só as que mudam.
  /v1/advisor/orgs/{org}/license:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type:
                      - string
                      - "null"
                  seats_limit:
                    type: number
                  clients_limit:
                    type:
                      - number
                      - "null"
                  expires_at:
                    type:
                      - string
                      - "null"
                  expired:
                    type: boolean
                required:
                  - plan
                  - seats_limit
                  - clients_limit
                  - expires_at
                  - expired
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorGetLicense
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Licença e limites vigentes
      description: "Plano vigente e os limites do contrato: assentos, clientes e
        validade. `expired=true` bloqueia as escritas com 402
        (`license_required`); as leituras seguem abertas."
  /v1/advisor/orgs/{org}/members:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        user_id:
                          type: string
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - advisor
                            - viewer
                        display_name:
                          type:
                            - string
                            - "null"
                        status:
                          type: string
                        created_at:
                          type: string
                      required:
                        - id
                        - user_id
                        - role
                        - display_name
                        - status
                        - created_at
                required:
                  - data
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorListMembers
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Membros da organização
      description: "Assentos do Advisor na organização: membro, papel (owner, admin,
        advisor, viewer), nome de exibição e situação."
    post:
      responses:
        "200":
          description: Assento criado ou reativado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  user_id:
                    type: string
                  role:
                    type: string
                    enum:
                      - owner
                      - admin
                      - advisor
                      - viewer
                  display_name:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                  created_at:
                    type: string
                required:
                  - id
                  - user_id
                  - role
                  - display_name
                  - status
                  - created_at
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorAssignSeat
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Atribuir assento a um membro da organização
      description: Cria (ou reativa) o assento do Advisor para uma pessoa que já é
        membro da organização na plataforma, com o papel dado. É o caminho de
        entrada quando `settings.seat_assignment` é `manual`; em `automatic`
        serve para fixar o papel antes da primeira visita. Respeita o limite de
        assentos do contrato (402 `license_required`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  minLength: 1
                  description: Id da pessoa na plataforma (já membro da organização).
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - advisor
                  description: "Papel do assento: owner, admin ou advisor."
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Nome de exibição no escritório (até 120 caracteres).
              required:
                - user_id
                - role
  /v1/advisor/orgs/{org}/members/{memberId}:
    patch:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  user_id:
                    type: string
                  role:
                    type: string
                    enum:
                      - owner
                      - admin
                      - advisor
                      - viewer
                  display_name:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                  created_at:
                    type: string
                required:
                  - id
                  - user_id
                  - role
                  - display_name
                  - status
                  - created_at
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorUpdateMember
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
        - schema:
            type: string
          in: path
          name: memberId
          required: true
          description: Id do assento (de advisorListMembers).
      summary: Atualizar papel/status de um membro
      description: Muda o papel, o nome de exibição ou suspende/reativa o assento de
        um membro. Não remove a pessoa da organização na plataforma.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - advisor
                  description: "Novo papel: owner, admin ou advisor."
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                  description: active reativa; suspended bloqueia o acesso sem apagar o assento.
                display_name:
                  type: string
                  description: Novo nome de exibição.
  /v1/advisor/orgs/{org}/invitations:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum:
                            - owner
                            - admin
                            - advisor
                            - viewer
                        status:
                          type: string
                        expires_at:
                          type: string
                        created_at:
                          type: string
                      required:
                        - id
                        - email
                        - role
                        - status
                        - expires_at
                        - created_at
                required:
                  - data
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorListInvitations
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Convites da organização
      description: Convites da organização com e-mail, papel, situação e validade.
    post:
      responses:
        "200":
          description: Convite criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation_id:
                    type: string
                  invite_url:
                    type: string
                required:
                  - invitation_id
                  - invite_url
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorCreateInvitation
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Convidar membro (e-mail + papel)
      description: Cria um convite por e-mail com o papel dado e devolve o link de
        aceite. O assento nasce quando a pessoa aceita
        (`advisorAcceptInvitation`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: E-mail de quem será convidado.
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - advisor
                  description: "Papel que a pessoa terá ao aceitar: owner, admin ou advisor."
              required:
                - email
                - role
  /v1/advisor/orgs/{org}/invitations/{invitationId}:
    delete:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required:
                  - revoked
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorRevokeInvitation
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
        - schema:
            type: string
          in: path
          name: invitationId
          required: true
          description: Id do convite (de advisorListInvitations).
      summary: Revogar convite pendente
      description: Cancela um convite ainda não aceito.
  /v1/advisor/orgs/{org}/overview:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  aum_total:
                    type:
                      - number
                      - "null"
                  clients:
                    type: object
                    properties:
                      total:
                        type: number
                      prospect:
                        type: number
                      active:
                        type: number
                    required:
                      - total
                      - prospect
                      - active
                  by_class:
                    type: array
                    items:
                      type: object
                      properties:
                        asset_type:
                          type: string
                        market_value:
                          type: number
                      required:
                        - asset_type
                        - market_value
                  by_advisor:
                    type:
                      - array
                      - "null"
                    items:
                      type: object
                      properties:
                        member_id:
                          type:
                            - string
                            - "null"
                        display_name:
                          type:
                            - string
                            - "null"
                        clients:
                          type: number
                        aum:
                          type:
                            - number
                            - "null"
                      required:
                        - member_id
                        - display_name
                        - clients
                        - aum
                  by_client:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        owner_member_id:
                          type:
                            - string
                            - "null"
                        owner_display_name:
                          type:
                            - string
                            - "null"
                        aum:
                          type:
                            - number
                            - "null"
                        portfolios:
                          type: number
                      required:
                        - client_id
                        - name
                        - status
                        - owner_member_id
                        - owner_display_name
                        - aum
                        - portfolios
                  recent_activity:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        action:
                          type: string
                        summary:
                          type:
                            - string
                            - "null"
                        via:
                          type: string
                        actor_member_id:
                          type:
                            - string
                            - "null"
                        actor_display_name:
                          type:
                            - string
                            - "null"
                        entity_type:
                          type:
                            - string
                            - "null"
                        entity_id:
                          type:
                            - string
                            - "null"
                        created_at:
                          type: string
                      required:
                        - id
                        - action
                        - summary
                        - via
                        - actor_member_id
                        - actor_display_name
                        - entity_type
                        - entity_id
                        - created_at
                required:
                  - aum_total
                  - clients
                  - by_class
                  - by_advisor
                  - by_client
                  - recent_activity
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - title
                  - status
      operationId: advisorGetOverview
      tags:
        - Advisor · Organização
      parameters:
        - schema:
            type: string
          in: path
          name: org
          required: true
          description: Id ou slug da organização (de advisorGetMe).
      summary: Visão geral da organização (agregados)
      description: "AUM total, clientes, alocação por classe, quebra por assessor
        (owner/admin) e atividade recente. O escopo é aplicado no servidor:
        assessor com visibilidade `assigned` recebe o agregado apenas dos
        clientes atribuídos a ele. Carteiras `proposal` nunca entram nos
        agregados."
  /v1/advisor/orgs/{org}/audit:
    get:
      responses:
        "200":
