      x-lifecycle: object-native
  /v1/objects/resolve:
    get:
      responses:
        "200":
          description: Candidatos, chave exata primeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        query:
                          type: string
                          description: A consulta que trouxe este candidato — com `q=a|b` a lista mistura
                            as duas.
                        id:
                          type: string
                        kind:
                          type: string
                          description: Tipo do objeto como o servidor o publica; `string`, não enum.
                            `getObjectCensus` lista os vigentes.
                        subkind:
                          type:
                            - string
                            - "null"
                          description: "Fundo: `fidc`, `fii`, `fip`, `fif`, `fiagro`, `fiim`, `etf`,
                            `fapi`, `funcine`. Instrumento: `debenture`,
                            `securitizado`, `bdr`, `coe`, `tesouro`. Emissão de
                            securitização: `cri`, `cra`, `ots`; `securitizado` é
                            a série e `securitizacao` é a oferta. Papel: `on`,
                            `pn`, `unit`. Norma: `resolucao_cvm`,
                            `instrucao_cvm`, `deliberacao_cvm`,
                            `oficio_circular`, `resolucao_cmn`, `resolucao_bcb`,
                            `lei`, `decreto`, `medida_provisoria`. Prestador:
                            `gestora`, `administradora_fiduciaria`,
                            `assessoria`, `agencia_rating`; auditor e
                            custodiante não têm subtipo e aparecem pelas arestas
                            `audits` e `custodies`. Nulo significa não
                            classificado pela fonte, como fundos encerrados."
                        name:
                          type:
                            - string
                            - "null"
                        anchor_type:
                          type: string
                          description: Tipo de identificador como o servidor o publica; `string`, não
                            enum. `getObjectCensus` lista os vigentes.
                        anchor_value:
                          type: string
                        match_kind:
                          type: string
                          enum:
                            - exact_key
                            - exact_name
                            - prefix_name
                            - fuzzy_name
                          description: "`exact_key` = casou um identificador (é o único em que
                            `matched_key_*` significa alguma coisa). Os três de
                            nome são palpite ordenado, do melhor para o pior —
                            trate `fuzzy_name` como candidato a confirmar, nunca
                            como resposta."
                        matched_key_type:
                          type: string
                          description: A chave por onde casou. Em `match_kind` de NOME é uma chave
                            qualquer do objeto, e não diz nada sobre a busca.
                        matched_key_value:
                          type: string
                        confidence:
                          type: string
                          enum:
                            - high
                            - low
                      required:
                        - query
                        - id
                        - kind
                        - subkind
                        - name
                        - anchor_type
                        - anchor_value
                        - match_kind
                        - matched_key_type
                        - matched_key_value
                        - confidence
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      total:
                        type: integer
                        description: Itens no universo filtrado, ignorando a paginação. Só com
                          `?total=true`.
                      subject:
                        type: object
                        additionalProperties:
                          type: string
                        description: Os parâmetros de caminho desta requisição, ecoados. Presente em
                          toda rota endereçada por um objeto. Use-o para
                          conferir a atribuição quando fizer chamadas
                          concorrentes — sem ele, resposta trocada e resposta
                          certa têm exatamente a mesma cara.
                      queries:
                        type: array
                        items:
                          type: object
                          properties:
                            q:
                              type: string
                            best_id:
                              type:
                                - string
                                - "null"
                              description: O id resolvido, só quando há UM candidato no melhor tier de chave
                                ou nome exato. Empate continua nulo mesmo com
                                `limit=1`; aumente o limite para inspecionar os
                                candidatos.
                            candidates:
                              type: integer
                              description: Quantidade de candidatos devolvidos para esta consulta, respeitando
                                `limit`.
                            reason:
                              type:
                                - string
                                - "null"
                              enum:
                                - no_match
                                - ambiguous
                                - null
                              description: Por que não há `best_id`. Nulo quando há.
                          required:
                            - q
                            - best_id
                            - candidates
                            - reason
                        description: "Um veredito por consulta, na ordem de `q`. Sem cursor: `limit`
                          vale por consulta e a lista é fechada."
                    required:
                      - next_cursor
                      - count
                      - queries
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: resolveObject
      tags:
        - Objects
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            description: Candidatos por consulta (1–50, default 20). Sem cursor.
          required: false
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            description: Ticker, CNPJ, ISIN, código ou nome. Separe até 20 consultas por
              `|`; cada resultado traz `query` e o veredito em `meta.queries`.
              `limit` vale por consulta, sem cursor, até 200 candidatos no
              total. Chaves exatas têm prioridade; nomes ignoram ordem, acento e
              caixa, e termos como FIDC, debênture ou gestora restringem o tipo.
              `exact_key` e `exact_name` com um único melhor candidato já
              resolvem a identidade.
          required: true
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Restringe o tipo do objeto.
          required: false
        - in: query
          name: subkind
          schema:
            type: string
            description: "Restringe dentro do tipo: `fii`, `fidc`, `fip`, `etf`,
              `debenture`, `bdr`, `coe`, `tesouro`."
          required: false
      summary: Resolve ticker, CNPJ, ISIN, código ou nome
      description: "Retorna candidatos ordenados. `exact_key` identifica por chave;
        `fuzzy_name` exige confirmação. Prefira identificadores a nomes. Papéis
        e companhias são objetos distintos: por exemplo, `PETR4` resolve para o
        papel, ligado à emissora por `issued`."
      x-capability: object-context
      x-lifecycle: object-native
