          description: País como o USGS nomeia.
        country_iso3:
          type:
            - string
            - "null"
          description: ISO 3166-1 alfa-3. Nulo em linhas agregadas como 'Outros países'.
        country_label:
          type: string
          description: País em português.
        is_aggregate:
          type: boolean
          description: Linha agregada ('Outros países'), não um país. Some do ranking
            numerado.
        value:
          type:
            - number
            - "null"
          description: Quantidade na unidade de `unit`. Nulo quando o USGS publicou
            sentinela.
        value_raw:
          type:
            - string
            - "null"
          description: O texto exatamente como o USGS publicou, inclusive sentinela ('W',
            'NA', '—'). É o que preserva o motivo quando `value` é nulo.
        value_flag:
          type:
            - string
            - "null"
          description: "Sentinela isolada: W, NA, s, XX, ..."
        value_flag_reason:
          type:
            - string
            - "null"
          description: Leitura da sentinela, em português.
        unit:
          type:
            - string
            - "null"
        share_of_world_pct:
          type:
            - number
            - "null"
          description: Participação no total mundial, em %. NULO quando não é calculável,
            e nesse caso `share_basis` diz o motivo. Nunca zero por ausência.
        share_basis:
          type: string
          description: "Por que o share existe ou não existe. Sempre preenchido, mesmo
            quando o share é nulo. `ok`: share calculado contra o total mundial
            da MESMA base e unidade. `incomparable_basis`: existe total mundial
            para a commodity, mas os países reportam bases diferentes e não
            somáveis. É o caso das reservas de boro (Turquia em boratos
            refinados, Chile em ulexita, China em óxido bórico equivalente); o
            próprio USGS marca o total como `XX`. Dividir um país por esse total
            produz o tipo de número redondo e falso que circula por aí.
            `world_total_not_calculable`: o USGS publica o total como `XX`, ou
            seja, declara-o incalculável. `no_world_total`: não há total mundial
            publicado para o recorte (comum nas séries só domésticas dos EUA,
            que a publicação traz com mais anos que a tabela mundial).
            `is_world_total`: a própria linha é o total mundial, então não há
            share de si mesma. `value_<flag>` (`value_na`, `value_w`, `value_s`,
            `value_large`, ...): o país não tem valor numérico; a sentinela
            publicada está em `value_raw` e o motivo em `value_flag_reason`."
        statistic_detail:
          type:
            - string
            - "null"
          description: Detalhe do agregado exatamente como publicado.
        statistic_detail_base:
          type:
            - string
            - "null"
          description: Detalhe normalizado. É a chave que torna dois países comparáveis.
        is_estimate:
          type: boolean
          description: Valor estimado pelo USGS (vale para o ano mais recente).
        notes:
          type:
            - string
            - "null"
      required:
        - rank
        - country
        - country_iso3
        - country_label
        - is_aggregate
        - value
        - value_raw
        - value_flag
        - value_flag_reason
        - unit
        - share_of_world_pct
        - share_basis
        - statistic_detail
        - statistic_detail_base
        - is_estimate
        - notes
