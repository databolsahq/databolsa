          name: assetCode
          schema:
            type: string
            minLength: 4
            description: ISIN do papel avaliado (CRI/CRA).
        - in: query
          name: issuerCnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ do emissor avaliado (14 dígitos, sem pontuação).
        - in: query
          name: agency
          schema:
            type: string
            enum:
              - fitch
              - moodys
              - sp
              - austin
              - sr
              - liberum
              - other
            description: Agência classificadora.
        - in: query
          name: entityType
          schema:
            type: string
            enum:
              - issuer
              - securitization
              - fidc
              - stock
            description: A que a nota se refere.
        - in: query
          name: scale
          schema:
            type: string
            enum:
              - national_br
              - global
            description: Escala. Fixe-a antes de comparar `rating_notch` entre papéis.
        - in: query
          name: confidence
          schema:
            type: string
            enum:
              - high
              - medium
              - low
            description: Confiança declarada da extração.
      summary: Rating de crédito vigente, com a fonte primária de cada nota
      description: >-
        Notas de agência observadas em documentos protocolados na CVM e no FNET,
        uma linha por (agência, papel) com a mais recente vigente. Toda resposta
        traz `agency`, `action_date` e `download_url`: a citação é parte do
        dado. Não emitimos rating — quando agências divergem, todas aparecem, e
        nenhuma nota é consolidada num rating nosso.


        `rating_notch` (1 = melhor) só é comparável **dentro da mesma `scale`**:
        um emissor brasileiro costuma ser AAA na escala nacional e BB na global
        ao mesmo tempo, e ordenar as duas juntas produz ranking que parece certo
        e está errado. Filtre por `scale` antes de comparar.


        `action_date_known=false` significa que a vigência foi decidida pela
        data de protocolo do documento (`doc_filed_at`), porque o relatório não
        afirma a data da ação — use-a para ordenar, nunca para exibir como data
        da agência.


        `declared` traz, quando existe, o rating que a própria securitizadora
        declarou no informe mensal da CVM para o mesmo ISIN. É segunda fonte
        para conferência: campo livre e mal preenchido, com `is_parseable=false`
        significando **não declarado no informe** — nunca 'o papel não tem
        rating'.


        Cobertura é parcial e cresce com a indexação: ausência de um papel aqui
        significa que ainda não observamos documento de rating dele, não que ele
        seja sem nota.
