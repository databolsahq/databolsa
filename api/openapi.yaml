              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateThesis
      tags:
        - Teses
      summary: Atualizar tese
      description: "Atualiza o conteúdo, a visibilidade, o arquivamento e/ou as tags.
        `md` substitui o markdown INTEIRO (não é patch): leia a tese com
        getThesis, edite o texto e devolva completo. `archived` esconde a tese
        do público sem apagar; `tags` são rótulos PRIVADOS de organização (só o
        dono vê, nunca aparecem na página pública)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                md:
                  type: string
                  description: "Markdown COMPLETO da tese. Markdown com frontmatter YAML.
                    Obrigatórios no frontmatter: `kind`
                    (equity|fii|macro|setor|carta|carteira) e `title`.
                    Opcionais: `subtitle`, `ticker`, `date` (AAAA-MM-DD),
                    `tags`. Autor, capa, ids de seção e disclaimer o servidor
                    preenche — não escreva. No corpo: `## Título` abre uma
                    seção; parágrafos, listas e `###` viram prosa em GFM; tabela
                    GFM vira tabela do relatório; `>
                    [!risco|tese|catalisador|atenção|info] Título` vira caixa de
                    destaque (linhas `- item` viram bullets). Blocos ricos vão
                    em cercas ```db:<tipo> com corpo YAML, onde <tipo> é rating,
                    keyStats, summary, chart, scenarios, sources, quote, figure,
                    table, cover ou disclaimer. Um bloco fora do formato NÃO
                    derruba a tese: ele degrada para um aviso de atenção no
                    documento e aparece em `warnings` na resposta, com linha e
                    campo, para você corrigir depois."
                doc:
                  allOf:
                    - $ref: "#/components/schemas/ReportDocInput"
                  deprecated: true
                  description: OBSOLETO — use `md`. ReportDoc JSON pronto, aceito para clientes
                    anteriores ao markdown.
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                archived:
                  type: boolean
                  description: true arquiva (some do público), false desarquiva.
                tags:
                  type: array
                  items:
                    type: string
                  description: Rótulos privados (substitui o conjunto; máx. 12).
      responses:
        "200":
          description: Tese atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
                  warnings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThesisWarning"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteThesis
      tags:
        - Teses
      summary: Excluir tese
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Excluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
