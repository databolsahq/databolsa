          required: false
        - in: query
          name: b_to_kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo da outra ponta de B.
          required: false
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo canônico do objeto. `equity_security` é o papel, separado de
              `company`; `securitization` é a emissão, separada da série
              negociável (`instrument`); e `fund_share_class` é a subclasse,
              separada da classe com CNPJ (`fund`). `indicator` representa o
              conceito medido, enquanto `data_series` representa uma publicação
              ou cálculo específico. `offering`, `market_event` e `norm` são
              objetos porque possuem identidade, atributos e relações próprias.
          required: false
        - in: query
          name: subkind
          schema:
