      summary: Rentabilidade da série com o CDI ao lado
      description: >-
        Quanto a série rendeu, **contra o CDI do mesmo período**.
        `/credit/fidc/{cnpj}/series` já dava `return_month_pct` as-filed, e isso
        responde "quanto rendeu no mês" sem responder nenhuma das perguntas que
        quem compra sênior faz de verdade: quanto no ano, quanto desde que
        entrei e quanto foi o CDI enquanto isso. Uma sênior que rende 1,45% no
