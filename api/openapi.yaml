          type:
            - string
            - "null"
          description: Rótulo de unidade como o mart escreveu, para exibição — são 33
            grafias distintas em 72 indicadores. Para decidir comparabilidade
            use `dimension`/`scale`/`period`.
        label:
          type:
            - string
            - "null"
        date:
          type:
            - string
            - "null"
