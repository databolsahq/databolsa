          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getObjectHistory
      tags:
        - Objects
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador canônico do objeto (`pub_…`). Operações em lote
            aceitam vários ids separados por vírgula.
          schema:
            type: string
        - in: query
          name: facts
          schema:
            type: string
            description: Nomes de medida separados por vírgula (até 10), como em
              `getObjectFacts`.
          required: true
        - in: query
          name: series
          schema:
            type: string
            description: "Qualificador da medida dentro do objeto: a classe de ação
              (`PETR4`), quando a medida é por papel, ou o escopo contábil da
              demonstração (`consolidado` | `individual`). Sem ele, a
              demonstração responde o consolidado, que é o que o contrato
              promete."
          required: false
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Início do período (AAAA-MM-DD, inclusive).
          required: false
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fim do período (AAAA-MM-DD, inclusive).
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
            description: Pontos mais recentes por série (1–2000, default 500).
          required: false
        - in: query
          name: transform
          schema:
            type: string
            enum:
              - sum_12m
              - ytd
              - compound_12m
              - compound_ytd
              - mean_3m
              - mean_12m
              - pct_change
              - diff
            description: "Transformação calculada sobre a série, guardada pela classe
              `axes.aggregation`: `sum_12m` e `ytd` somam fluxos; `compound_12m`
              e `compound_ytd` compõem variações percentuais (IPCA em 12 meses);
              `mean_3m` e `mean_12m` tiram a média; `pct_change` é a variação %
              contra o ponto anterior (níveis e fluxos); `diff` é a diferença
              contra o ponto anterior, em p.p. para taxas. Classe que não
              sustenta a conta responde `error` na série com o motivo e as
              aceitas. Quando a fonte já publica o acumulado, a série servida é
              a dela (`transform.served_from`). Janelas por calendário; ponto
              com janela descoberta é omitido."
          required: false
        - in: query
          name: resolve
          schema:
            type: string
            enum:
              - auto
              - exact
            default: auto
            description: "Como interpretar o `id`: `auto` segue fusões e, em cisões,
              responde 409 com os sucessores; `exact` lê literalmente o objeto
              desse id. Use `exact` para acessar o ramo de uma cisão que
              preservou o identificador original ou para desativar o
              redirecionamento automático."
          required: false
      summary: Obtém séries de medidas de um ou vários objetos
      description: Aceita até 50 IDs e 10 medidas separados por vírgula; retorna uma
        série por par objeto-medida. `meta.subjects` informa IDs ausentes ou sem
        dados, e uma medida incompatível retorna `error`, não série vazia.
        `series` escolhe o recorte — a classe do papel, ou o escopo contábil da
        demonstração (`consolidado` | `individual`); sem ela, `meta.series`
        informa a usada. `limit` seleciona os pontos mais recentes. O limite
        total é 100 séries e 100.000 pontos; excesso responde 422. `transform`
        calcula acumulados (`compound_12m`, `sum_12m`, `ytd`), médias e
        variações sobre a série, guardado pela classe `axes.aggregation` que a
        série declara; `transform.served_from` diz quando a resposta é a série
        que a fonte já publica.
      x-capability: object-context
      x-lifecycle: object-native
