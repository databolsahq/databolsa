  properties:
    - name: legal_name
      kind: company
      source: Cadastro RFB + PGFN
      description: Razão social no cadastro da Receita. É o nome que existe para
        empresa FECHADA — cedente, devedor de CRI, plataforma — que nunca teve
        registro na CVM e por isso não aparece em `companies`.
      vocabulary: null
    - name: trade_name
      kind: company
      source: Cadastro RFB + PGFN
      description: "Nome fantasia declarado no estabelecimento. Ausente é o normal:
        boa parte das empresas fechadas não declara um, e ausência aqui não diz
        nada sobre a empresa."
      vocabulary: null
    - name: registration_status
      kind: company
      source: Cadastro RFB + PGFN
      description: "Situação cadastral na Receita. É SINAL, não sentença: INAPTA
        costuma ser quem parou de declarar e BAIXADA pode ser reorganização
        societária normal — serve como pergunta a fazer sobre um cedente, não
        como veredito."
      vocabulary:
        - ATIVA
        - BAIXADA
        - INAPTA
        - SUSPENSA
        - NULA
    - name: registration_adverse
      kind: company
      source: Cadastro RFB + PGFN
      description: Se a situação cadastral é adversa (suspensa, inapta ou baixada).
        Existe como booleano porque é o corte que se faz sobre uma carteira
        inteira de cedentes; o motivo específico está em `registration_status`.
      vocabulary:
        - "true"
        - "false"
    - name: registration_status_since
      kind: company
      source: Cadastro RFB + PGFN
      description: Desde quando a empresa está nessa situação cadastral. É o que
        separa 'baixada no ano passado' de 'baixada em 2009' quando o recebível
        é de ontem.
      vocabulary: null
    - name: opened_on
      kind: company
      source: Cadastro RFB + PGFN
      description: Início de atividade no cadastro da Receita. Empresa aberta há três
        meses cedendo carteira grande é a pergunta que este campo faz.
      vocabulary: null
    - name: cnae_primary
      kind: company
      source: Cadastro RFB + PGFN
      description: Código CNAE da atividade principal declarada à Receita. Taxonomia
        DIFERENTE do `sector` da CVM — os dois convivem porque medem coisas
        diferentes, e traduzir um no outro inventaria classificação.
      vocabulary: null
    - name: cnae_description
      kind: company
      source: Cadastro RFB + PGFN
      description: Descrição oficial do CNAE principal, do domínio publicado pela
        própria Receita. É o rótulo legível de `cnae_primary`, não uma
        classificação nossa.
      vocabulary: null
    - name: state
      kind: company
      source: Cadastro RFB + PGFN
      description: UF do estabelecimento no cadastro da Receita. É o corte regional
        que a carteira de um FIDC ou de um CRI pede, e não existe em nenhuma
        outra folha de `company`.
      vocabulary: null
    - name: municipality
      kind: company
      source: Cadastro RFB + PGFN
      description: "Município do estabelecimento, do domínio publicado pela Receita.
        Texto livre na prática: são milhares de valores e uma lista congelada
        aqui envelheceria na primeira revisão."
      vocabulary: null
    - name: company_size
      kind: company
      source: Cadastro RFB + PGFN
      description: "Porte declarado à Receita. `DEMAIS` domina e NÃO significa
        'grande': é a categoria residual de quem não é ME nem EPP, então
        ausência de porte pequeno não é evidência de porte grande."
      vocabulary:
        - ME
        - EPP
        - DEMAIS
        - NAO INFORMADO
    - name: legal_nature
      kind: company
      source: Cadastro RFB + PGFN
      description: Natureza jurídica descrita pelo domínio da Receita (sociedade
        anônima fechada, LTDA, SPE). Diz que tipo de veículo é a parte, o que
        separa uma operadora de uma SPE de projeto.
      vocabulary: null
    - name: found_in_registry
      kind: company
      source: Cadastro RFB + PGFN
      description: "Se o CNPJ foi encontrado no cadastro da Receita. Existe porque
        'não sabemos' e 'está tudo bem' são conclusões opostas: sem esta marca,
        empresa não encontrada fica indistinguível de empresa encontrada e
        limpa."
      vocabulary:
        - "true"
        - "false"
    - name: has_federal_debt
      kind: company
      source: Cadastro RFB + PGFN
      description: "Se há inscrição em dívida ativa da União no papel PRINCIPAL. Só o
        principal: corresponsável e solidário são obrigação de sócio e avalista,
        e somá-los contaria a mesma dívida duas vezes."
      vocabulary:
        - "true"
        - "false"
    - name: has_debt_installment
      kind: company
      source: Cadastro RFB + PGFN
      description: "Se há parcelamento federal ativo. É a metade que impede a dívida
        de mentir: empresa com milhões inscritos e parcelamento está NEGOCIANDO;
        a mesma sem parcelamento está ignorando."
      vocabulary:
        - "true"
        - "false"
    - name: ownership_verifiable
      kind: company
      source: Cadastro RFB + PGFN
      description: Se o quadro societário tem ao menos um sócio pessoa JURÍDICA, único
        cruzável. O CPF do sócio pessoa física vem mascarado da fonte — 'não é
        verificável' e 'não há vínculo' são conclusões opostas, e a segunda é a
        que uma leitura desatenta faz.
      vocabulary:
        - "true"
        - "false"
    - name: sector
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Setor de atuação classificado pela CVM. São 70 valores vivos, por
        isso sem vocabulário declarado — lista congelada aqui ficaria errada na
        primeira revisão da CVM.
      vocabulary: null
    - name: status
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Situação do REGISTRO da companhia na CVM. Não diz nada sobre
        pregão: companhia com status ATIVO pode ter todos os papéis parados há
        anos."
      vocabulary:
        - ATIVO
        - CANCELADA
        - SUSPENSO(A) - DECISÃO ADM
    - name: issuer_status
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Situação OPERACIONAL do emissor — é aqui que recuperação judicial e
        falência aparecem, e não em `status`. Confundir os dois é ler uma
        empresa falida como ativa.
      vocabulary:
        - FASE OPERACIONAL
        - FASE PRÉ-OPERACIONAL
        - EM RECUPERAÇÃO JUDICIAL OU EQUIVALENTE
        - EM RECUPERAÇÃO EXTRAJUDICIAL
        - EM LIQUIDAÇÃO JUDICIAL
        - LIQUIDAÇÃO EXTRAJUDICIAL
        - FALIDA
        - PARALISADA
    - name: ownership_control
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Natureza do controle acionário declarada à CVM. É a CLASSIFICAÇÃO
        da fonte, não uma apuração de quem controla — para isso existem as
        arestas do grafo.
      vocabulary:
        - PRIVADO
        - PRIVADO HOLDING
        - ESTATAL
        - ESTATAL HOLDING
        - ESTRANGEIRO
        - ESTRANGEIRO HOLDING
    - name: listing_segment
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Segmento de listagem na B3, do Básico ao Novo Mercado. É exigência
        de governança, não tamanho nem liquidez.
      vocabulary:
        - Básico
        - Bovespa Mais
        - Nível 1 de Governança Corporativa
        - Nível 2 de Governança Corporativa
        - Novo Mercado
    - name: registration_category
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Categoria A pode ter ação listada; Categoria B só emite dívida.
        Explica companhia aberta sem papel nenhum, que não é erro de dado.
      vocabulary:
        - Categoria A
        - Categoria B
    - name: has_active_ticker
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Tem ao menos um papel negociando hoje. `false` junto de `status:
        ATIVO` é o caso comum de companhia registrada e não listada — as duas
        coisas são verdadeiras ao mesmo tempo."
      vocabulary:
        - "true"
        - "false"
    - name: listing_status
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Situação de listagem na B3, declarada no cadastro (03/09/2026):
        `active` tem papel negociando, `inactive` já teve e todos os códigos
        encerraram, `unlisted` nunca teve — a maioria do cadastro CVM (Categoria
        B, só dívida). É o corte de `listObjects(kind=company,
        where=listing_status=active)`, e `status: ATIVO` da CVM é outra coisa
        (registro, não listagem)."
      vocabulary:
        - active
        - inactive
        - unlisted
    - name: market
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Onde o papel negocia: `b3` quando há papel ativo na bolsa
        brasileira. Nulo para companhia registrada e não listada. O ativo
        americano publica `market: us` pela folha do universo americano."
      vocabulary:
        - b3
        - us
    - name: b3_trade_name
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Nome de PREGÃO da B3 (NOMRES do COTAHIST): 'P.ACUCAR-CBD', 'CASAS
        BAHIA'. É a marca pela qual o investidor conhece a empresa, e não a
        razão social que a CVM publica em `name`. Prefixado porque `trade_name`
        neste mesmo objeto é o NOME FANTASIA do cadastro da Receita — fontes e
        conceitos diferentes, preenchidos em 429 e 143 das 2.566 companhias."
      vocabulary: null
    - name: primary_ticker
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "O papel de EXIBIÇÃO da companhia: o mais líquido nas datas
        recentes, com renomeações já resolvidas. Não substitui a aresta
        `issued`, que lista todos os códigos — serve para escolher UM quando a
        resposta precisa de um só. Nulo em companhia deslistada, e aí a escolha
        é do chamador."
      vocabulary: null
    - name: free_float_pct
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Percentual do capital em circulação, na escala 0 a 100 (mediana
        28,91 no acervo de 1.231 companhias que declaram) — PERCENTUAL, não
        fração: 43.778 são 43,778% e não 4.377%. É declaração de FORMULÁRIO de
        referência, com a defasagem dela, e não uma apuração diária de
        posições."
      vocabulary: null
    - name: shares_on
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Quantidade de ações ORDINÁRIAS emitidas, do cadastro. É por
        ESPÉCIE, não por código: a companhia com PNA e PNB tem as duas dentro de
        `shares_pn`, e o número não é atribuível a nenhum código sozinho."
      vocabulary: null
    - name: shares_pn
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: Quantidade de ações PREFERENCIAIS emitidas, somando todas as
        classes (PNA, PNB, PNC). Zero em companhia só de ordinárias, que é a
        regra no Novo Mercado.
      vocabulary: null
    - name: shares_total
      kind: company
      source: Cadastro de companhias abertas (CVM)
      description: "Total de ações emitidas. Não é necessariamente `shares_on +
        shares_pn`: a fonte publica os três campos e units ou classes fora do
        par ON/PN entram só no total."
      vocabulary: null
    - name: us_type
      kind: company
      source: Universo de ativos americanos
      description: "`stock` ou `etf`. O ETF americano é objeto `fund`; a ação é
        `company` — o kind já separa, este campo ecoa a declaração do universo."
      vocabulary:
        - stock
        - etf
    - name: us_in_sp500
      kind: company
      source: Universo de ativos americanos
      description: Compõe o S&P 500, conforme o universo declarado — não é a
        composição oficial do dia.
      vocabulary:
        - "true"
        - "false"
    - name: us_in_ndx100
      kind: company
      source: Universo de ativos americanos
      description: Compõe o Nasdaq-100, conforme o universo declarado.
      vocabulary:
        - "true"
        - "false"
    - name: us_bdr_ticker
      kind: company
      source: Universo de ativos americanos
      description: O BDR na B3 que espelha este ativo, quando há. É o caminho para o
        preço em reais; nulo é 'sem BDR conhecido no universo'.
      vocabulary: null
    - name: us_first_date
      kind: company
      source: Universo de ativos americanos
      description: Primeira cotação no acervo. Início de OBSERVAÇÃO, não de existência.
      vocabulary: null
    - name: us_last_date
      kind: company
      source: Universo de ativos americanos
      description: Última cotação no acervo. Nulo é ativo do universo sem série coletada.
      vocabulary: null
    - name: us_filings_count
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: Quantos filings a SEC tem deste papel no acervo. É o tamanho da
        ficha, não do histórico da empresa — o acervo começa em
        `us_filings_since`.
      vocabulary: null
    - name: us_filings_since
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: Desde quando há filing no acervo. Cobertura da FONTE, não idade da
        companhia.
      vocabulary: null
    - name: us_last_filing_at
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: Data do filing mais recente, de qualquer formulário. É o frescor do
        acervo.
      vocabulary: null
    - name: us_last_annual_report_at
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: "Último relatório ANUAL: 10-K (e emenda) para a companhia
        americana, 20-F para a estrangeira listada nos EUA. Mais de um ano atrás
        com `us_last_filing_at` recente = a empresa protocola por outro
        formulário — leia `listUsFilings`."
      vocabulary: null
    - name: us_last_quarterly_report_at
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: Último relatório TRIMESTRAL (10-Q e emenda). Emissor estrangeiro
        não entrega 10-Q — ausência aqui com acervo vivo não é atraso.
      vocabulary: null
    - name: us_last_current_report_at
      kind: company
      source: SEC EDGAR (acervo de filings)
      description: Último fato relevante (8-K, ou 6-K do emissor estrangeiro) — o
        formulário de evento, não o periódico.
      vocabulary: null
    - name: market
      kind: fund
      source: Universo de ativos americanos
      description: "Onde negocia: `us` para o ativo do universo americano
        (NYSE/Nasdaq, em dólar). O papel da B3 publica `b3`."
      vocabulary:
        - b3
        - us
    - name: us_type
      kind: fund
      source: Universo de ativos americanos
      description: "`stock` ou `etf`. O ETF americano é objeto `fund`; a ação é
        `company` — o kind já separa, este campo ecoa a declaração do universo."
      vocabulary:
        - stock
        - etf
    - name: us_in_sp500
      kind: fund
      source: Universo de ativos americanos
      description: Compõe o S&P 500, conforme o universo declarado — não é a
        composição oficial do dia.
      vocabulary:
        - "true"
        - "false"
    - name: us_in_ndx100
      kind: fund
      source: Universo de ativos americanos
      description: Compõe o Nasdaq-100, conforme o universo declarado.
      vocabulary:
        - "true"
        - "false"
    - name: us_bdr_ticker
      kind: fund
      source: Universo de ativos americanos
      description: O BDR na B3 que espelha este ativo, quando há. É o caminho para o
        preço em reais; nulo é 'sem BDR conhecido no universo'.
      vocabulary: null
    - name: us_first_date
      kind: fund
      source: Universo de ativos americanos
      description: Primeira cotação no acervo. Início de OBSERVAÇÃO, não de existência.
      vocabulary: null
    - name: us_last_date
      kind: fund
      source: Universo de ativos americanos
      description: Última cotação no acervo. Nulo é ativo do universo sem série coletada.
      vocabulary: null
    - name: listing_status
      kind: fund
      source: Universo de ativos americanos
      description: "Situação (03/09/2026): `active` tem cotação nos 30 dias corridos
        até a última cotação do acervo, `inactive` parou antes, `unlisted` está
        no universo e nunca teve cotação."
      vocabulary:
        - active
        - inactive
        - unlisted
    - name: us_filings_count
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: Quantos filings a SEC tem deste papel no acervo. É o tamanho da
        ficha, não do histórico da empresa — o acervo começa em
        `us_filings_since`.
      vocabulary: null
    - name: us_filings_since
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: Desde quando há filing no acervo. Cobertura da FONTE, não idade da
        companhia.
      vocabulary: null
    - name: us_last_filing_at
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: Data do filing mais recente, de qualquer formulário. É o frescor do
        acervo.
      vocabulary: null
    - name: us_last_annual_report_at
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: "Último relatório ANUAL: 10-K (e emenda) para a companhia
        americana, 20-F para a estrangeira listada nos EUA. Mais de um ano atrás
        com `us_last_filing_at` recente = a empresa protocola por outro
        formulário — leia `listUsFilings`."
      vocabulary: null
    - name: us_last_quarterly_report_at
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: Último relatório TRIMESTRAL (10-Q e emenda). Emissor estrangeiro
        não entrega 10-Q — ausência aqui com acervo vivo não é atraso.
      vocabulary: null
    - name: us_last_current_report_at
      kind: fund
      source: SEC EDGAR (acervo de filings)
      description: Último fato relevante (8-K, ou 6-K do emissor estrangeiro) — o
        formulário de evento, não o periódico.
      vocabulary: null
    - name: trading_status_since
      kind: equity_security
      source: CODBDI do pregão (B3, COTAHIST)
      description: "Início do PERÍODO ATUAL da situação excepcional, não a primeira
        ocorrência dela: quem entra, sai e reentra em recuperação reporta a data
        da reentrada. Derivado de ilhas de pregões contíguos com o mesmo
        carimbo. Só existe quando `trading_status` não é `regular` — situação
        normal não tem data de início."
      vocabulary: null
    - name: trading_status
      kind: equity_security
      source: Universo de papéis do COTAHIST (B3) + CODBDI do pregão
      description: "Situação da emissora carimbada neste papel pela B3 no CODBDI do
        pregão. `regular` é a operação normal, e as outras quatro NÃO são
        suspensão: a maioria dos papéis carimbados segue negociando todo dia. É
        da COMPANHIA, carimbada no papel — atravesse `issued` para chegar à
        emissora, e veja `trading_status_since` para desde quando."
      vocabulary:
        - regular
        - sancionada
        - concordataria
        - recuperacao_extrajudicial
        - recuperacao_judicial
    - name: adjust_type
      kind: equity_security
      source: Universo de papéis do COTAHIST (B3) + CODBDI do pregão
      description: "O que o ajuste da série de preço aplicou, no último pregão do
        papel. Hoje é `events_only` em 100% do acervo — desdobramento,
        grupamento e bonificação aplicados, PROVENTO NÃO subtraído: quem espera
        preço ex-dividendo aqui lê uma queda que não existe, e o retorno total
        mora em `close_tr`. Sem vocabulário declarado de propósito: um único
        valor possível não é lista de opções, é constante, e declará-la
        afirmaria que não haverá outra."
      vocabulary: null
    - name: adjust_quality
      kind: equity_security
      source: Universo de papéis do COTAHIST (B3) + CODBDI do pregão
      description: Se dá para confiar na CADEIA de eventos por trás do preço ajustado.
        `full` tem a cadeia inteira; `suspect_unrecorded_event` viu um salto que
        nenhum evento explica; `no_event_source` não tem fonte de evento para o
        papel — e nos dois últimos comparar preço de hoje com o de anos atrás
        pode errar por um fator de desdobramento inteiro.
      vocabulary:
        - full
        - suspect_unrecorded_event
        - no_event_source
    - name: fund_type
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: "A sigla do tipo: FIF, FIDC, FII, FIP, FIAGRO. É o mesmo eixo que
        `subkind` publica no objeto, e serve para conferir um contra o outro."
      vocabulary: null
    - name: class_type
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: O tipo por extenso, como a RCVM 175 nomeia a CLASSE de cotas —
        'Classes de Cotas de Fundos FIDC' e afins.
      vocabulary: null
    - name: situation
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Situação do registro. NENHUM dos valores é 'Encerrado' — referência
        de mercado que exibe isso está derivando de outro lugar, não da CVM.
      vocabulary:
        - Em Funcionamento Normal
        - Fase Pré-Operacional
        - Em Liquidação
        - Em Análise
        - Cancelado
    - name: classification
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Classificação CVM por fator de risco predominante. É grossa de
        propósito; para o corte fino existe a da ANBIMA, ao lado.
      vocabulary:
        - Ações
        - Cambial
        - FMP-FGTS
        - Multimercado
        - Renda Fixa
    - name: anbima_classification
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: "Classificação ANBIMA, bem mais fina que a da CVM: 66 valores
        vivos, por isso sem vocabulário declarado aqui."
      vocabulary: null
    - name: condominium_type
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Aberto aceita resgate; fechado só sai vendendo a cota. Muda o que
        'liquidez' significa para este fundo, e é a primeira coisa a olhar antes
        de comparar retorno.
      vocabulary:
        - Aberto
        - Fechado
    - name: target_investor
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Público-alvo regulatório. 'Profissional' e 'Qualificado' têm
        barreira de entrada LEGAL — não é preferência comercial nem sugestão.
      vocabulary:
        - Público Geral
        - Qualificado
        - Profissional
    - name: is_exclusive
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Fundo exclusivo, de um único cotista. Era `S`/`N` da CVM até
        20/08/2026; a normalização foi para o mart, e não para esta rota, para
        que `getFund` e as propriedades nunca discordem sobre a mesma coluna.
      vocabulary:
        - "true"
        - "false"
    - name: is_investment_entity
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: Entidade de investimento na acepção contábil (CPC 18/IFRS 10), o
        que muda como as participadas são avaliadas. Nulo é ausência de
        declaração na fonte, nunca `false`.
      vocabulary:
        - "true"
        - "false"
    - name: fee_source
      kind: fund
      source: Cadastro de fundos (CVM, RCVM 175)
      description: "De ONDE veio a taxa de administração servida: `extrato` é a fonte
        viva, `cad_fi_legado` é o cadastro antigo. Não é atributo do fundo — é
        procedência do número, e está aqui para quem compara taxas saber o que
        está comparando."
      vocabulary:
        - extrato
        - cad_fi_legado
    - name: fii_segment
      kind: fund
      source: Cadastro de FII (B3 + CVM)
      description: Segmento imobiliário do FII — logística, shoppings, lajes, papel,
        híbrido. É o primeiro corte de qualquer triagem de FII e não existe no
        registro da CVM, que descreve o veículo e não o que ele possui.
      vocabulary: null
    - name: fii_is_paper
      kind: fund
      source: Cadastro de FII (B3 + CVM)
      description: "Se o fundo é de PAPEL (carteira de CRI e recebível) em vez de
        TIJOLO (imóvel físico). Muda o que significa vacância, cap rate e P/VP:
        fundo de papel não tem imóvel, e comparar os dois pelos mesmos
        indicadores compara coisas diferentes. Nulo em 30 dos 546 — a fonte não
        classificou."
      vocabulary:
        - "true"
        - "false"
    - name: etf_segment
      kind: fund
      source: Cadastro de ETF (B3)
      description: Segmento do ETF conforme a B3 — o índice ou a classe de ativo que
        ele replica. Prefixado porque o cadastro de FII publica um `segment`
        próprio, com vocabulário diferente.
      vocabulary: null
    - name: etf_trading_code_others
      kind: fund
      source: Cadastro de ETF (B3)
      description: Outros códigos de negociação do mesmo ETF. Existe porque um ETF
        pode negociar sob mais de um código, e quem casa por ticker precisa
        saber disso antes de concluir que são fundos diferentes.
      vocabulary: null
    - name: etf_first_traded
      kind: fund
      source: Cadastro de ETF (B3)
      description: "Primeiro pregão observado. É início de OBSERVAÇÃO e não de
        existência: ETF anterior à janela do lake aparece com data mais recente
        que a real."
      vocabulary: null
    - name: etf_last_traded
      kind: fund
      source: Cadastro de ETF (B3)
      description: Último pregão observado. Distância grande para hoje indica ETF que
        parou de negociar, não ausência de dado.
      vocabulary: null
    - name: fiagro_first_traded
      kind: fund
      source: Cadastro de FIAGRO (B3 + CVM)
      description: Primeiro pregão observado do FIAGRO na série.
      vocabulary: null
    - name: fiagro_last_traded
      kind: fund
      source: Cadastro de FIAGRO (B3 + CVM)
      description: Último pregão observado do FIAGRO. Distância grande para hoje
        indica papel que parou de negociar, e num universo de 46 fundos isso é a
        maior parte da triagem.
      vocabulary: null
    - name: registration_category
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: O que a casa PODE fazer perante a CVM — não o que ela faz.
        'Administrador Fiduciário' puro administra o fundo sem gerir a carteira;
        a diferença decide quem responde por quê.
      vocabulary:
        - Gestor de Carteira
        - Administrador Fiduciário
        - Administrador Fiduciário e Gestor de Carteira
    - name: registration_subcategory
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: Sob que regime de capital a casa se registrou. 'Instituição
        Financeira' é banco ou DTVM; 'Capital Mínimo' é a gestora independente.
      vocabulary:
        - Capital Mínimo
        - Fundos Especiais
        - Instituição Financeira
    - name: situation
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: Situação do registro na CVM. 'AFASTADO - TERMO DE COMPROMISSO' e
        'SUSPENSO(A)' são estados de sanção, e nenhum dos dois é cancelamento.
      vocabulary:
        - EM FUNCIONAMENTO NORMAL
        - CANCELADA
        - SUSPENSO(A) - DECISÃO ADM
        - AFASTADO - TERMO DE COMPROMISSO
        - LIQUIDAÇÃO EXTRAJUDICIAL
    - name: is_active
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: "Derivada de `situation`: verdadeira só em 'EM FUNCIONAMENTO
        NORMAL'. Os outros quatro estados são diferentes entre si — leia
        `situation` para separá-los."
      vocabulary:
        - "true"
        - "false"
    - name: manages_portfolios
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: A casa gere carteira de terceiros. Falso com registro ativo é o
        administrador fiduciário puro, que existe e não decide alocação —
        confundir os dois atribui decisão a quem não a toma.
      vocabulary:
        - "true"
        - "false"
    - name: ownership_control
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: Natureza do controle declarada à CVM. É classificação da FONTE, não
        apuração de quem controla — para isso existem as arestas do grafo.
      vocabulary:
        - PRIVADO
        - PRIVADO HOLDING
        - ESTATAL
    - name: state
      kind: service_provider
      source: Cadastro de administradores de carteira (CVM, ADM_CART)
      description: UF da sede declarada. Concentração geográfica de gestoras é
        informação de mercado, não detalhe cadastral.
      vocabulary: null
    - name: advisor_situation
      kind: service_provider
      source: Cadastro de assessores de investimento (CVM, AGENTE_AUTON)
      description: "Situação do registro de ASSESSOR na CVM. Vocabulário próprio,
        diferente do da gestora: no acervo PJ só existem os dois estados — 1.421
        em funcionamento e 3.323 canceladas, e o cancelado é histórico legítimo,
        não lixo."
      vocabulary:
        - EM FUNCIONAMENTO NORMAL
        - CANCELADA
    - name: advisor_registered_at
      kind: service_provider
      source: Cadastro de assessores de investimento (CVM, AGENTE_AUTON)
      description: Data do registro na CVM. Idade de registro é o único proxy de
        experiência que o cadastro público oferece.
      vocabulary: null
    - name: advisor_canceled_at
      kind: service_provider
      source: Cadastro de assessores de investimento (CVM, AGENTE_AUTON)
      description: Data do cancelamento, quando houve. Junto de `advisor_situation`,
        separa o ativo do histórico sem adivinhar.
      vocabulary: null
    - name: advisor_city
      kind: service_provider
      source: Cadastro de assessores de investimento (CVM, AGENTE_AUTON)
      description: Município da sede declarada. Com `advisor_state`, é o eixo
        geográfico do censo de assessorias.
      vocabulary: null
    - name: advisor_state
      kind: service_provider
      source: Cadastro de assessores de investimento (CVM, AGENTE_AUTON)
      description: UF da sede declarada à CVM. Concentração geográfica de assessorias
        é informação de mercado, não detalhe cadastral.
      vocabulary: null
    - name: situation
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: "Situação do registro da SUBCLASSE, que pode diferir da classe-mãe:
        subclasse em liquidação dentro de classe em funcionamento é caso
        normal."
      vocabulary:
        - Em Funcionamento Normal
        - Fase Pré-Operacional
        - Em Liquidação
        - Em Análise
        - Cancelado
    - name: is_operating
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: "Derivada de `situation`: verdadeira só em 'Em Funcionamento
        Normal'. Os outros quatro estados são diferentes entre si — leia
        `situation` para separá-los, porque o booleano os colapsa."
      vocabulary:
        - "true"
        - "false"
    - name: condominium_type
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: Aberto aceita resgate; fechado só sai vendendo a cota. Muda o que
        liquidez significa para esta subclasse, e 7.085 das 9.119 são fechadas.
      vocabulary:
        - Aberto
        - Fechado
    - name: target_investor
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: Público-alvo regulatório desta subclasse. É onde a estrutura
        sênior/subordinada costuma se separar do varejo, com barreira legal e
        não comercial.
      vocabulary:
        - Público Geral
        - Qualificado
        - Profissional
    - name: is_exclusive
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: Subclasse exclusiva, de um único cotista. Nulo é ausência de
        declaração na fonte, nunca 'não é exclusiva' — por isso a linha some em
        vez de vir falsa.
      vocabulary:
        - "true"
        - "false"
    - name: is_pension
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: Subclasse previdenciária. 475 das 9.119 não declaram, e nulo não é
        'não é previdenciária' — a linha some em vez de afirmar o que a fonte
        não disse.
      vocabulary:
        - "true"
        - "false"
    - name: parent_class_name
      kind: fund_share_class
      source: Registro de subclasses (CVM, RCVM 175)
      description: "O nome da CLASSE-mãe como o registro a chama. Atenção: o nome
        comercial da subclasse NÃO casa com o rótulo do informe mensal — o
        registro diz 'SEN 2' e o informe diz 'Subclasse Sênior Série 2'. As duas
        listas viajam lado a lado de propósito; casá-las por similaridade
        produziria vínculo errado em silêncio."
      vocabulary: null
    - name: indexer
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "O indexador CONTRATADO na emissão. `DI` e `PRÉ` não são a mesma
        família de risco que `IPCA`: o primeiro acompanha juro nominal e o
        segundo carrega inflação. `SEM-ÍNDICE` é declaração da fonte, não
        ausência de dado."
      vocabulary:
        - DI
        - IPCA
        - IGP-M
        - SEM-ÍNDICE
        - TR
        - PRÉ
        - ANBID
        - INPC
        - TJLP
        - DOLAR
        - IGP-DI
        - TR-REAL
        - US$ COMERCIAL
        - PREFIXADO
        - PÓS
        - BTN
        - IPC-R
        - IPC-M
        - UFIR
        - TBF
        - SELIC
        - EURO
        - FDS
        - IPC-FIPE
    - name: guarantee_type
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Espécie da garantia. `Quirografária` é SEM garantia real e é a
        maioria (5.819 de 9.887); `Subordinada` fica atrás dos demais credores
        na ordem de pagamento. Não é nota de risco — é posição na fila.
      vocabulary:
        - Quirografária
        - Real
        - Subordinada
        - Flutuante
    - name: debenture_class
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Conversibilidade em ação. `-` é como a fonte publica quando não
        declara, e viaja sem tradução.
      vocabulary:
        - Simples
        - Conversível
        - Permutável
        - "-"
        - Não Conversível Permutável
    - name: situation
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Situação no registro. `Excluído` são 5.148 de 9.887 e significa
        papel que saiu do sistema (vencido, resgatado), não erro de cadastro — a
        maioria da base é histórico, e uma triagem que não filtre isto mistura
        papel vivo com papel morto.
      vocabulary:
        - Excluído
        - Registrado
    - name: registration_regime
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Rito pelo qual a emissão chegou ao mercado. `dispensa_icvm_476`
        (esforços restritos) é o maior grupo e é DISPENSADO de registro
        ordinário — por isso emissor sem registro CVM não é anomalia.
      vocabulary:
        - dispensa_icvm_476
        - rito_automatico_rcvm_160
        - registro_ordinario
        - dispensa_outra
        - pendente
        - outro
    - name: is_incentivada
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Se é incentivada (Lei 12.431), com isenção de IR para pessoa
        física. 1.411 de 9.887. Muda o retorno LÍQUIDO sem mudar a taxa
        contratada, então comparar taxa bruta entre incentivada e comum compara
        coisas diferentes.
      vocabulary:
        - "true"
        - "false"
    - name: is_active
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Se o papel está ativo no registro. Ler junto com `situation`: as
        duas vêm da fonte e respondem perguntas próximas, mas não idênticas."
      vocabulary:
        - "true"
        - "false"
    - name: maturity_date
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Vencimento COMO ARQUIVADO. Pode ser sentinela — ver
        `maturity_is_sentinel`. É texto: para cortar por prazo use data, não
        comparação de string, e o corte numérico por prazo remanescente ainda
        não existe como medida."
      vocabulary: null
    - name: effective_maturity_date
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Vencimento EFETIVO, já resolvida a sentinela. É este que deve
        entrar em conta de prazo; `maturity_date` fica para auditoria contra a
        fonte.
      vocabulary: null
    - name: maturity_is_sentinel
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: Se o vencimento arquivado é valor-sentinela (ano ≥ 2090) e não data
        real. São 55 papéis. Sem esta flag, eles entram em bucket de prazo
        longuíssimo e distorcem qualquer curva.
      vocabulary:
        - "true"
        - "false"
    - name: exit_date
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Campo 'Data de Saída / Novo Vencimento' do registro, com os dois
        ofícios que a fonte lhe dá: no papel encerrado é a data em que ele saiu;
        no papel VIVO é o vencimento — idêntica a `maturity_date` em 4.681 de
        4.681 ativos. Só significa saída quando `is_active` é false, e a
        sentinela de perpetuidade (ano ≥ 2090) aparece aqui como aparece em
        `maturity_date`."
      vocabulary: null
    - name: exit_reason
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Motivo da saída COMO ARQUIVADO, incluindo a data no próprio texto
        ('05/06/2014 - VENCIMENTO'). Sem vocabulário porque a fonte escreve em
        texto livre — VENCIMENTO, VENCIMENTO ANTECIPADO, RESGATE TOTAL
        ANTECIPADO, CANCELAMENTO e variações. Existe em 3.317 dos 5.148 inativos
        e em nenhum ativo: ausência aqui é papel vivo, não motivo desconhecido."
      vocabulary: null
    - name: cvm_registration_raw
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: O número do registro na CVM como a fonte o escreveu
        ('CVM/SRE/DEB/2012/001', 'DISPENSA ICVM 476/09'). É a evidência bruta
        atrás de `registration_regime`, com as variações de grafia da fonte
        preservadas — 4.903 formas distintas em 9.829 papéis, das quais boa
        parte é a mesma dispensa escrita de outro jeito. Para triagem use
        `registration_regime`, que é a versão normalizada; este campo é para
        conferir contra o registro.
      vocabulary: null
    - name: spread_absent_reason
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Por que `spread_pct_aa` está ausente. Existe em 17,7% dos papéis,
        e 82,3% + 17,7% = 100%: não há buraco na base, há ausência DECLARADA.
        `spread_pct_aa = 0` nunca é omissão."
      vocabulary:
        - not_filed
        - filed_zero_unverifiable
        - no_index_no_rate
        - unparseable_legacy
    - name: issuer_match_level
      kind: instrument
      source: SND/ANBIMA + registro CVM
      description: "Como o emissor foi casado com o registro da CVM.
        `none_issuer_not_in_cvm_registry` NÃO é falha nossa: emissão por
        esforços restritos dispensa registro, e o emissor legitimamente não está
        lá."
      vocabulary:
        - exact
        - none_issuer_not_in_cvm_registry
        - none_cnpj_root_only
    - name: bdr_kind
      kind: instrument
      source: Cadastro B3
      description: Tipo do programa. `nao_patrocinado` é emitido pela depositária SEM
        acordo com a companhia estrangeira e é a maioria (878 de 1.194);
        `patrocinado` tem acordo (21); `etf` é BDR de fundo de índice (295), e
        aí o lastro é uma carteira, não uma empresa.
      vocabulary:
        - nao_patrocinado
        - etf
        - patrocinado
    - name: bdr_spec
      kind: instrument
      source: Cadastro B3
      description: Especificação do papel como a B3 publica. `ED` e `EB` no sufixo
        marcam situações de negociação, não classe — e por isso a sigla viaja
        inteira, sem ser partida em campos que a fonte não separa.
      vocabulary:
        - DRN
        - DRE
        - DRN ED
        - DRE ED
        - DR1
        - DRN EB
        - DR3
        - DR2
        - DRN EDB
        - UNT
        - DRN A
        - DIR
        - DRN C
    - name: first_traded
      kind: instrument
      source: Cadastro B3
      description: "Primeiro pregão observado do papel na nossa série. É início de
        OBSERVAÇÃO, não de existência: papel anterior à janela do lake aparece
        com data mais recente do que a real."
      vocabulary: null
    - name: last_traded
      kind: instrument
      source: Cadastro B3
      description: Último pregão observado. Distância grande para hoje indica papel
        que parou de negociar, não ausência de dado.
      vocabulary: null
    - name: listing_status
      kind: instrument
      source: Cadastro B3
      description: "Situação de listagem (03/09/2026): `active` negociou nos 30 dias
        corridos até o último pregão de BDR do acervo, `inactive` parou antes. O
        registro do BDR nasce do COTAHIST e não tem flag de desligamento — o
        pregão é a evidência."
      vocabulary:
        - active
        - inactive
    - name: market
      kind: instrument
      source: Cadastro B3
      description: "Onde negocia: o BDR é sempre `b3` — é o recibo na bolsa brasileira
        do ativo estrangeiro. O ativo de origem, quando está no universo
        americano, publica `market: us` no próprio objeto."
      vocabulary:
        - b3
        - us
    - name: coe_issuer_name
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: "Emissor como o registro de balcão o nomeia (razão social as-filed,
        ex.: `BANCO XP S/A`). É texto da fonte, não identidade: o objeto do
        emissor está na aresta `issued`."
      vocabulary: null
    - name: coe_indexer
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: Indexador DE REGISTRO da emissão — NÃO é o retorno do investidor. O
        COE é estruturado e o que se recebe depende de barreira e cenário, que a
        fonte não publica. `SEM REMUNERACAO` e `NO PERIODO` são rótulos do
        formulário, não promessa de zero.
      vocabulary:
        - NO PERIODO
        - SEM REMUNERACAO
        - IPCA VCP
        - PRE
        - DI
    - name: coe_issue_type
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: Modalidade da oferta no registro. Nos 957 COEs com objeto hoje,
        todos vêm `PUBLICA` — mas isso é o que a janela observada mostra, não um
        vocabulário fechado da fonte.
      vocabulary: null
    - name: coe_is_incentivada
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: "Se o registro marca incentivo fiscal. Campo de REGISTRO: confirme
        no documento da emissão antes de concluir isenção."
      vocabulary:
        - "true"
        - "false"
    - name: coe_maturity_date
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: Vencimento no registro da emissão. Prefixado porque `maturity_date`
        já existe na ficha da debênture e as duas abrem pela mesma chave.
      vocabulary: null
    - name: coe_last_trade_date
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: Último pregão com negócio no balcão. Nulo significa registrado e
        nunca negociado — que é o caso comum em COE, não anomalia.
      vocabulary: null
    - name: coe_status
      kind: instrument
      source: BDI InstrumentRegistration (B3)
      description: "Ciclo de vida, não listagem — o COE vence: `outstanding` ainda não
        venceu, `matured` venceu (pela `coe_maturity_date` contra a data da
        carga). É o corte de `listObjects(kind=instrument, subkind=coe,
        where=coe_status=outstanding)`."
      vocabulary:
        - outstanding
        - matured
    - name: asset_family
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: "A família do papel. Não é rótulo cosmético: CRI é lastro
        imobiliário, CRA é agronegócio e OTS é o título de securitização
        genérico da Lei 14.430 — regimes e lastros diferentes sob a mesma
        mecânica."
      vocabulary:
        - CRI
        - CRA
        - OTS
    - name: cetip_code
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: Código de negociação (Cetip/B3, "Código IF") da série. É por ele
        que o balcão e a carteira do investidor chamam este papel — o ISIN é a
        chave do registro, o código é o do mercado.
      vocabulary: null
    - name: series_number
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: 'Número da série dentro da emissão. Sozinho não identifica nada: a
        mesma "1ª série" existe em milhares de emissões, e é o par com o
        certificado que resolve.'
      vocabulary: null
    - name: tranche
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: Classe da série na estrutura de subordinação, como a securitizadora
        declarou. É o que separa quem recebe primeiro de quem absorve a perda
        primeiro.
      vocabulary: null
    - name: series_status
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: Situação declarada da série na competência. Dois valores no
        universo inteiro, e a distinção é a que importa num papel de crédito.
      vocabulary:
        - Adimplente
        - Em atraso
    - name: offer_type
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: Público a que a série foi ofertada. Define quem pode comprar e, na
        prática, quanta informação a oferta precisou publicar.
      vocabulary:
        - Profissionais
        - Qualificados
        - Público em geral
    - name: interest_text
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: 'Remuneração como a securitizadora escreveu ("IPCA + 9%", "IGP-M +
        11,0%"). TEXTO de propósito: só 42 de 3.226 linhas são número puro, e
        "CDI + 6,5%" e "106,5% do CDI" não são a mesma coisa.'
      vocabulary: null
    - name: payment_frequency
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: Periodicidade declarada de pagamento de juros. Texto livre na
        fonte, preservado como veio — normalizar aqui esconderia as combinações
        que a securitizadora de fato usa.
      vocabulary: null
    - name: declared_rating
      kind: instrument
      source: Informe mensal de securitizadora (CVM)
      description: 'Nota DECLARADA pela própria securitizadora no informe, bruta.
        Campo livre: "0", "Não há" e "-" dominam, e só ~4-5% das linhas trazem
        nota plausível. Não confundir com o rating extraído de relatório de
        agência, que é fonte independente.'
      vocabulary: null
    - name: tesouro_is_negotiable
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: Se o título está na lista de COMPRA do Tesouro Direto neste
        momento. `false` é o título que só aceita resgate antecipado — ele
        continua tendo taxa e PU publicados todo dia, e por isso um ranking de
        taxa sem este corte devolve papel que ninguém consegue comprar.
      vocabulary:
        - "true"
        - "false"
    - name: tesouro_coupon
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: "Periodicidade do pagamento de juros, como a fonte a codifica: `U`
        = pagamento ÚNICO no vencimento (LTN, LFT, IPCA+ Principal), `S` = juros
        SEMESTRAIS (NTN-F, IPCA+ com Juros Semestrais), `M` = fluxo MENSAL na
        fase de renda (Renda+, Educa+). É o que separa `Tesouro IPCA+ 2035` de
        `Tesouro IPCA+ com Juros Semestrais 2035`, que têm o mesmo vencimento e
        fluxos de caixa diferentes."
      vocabulary:
        - U
        - S
        - M
    - name: tesouro_indexer
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: O que corrige o principal, extraído do rótulo de rentabilidade da
        oferta. Ausente = PREFIXADO (LTN e NTN-F não têm indexador, e ausência
        aqui é a afirmação de que a taxa contratada é nominal). `IPCA` implica
        que `tesouro_buy_rate` é taxa REAL, acima da inflação — comparar a taxa
        de um IPCA+ com a de um prefixado compara coisas diferentes.
      vocabulary:
        - IPCA
        - SELIC
        - IGP-M
    - name: tesouro_bond_group
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: "Em qual oferta o título está: `legado` é o Tesouro Direto de
        sempre, com série histórica no mart e objeto no grafo; `24x7` é o
        Tesouro Reserva, que negocia fora do horário e ainda não tem série. Só
        `legado` casa com as medidas do título."
      vocabulary:
        - legado
        - 24x7
    - name: tesouro_official_name
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: O nome do título COMO A OFERTA o chama. Diverge do `name` do mart
        em Renda+ e Educa+, que no histórico usam o ano de CONVERSÃO e na oferta
        o nome oficial — `Tesouro Educa+ 2032` no mart é o vencimento 2036-12-15
        aqui. Quem cita nome ao usuário deve citar este.
      vocabulary: null
    - name: tesouro_isin
      kind: instrument
      source: Oferta corrente do Tesouro Direto
      description: ISIN do título na oferta. Não é a âncora do objeto — o título é
        ancorado por tipo + vencimento, porque é essa a chave da série
        histórica.
      vocabulary: null
    - name: tesouro_market
      kind: instrument
      source: Registro de títulos públicos (Tesouro Direto + leilões da DPMFi)
      description: "Em que mercado o título foi observado: `varejo` (só no Tesouro
        Direto), `atacado` (só nos leilões primários da dívida — a grade de LTN
        trimestral, NTN-C e NTN-D descontinuadas) ou `varejo_e_atacado`. Título
        só de atacado não tem PU de varejo nem oferta corrente; o que ele tem
        são os leilões (`tesouro_auction_*`)."
      vocabulary:
        - varejo
        - atacado
        - varejo_e_atacado
    - name: tesouro_first_auction
      kind: instrument
      source: Registro de títulos públicos (Tesouro Direto + leilões da DPMFi)
      description: Data do primeiro leilão de venda deste título na base (a série
        começa em 2000). Nulo é título que nunca foi a leilão de venda, não
        leilão antigo.
      vocabulary: null
    - name: tesouro_last_auction
      kind: instrument
      source: Registro de títulos públicos (Tesouro Direto + leilões da DPMFi)
      description: Data do último leilão de venda. Distância grande para hoje é título
        que saiu da grade do atacado — vencido ou substituído —, não ausência de
        dado.
      vocabulary: null
    - name: tesouro_first_retail_date
      kind: instrument
      source: Registro de títulos públicos (Tesouro Direto + leilões da DPMFi)
      description: Primeira data-base do título no Tesouro Direto (varejo). Nulo no
        título só de atacado, e a ausência é a afirmação.
      vocabulary: null
    - name: tesouro_last_retail_date
      kind: instrument
      source: Registro de títulos públicos (Tesouro Direto + leilões da DPMFi)
      description: Última data-base do título no Tesouro Direto. Título vencido ou
        retirado do varejo para de avançar aqui, mesmo que continue a leilão.
      vocabulary: null
    - name: family
      kind: offering
      source: Ofertas públicas (CVM)
      description: A família CANÔNICA do que está sendo ofertado — o mesmo eixo que
        `subkind` publica no objeto. É por aqui que se filtra, não por
        `asset_type_as_filed`.
      vocabulary:
        - fundo
        - divida
        - securitizacao
        - equity
        - outro
    - name: instrument
      kind: offering
      source: Ofertas públicas (CVM)
      description: O instrumento canônico, um nível mais fino que a família — também
        derivado, também seguro para filtrar.
      vocabulary: null
    - name: asset_type_as_filed
      kind: offering
      source: Ofertas públicas (CVM)
      description: "O tipo do ativo COMO A FONTE ESCREVEU. Está aqui por procedência,
        não para filtrar: são 60 grafias para ~28 instrumentos, porque cada
        regime usa um vocabulário. Filtrar por ele devolvia 1.841 de 2.801
        debêntures — 34% de perda silenciosa. Use `family` ou `instrument`."
      vocabulary: null
    - name: offering_type
      kind: offering
      source: Ofertas públicas (CVM)
      description: Primária (dinheiro novo para o emissor), secundária (venda de quem
        já tinha) ou mista. Muda QUEM recebe o volume, que é a diferença entre a
        empresa capitalizar e um sócio sair.
      vocabulary: null
    - name: rite
      kind: offering
      source: Ofertas públicas (CVM)
      description: Rito de registro. Automático e ordinário têm exigências e prazos
        diferentes, e isso explica ofertas de mesmo tamanho com histórias
        regulatórias distintas.
      vocabulary: null
    - name: regime
      kind: offering
      source: Ofertas públicas (CVM)
      description: O regime regulatório sob o qual a oferta foi registrada — é o que
        separa o acervo ICVM 476 do resto, e o 476 não tem data de registro.
      vocabulary: null
    - name: status
      kind: offering
      source: Ofertas públicas (CVM)
      description: "Situação da oferta. REGISTRADA NÃO É DISTRIBUÍDA: o volume servido
        é o pretendido no registro, não o efetivamente colocado — somar
        registros e chamar de captação do ano é o erro comum aqui."
      vocabulary: null
    - name: registration_modality
      kind: offering
      source: Ofertas públicas (CVM)
      description: Modalidade do registro na CVM. Junto de `registration_regime`,
        descreve por qual porta a oferta entrou.
      vocabulary: null
    - name: registration_regime
      kind: offering
      source: Ofertas públicas (CVM)
      description: Regime do registro — dispensa, análise prévia e afins. É atributo
        do PROCESSO, não do papel ofertado.
      vocabulary: null
    - name: series
      kind: offering
      source: Ofertas públicas (CVM)
      description: "A série dentro da emissão, e ela é parte do GRÃO: uma emissão com
        três séries são três ofertas aqui, com volumes diferentes. Somá-las sem
        perceber conta a mesma emissão três vezes."
      vocabulary: null
    - name: issue
      kind: offering
      source: Ofertas públicas (CVM)
      description: O número da emissão do emissor. Emissão alta com séries curtas é
        emissor recorrente, e isso é informação sobre o emissor, não sobre esta
        oferta.
      vocabulary: null
    - name: tax_incentive
      kind: offering
      source: Ofertas públicas (CVM)
      description: "Papel incentivado (Lei 12.431 e afins). Muda a comparação de taxa:
        incentivado rende líquido de IR para pessoa física, então comparar a
        taxa crua com a de um papel comum favorece o comum sem motivo."
      vocabulary:
        - "true"
        - "false"
    - name: value_is_sentinel
      kind: offering
      source: Ofertas públicas (CVM)
      description: O volume declarado é lixo da fonte — três registros vêm preenchidos
        com noves, até R$ 100 tri. A flag NÃO altera o valor servido; existe
        para você poder excluí-lo ao agregar.
      vocabulary:
        - "true"
        - "false"
    - name: value_pre_real_currency
      kind: offering
      source: Ofertas públicas (CVM)
      description: O volume está em moeda ANTERIOR ao Plano Real e nunca foi
        convertido — 693 ofertas. Somá-lo com o resto produz um total sem
        significado nenhum.
      vocabulary:
        - "true"
        - "false"
    - name: security_type
      kind: offering
      source: Crowdfunding de investimento (CVM, RCVM 88 — Anexo G)
      description: O valor mobiliário ofertado, como a CVM classifica no sistema de
        esforços restritos (nota comercial, debênture, CR, ações...). É o que
        separa dívida de participação.
      vocabulary: null
    - name: issuer_legal_form
      kind: offering
      source: Crowdfunding de investimento (CVM, RCVM 88 — Anexo G)
      description: Tipo societário do emissor declarado no Anexo G. A RCVM 88 é para
        sociedade empresária de pequeno porte; a securitizadora (Hurst, Liqi)
        aparece como S.A.
      vocabulary: null
    - name: collateral
      kind: offering
      source: Crowdfunding de investimento (CVM, RCVM 88 — Anexo G)
      description: Lastro principal declarado pela plataforma — o que responde pela
        dívida (recebíveis, precatórios, imóvel...). Texto livre da fonte, não
        normalizado.
      vocabulary: null
    - name: sector
      kind: offering
      source: Crowdfunding de investimento (CVM, RCVM 88 — Anexo G)
      description: Setor de atuação do emissor, como declarado. Texto livre da fonte.
      vocabulary: null
    - name: tokenizable
      kind: offering
      source: Crowdfunding de investimento (CVM, RCVM 88 — Anexo G)
      description: "A plataforma declarou que o papel pode ser representado por token.
        Não diz que FOI: o token só existe como objeto quando a aresta
        `tokenized_as` aparece."
      vocabulary:
        - "true"
        - "false"
    - name: chain
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: A rede onde o contrato vive. O mesmo papel pode ter dois contratos
        em redes diferentes (migração), e aí são dois objetos.
      vocabulary:
        - polygon
        - xdc
        - plume
        - rootstock
    - name: symbol
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: "Símbolo ERC-20 declarado pelo próprio contrato (symbol()). É
        apelido do objeto, não chave: duas redes podem repetir o símbolo."
      vocabulary: null
    - name: address
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: Endereço do contrato na rede, minúsculo. Com `chain`, é a chave do
        objeto.
      vocabulary: null
    - name: tokenizer
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: A tokenizadora que emitiu o contrato (a plataforma, no cadastro de
        crowdfunding da CVM).
      vocabulary: null
    - name: regime
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: Regime regulatório sob o qual o token foi ofertado, quando conhecido.
      vocabulary: null
    - name: discovered_by
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: "Como o contrato entrou no acervo: `catalog` é lista curada;
        `deployer` é descoberta pela carteira emissora na rede."
      vocabulary: null
    - name: deployer
      kind: instrument
      source: Contrato on-chain (RPC/Blockscout público)
      description: Carteira que publicou o contrato, quando a rede a expõe.
      vocabulary: null
    - name: dimension
      kind: data_series
      source: Catálogo de séries
      description: O que o número É. Sem isto o `unit` da fonte não decide nada — no
        World Bank ele traz o NOME do indicador em 113 de 185 séries.
      vocabulary:
        - rate
        - index
        - currency
        - count
        - share
        - points
        - ratio
    - name: scale
      kind: data_series
      source: Catálogo de séries
      description: Em que escala o número vem. É o eixo que separa 4,44 de 0,0444 para
        a MESMA inflação, e ler errado erra por 100× sem nada acusar.
      vocabulary:
        - unit
        - thousand
        - million
        - billion
        - percent
        - bps
    - name: period
      kind: data_series
      source: Catálogo de séries
      description: Que JANELA o número cobre, e NÃO é a frequência de publicação. A TR
        é publicada todo dia e o número é DO MÊS. É a diferença entre o IPCA do
        mês (bcb_sgs:433) e o acumulado em 12 meses (bcb_sgs:13522), que é o
        erro macro mais caro que existe.
      vocabulary:
        - none
        - daily
        - monthly
        - quarterly
        - annual
        - ttm_12m
    - name: seasonal_adjustment
      kind: data_series
      source: Catálogo de séries
      description: Ajuste sazonal. Vivia só no sufixo do nome (`ibc_br` ×
        `ibc_br_dessaz`), o que obrigava a ler o rótulo para saber o que se
        estava comparando.
      vocabulary:
        - nsa
        - sa
        - saar
    - name: frequency
      kind: data_series
      source: Catálogo de séries
      description: "Com que frequência a fonte PUBLICA. Compare com `period` antes de
        concluir qualquer coisa: as duas divergem de propósito em várias séries,
        e é essa divergência que engana."
      vocabulary: null
    - name: served_by
      kind: data_series
      source: Catálogo de séries
      description: "De qual FONTE de observações esta série sai — o nome da rota
        histórica que a servia, guardado como está no catálogo. Hoje todas as
        séries respondem por `getObjectHistory`; o que muda é a medida: `value`
        nas séries do SGS, FRED, Banco Mundial e benchmarks, `focus_median` (e
        `focus_mean`, `focus_std_dev`, `focus_respondents`) no Focus,
        `curve_rate` no vértice de curva e `spread_median` na curva de crédito."
      vocabulary: null
    - name: aggregation
      kind: data_series
      source: Catálogo de séries
      description: "Como as observações se juntam no tempo, e portanto quais
        `transform` de `getObjectHistory` a série aceita: `flow` soma (PIB
        mensal, balança), `rate_compound` compõe (IPCA, CDI do mês),
        `rate_level` e `level` só tiram média ou diferença. Declarada no
        catálogo — não é deduzida da régua."
      vocabulary:
        - flow
        - rate_compound
        - rate_level
        - level
    - name: published_12m
      kind: data_series
      source: Catálogo de séries
      description: A série que a FONTE publica como acumulado de 12 meses desta
        (`bcb_sgs:13522` para o IPCA 433). Quando existe,
        `transform=compound_12m` ou `sum_12m` serve a série da fonte e diz isso
        em `transform.served_from`.
      vocabulary: null
    - name: series_source
      kind: data_series
      source: Catálogo de séries
      description: "A fonte da série: `bcb_sgs` (Banco Central), `fred` (Fed de St.
        Louis), `world_bank`, `benchmark` (índices de riqueza base-100),
        `bcb_focus` (expectativas), `curve` (vértices de referência),
        `credit_spread` (curva de crédito observada). É a primeira metade da
        chave `<fonte>:<id>` do objeto."
      vocabulary:
        - bcb_sgs
        - fred
        - world_bank
        - benchmark
        - bcb_focus
        - curve
        - credit_spread
    - name: series_unit_raw
      kind: data_series
      source: Catálogo de séries
      description: A unidade como a FONTE a escreve (`% a.m.`, `R$ milhões`). É texto
        e não decide nada — no World Bank traz o NOME do indicador. A régua que
        decide é `dimension`, `scale` e `period`.
      vocabulary: null
    - name: series_first_date
      kind: data_series
      source: Catálogo de séries
      description: Primeira observação servida da série. É início de OBSERVAÇÃO no
        nosso lake, não da série na fonte.
      vocabulary: null
    - name: series_last_date
      kind: data_series
      source: Catálogo de séries
      description: Última observação servida. Compare com `frequency` para saber se a
        série está em dia.
      vocabulary: null
    - name: crypto_first_traded
      kind: crypto_asset
      source: Catálogo de cripto
      description: "Primeiro dia da série coletada. É início de OBSERVAÇÃO e não de
        existência: o ativo pode ser anterior à janela do lake, e a mais antiga
        do acervo começa em 13/10/2020. Comparar retorno de dois cripto sem
        checar esta data compara janelas diferentes."
      vocabulary: null
    - name: crypto_last_traded
      kind: crypto_asset
      source: Catálogo de cripto
      description: "Último dia coletado. Distância grande para hoje é ativo que parou
        de ser coletado, não preço zerado — e é a leitura que impede tratar o
        fim da série como queda. O preço AO VIVO é outra superfície: cripto
        negocia 24h e a cotação corrente diverge deste fechamento dentro do
        mesmo dia."
      vocabulary: null
    - name: listing_status
      kind: crypto_asset
      source: Catálogo de cripto
      description: "Situação (03/09/2026): `active` tem vela nos 7 dias corridos até a
        última vela do acervo (cripto negocia todo dia), `inactive` parou antes,
        `unlisted` está no catálogo e nunca teve vela — antes o catálogo servido
        escondia esses, e ausência lê-se como inexistência."
      vocabulary:
        - active
        - inactive
        - unlisted
    - name: group
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: A família da commodity. É o eixo por onde se pergunta "quais são os
        críticos" ou "quais são os metais preciosos" — o nome da commodity
        sozinho não diz a que grupo ela pertence.
      vocabulary:
        - Minerais industriais
        - Terras raras e críticos
        - Metais básicos
        - Metais ferrosos e ligas
        - Materiais de construção
        - Metais preciosos
        - Fertilizantes
        - Energia
    - name: is_critical
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Se está na lista de MINERAIS CRÍTICOS do USGS — a designação
        oficial que sustenta política industrial e restrição de exportação nos
        EUA. Não é juízo sobre escassez geológica nem sobre preço.
      vocabulary:
        - "true"
        - "false"
    - name: units
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: 'A unidade em que as observações desta commodity vêm, e ela NÃO é
        única: 2 das 97 publicam em duas unidades ao mesmo tempo ("metric tons |
        thousand metric tons"), porque produção e reserva usam escalas
        diferentes. Somar as duas sem ler isto erra por mil.'
      vocabulary: null
    - name: usgs_label
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: "O nome COMO O USGS ESCREVEU, em inglês. Está aqui por procedência:
        a grafia muda entre edições do relatório, e é por isso que a chave do
        objeto é o slug e não este texto."
      vocabulary: null
    - name: first_year
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: "Primeiro ano com observação desta commodity no acervo. É início de
        COBERTURA e não de produção: o USGS publica uma janela de cinco anos por
        edição, e o mineral existia antes dela."
      vocabulary: null
    - name: last_year
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Último ano com observação. O ano mais recente costuma ser
        ESTIMATIVA do relatório, não número fechado — é assim que o Mineral
        Commodity Summaries publica a safra corrente.
      vocabulary: null
    - name: countries
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Quantos países aparecem produzindo ou detendo reserva desta
        commodity no último ano coberto. É a largura da aresta `produces`, e um
        número baixo é concentração real, não falta de dado — leia junto de
        `countries_withheld`.
      vocabulary: null
    - name: has_production
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Se o acervo tem observação de PRODUÇÃO desta commodity. Falso com
        `has_reserves` verdadeiro é o caso do mineral de que só se conhece a
        reserva, e a distinção muda o que dá para perguntar.
      vocabulary:
        - "true"
        - "false"
    - name: has_reserves
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Se o acervo tem observação de RESERVA. O USGS não publica reserva
        de tudo o que publica produção, e ausência aqui é a fonte não declarar,
        nunca reserva zero.
      vocabulary:
        - "true"
        - "false"
    - name: top_producer
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: "O maior produtor do último ano coberto, pelo recorte dominante —
        cobre tem produção de MINA e de REFINO, e misturá-los elegeria o maior
        refinador (China) como se fosse o maior minerador (Chile). Não é
        ponteiro para o objeto país: quem quer o país usa a aresta `produces`."
      vocabulary: null
    - name: top_producer_share_pct
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: A fatia do maior produtor no total mundial, em PONTOS PERCENTUAIS
        (`23.04` é 23,04%, não 0,2304). Nulo onde o share é incalculável —
        países reportando bases diferentes, como no boro —, e nulo é a verdade
        em vez de um número inventado.
      vocabulary: null
    - name: countries_withheld
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: Quantos países o relatório marcou como retidos (`W`, withheld) por
        sigilo comercial. Maior que zero significa que o total mundial existe e
        a repartição por país está incompleta — o share dos demais fica
        sobrestimado.
      vocabulary: null
    - name: edition_year
      kind: commodity
      source: USGS Mineral Commodity Summaries
      description: "O ano da EDIÇÃO do relatório de onde estes números saíram,
        publicado entre janeiro e abril. É a vintage da ficha: dois minerais
        lidos de edições diferentes não são comparáveis linha a linha."
      vocabulary: null
    - name: commodity_class
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: "A classe da commodity, e é ela que separa os dois universos do
        tipo: `agricola` e `energia` são as negociadas na B3, `mineral` e
        `metal` vêm do grupo do relatório do USGS (metal inclui o ouro, que é as
        duas coisas). É o corte de `listObjects(kind=commodity,
        where=commodity_class=agricola)`. Vocabulário declarado num seed do
        warehouse, nunca inferido do nome."
      vocabulary:
        - mineral
        - agricola
        - energia
        - metal
    - name: market
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: 'Onde a commodity NEGOCIA no acervo: `b3` para as sete com curva de
        ajuste. Ausente é "não temos pregão dela" — o cobre negocia na LME e a
        ausência aqui não afirma nada sobre o mundo. É o corte que separa a
        commodity negociada do mineral só estatístico.'
      vocabulary: null
    - name: b3_root
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: A RAIZ do contrato na B3 (`BGI` para boi gordo, `CCM` para milho).
        Três letras que prefixam todo vencimento — `BGIV26` é o boi de outubro
        de 2026 —, e é por ela que se lê a curva de ajuste.
      vocabulary: null
    - name: product_name
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: O nome do CONTRATO como a B3 o publica, não o da commodity. "Futuro
        de Soja com Liquidação Financeira pelo Preço do Contrato Futuro Míni de
        Soja do CME Group" diz o que se está negociando de fato, e é o que deve
        ser citado junto de qualquer preço, porque o ajuste não traz unidade de
        cotação.
      vocabulary: null
    - name: reference_owner
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: O dono do índice de terceiro a que o contrato é referenciado (CME
        Group na soja, Platts na soja FOB Santos). O ajuste é dado público da
        B3; exibir a MARCA do índice é que pede licença. Ausente = contrato sem
        referência de terceiro.
      vocabulary: null
    - name: first_trade_date
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: "Primeiro pregão com ajuste desta commodity no acervo. É início de
        OBSERVAÇÃO, não de listagem: o contrato é muito anterior à janela do
        lake, e a data diz até onde a série volta."
      vocabulary: null
    - name: last_trade_date
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: Último pregão com ajuste. Distância grande para hoje é coleta
        parada, não contrato encerrado — a curva por vencimento continua em
        `getCommodityCurve`.
      vocabulary: null
    - name: contracts_open
      kind: commodity
      source: Catálogo de commodities (USGS MCS + seed de derivativos da B3)
      description: "Quantos VENCIMENTOS tinham ajuste no último pregão — o tamanho da
        curva. NÃO é contrato em aberto (open interest), que a fonte não publica
        por commodity: ler este número como posição do mercado erra de grandeza
        e de significado."
      vocabulary: null
    - name: area_type
      kind: country
      source: ISO 3166-1 (pacote iso-codes)
      description: 'País ou BLOCO. A única pergunta que esta propriedade responde é
        "posso somar esta linha com as outras", e ela existe porque a resposta
        às vezes é não: a União Europeia é objeto do mesmo tipo que a Alemanha,
        com o mesmo formato de chave, e somá-las conta a Alemanha duas vezes
        devolvendo um número inteiramente plausível.'
      vocabulary:
        - country
        - bloc
    - name: name_en
      kind: country
      source: ISO 3166-1 (pacote iso-codes)
      description: O nome em inglês da norma. Serve para casar com fonte estrangeira
        que publica por nome e não por código — o nome servido pelo objeto é o
        português.
      vocabulary: null
    - name: taxonomy
      kind: sector
      source: Taxonomia controlada da fonte (informe mensal de FIDC, CVM)
      description: De QUEM é a classificação. `cvm_fidc` é o setor do LASTRO no
        informe mensal de FIDC. Rótulos iguais em taxonomias diferentes são
        objetos diferentes — nunca somar entre taxonomias.
      vocabulary: null
    - name: level
      kind: sector
      source: Taxonomia controlada da fonte (informe mensal de FIDC, CVM)
      description: 1 = categoria, 2 = subcategoria. `exposed_to_sector` publica as
        DUAS camadas do mesmo informe; quem agrega corta por um nível só, senão
        dobra a carteira com cara de normal. A hierarquia atravessável é
        `member_of`.
      vocabulary:
        - "1"
        - "2"
    - name: source_code
      kind: sector
      source: Taxonomia controlada da fonte (informe mensal de FIDC, CVM)
      description: O código como a fonte o escreve (`F2`), sem o prefixo da taxonomia.
      vocabulary: null
    - name: parent_key
      kind: sector
      source: Taxonomia controlada da fonte (informe mensal de FIDC, CVM)
      description: Chave da categoria acima (`cvm_fidc:F`), nula no topo. Leitura de
        ficha; para atravessar use `member_of`.
      vocabulary: null
    - name: layer
      kind: market_event
      source: Ledger de eventos de mercado
      description: "A CAMADA do evento: `estrutural` move o cenário inteiro (juro,
        câmbio, regulação), `setorial` move um setor e `corporativa` move uma
        empresa. É o corte que separa 'o que muda a tese' de 'o que muda a
        notícia'."
      vocabulary:
        - estrutural
        - setorial
        - corporativa
    - name: category
      kind: market_event
      source: Ledger de eventos de mercado
      description: O assunto do evento, no vocabulário do detector.
      vocabulary:
        - macro
        - politica
        - internacional
        - commodities
        - corporate
        - fii
        - cripto
        - mercado
        - outros
    - name: event_status
      kind: market_event
      source: Ledger de eventos de mercado
      description: Situação do evento no ledger. Prefixado porque `status` já é
        propriedade de outros tipos e o vocabulário é outro — sem o prefixo, um
        corte por `status` responderia duas coisas diferentes conforme o tipo da
        coorte.
      vocabulary:
        - ativo
        - arquivado
    - name: index_provider
      kind: index
      source: Cadastro de índices (B3 + ANBIMA), classificação do seed index_family
      description: "QUEM publica o índice. É o primeiro corte de qualquer triagem de
        índice porque separa dois mundos que não se comparam: `B3` são 17
        índices de renda variável com carteira teórica de ações, `ANBIMA` são os
        12 benchmarks de renda fixa da família IMA/IRF-M."
      vocabulary:
        - B3
        - ANBIMA
    - name: index_family
      kind: index
      source: Cadastro de índices (B3 + ANBIMA), classificação do seed index_family
      description: "A família do índice NO VOCABULÁRIO DO PRÓPRIO PUBLICADOR, e
        `index_provider` diz qual metade se aplica. Da B3: `amplo`,
        `segmento_setorial`, `governanca` — as três páginas de índice que cobrem
        os 17 códigos ingeridos. Da ANBIMA: `ima_b` (NTN-B, IPCA), `irf_m`
        (prefixados), `ima_s` (LFT), `ima_c` (NTN-C, descontinuados) e
        `ima_geral` (o agregado). A subfamília entra no lugar de um
        `renda_fixa_anbima` único porque `index_provider` já dá o corte grosso —
        repeti-lo aqui não acrescentaria nada."
      vocabulary:
        - amplo
        - segmento_setorial
        - governanca
        - ima_b
        - ima_c
        - ima_geral
        - ima_s
        - irf_m
    - name: index_rebalancing
      kind: index
      source: Cadastro de índices (B3 + ANBIMA), classificação do seed index_family
      description: Quando a carteira do índice é revista. Nos 17 da B3 é quadrimestral
        (`jan/mai/set (vigência fev/jun/out)`) e nos 12 da ANBIMA a propriedade
        NÃO APARECE — o boletim do IMA não publica calendário, e valor inventado
        seria pior que ausência.
      vocabulary: null
    - name: index_first_date
      kind: index
      source: Cadastro de índices (B3 + ANBIMA), classificação do seed index_family
      description: "Primeira observação da série do índice. É início de OBSERVAÇÃO e
        não de existência: índice anterior à janela do lake aparece com data
        mais recente que a real."
      vocabulary: null
    - name: index_last_date
      kind: index
      source: Cadastro de índices (B3 + ANBIMA), classificação do seed index_family
      description: "Última observação da série. É por ela que se lê índice
        DESCONTINUADO, não pela ausência do objeto: IMA-C parou em 2021-04-01 e
        IMA-C 5/5+ em 2011-03-01, e os três continuam sendo objeto porque quem
        reconstitui uma carteira de 2010 precisa deles."
      vocabulary: null
    - name: status
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: "Se a norma VALE hoje. `revogada` não apaga a história: a oferta
        feita sob a ICVM 476 segue ligada a ela por `regulated_by`, e é esta
        propriedade que diz que o regime não vale mais. Quem revogou está em
        `revoked_by` e na aresta `revokes`."
      vocabulary:
        - vigente
        - revogada
    - name: issuer
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: "Quem editou a norma: CVM, CMN, BCB ou o Congresso Nacional (lei).
        É o primeiro pedaço da chave (`cvm:res:88`) e o que separa uma Resolução
        CVM de uma Resolução CMN com o mesmo número."
      vocabulary:
        - CVM
        - CMN
        - BCB
        - Congresso Nacional
    - name: number
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: O número como a norma é citada (`88`, `476`, `6404`), sem ano — o
        ano vai em `year`.
      vocabulary: null
    - name: year
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: Ano da publicação. Lei é citada com número e ano (Lei 6.404/76);
        resolução da CVM só pelo número.
      vocabulary: null
    - name: title
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: "A EMENTA: sobre o que a norma dispõe, na redação oficial resumida.
        Não é o texto — o texto integral sai em
        `getObjectEvidence`/`searchDocuments` quando indexado."
      vocabulary: null
    - name: published_at
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: Data da publicação da norma (DOU). É a data que carimba as arestas
        `revokes` e `amends` de quem ela revoga ou altera.
      vocabulary: null
    - name: revoked_by
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: Chave da norma que a revogou (`cvm:res:160`), nula enquanto
        vigente. Leitura de ficha; a relação atravessável é `revokes` na direção
        `in`.
      vocabulary: null
    - name: nickname
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: 'Como o mercado a chama quando não usa o número: "Lei das S.A.",
        "Marco legal da securitização". Nulo quando não há apelido consagrado.'
      vocabulary: null
    - name: url_html
      kind: norm
      source: Catálogo curado de normas (seed), conferido contra a página oficial do
        emissor
      description: Página oficial da norma no site do emissor (CVM, BCB, Planalto). É
        de onde o texto integral é lido; cite-a como fonte.
      vocabulary: null
    - name: asset_family
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: A família do certificado. CRI é lastro imobiliário, CRA é
        agronegócio e OTS é o título de securitização genérico da Lei 14.430 —
        regimes e lastros diferentes sob a mesma mecânica.
      vocabulary:
        - CRI
        - CRA
        - OTS
    - name: layout_era
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Qual layout do informe esta linha usa. A CVM migrou o CRI em
        2022-07-01, ao dia: LTV, valor de aquisição, duration em anos/meses e
        segmento pararam de ser preenchidos e o patrimônio líquido da emissão
        começou. Sem isto, um LTV de 2022 seria lido como o LTV de hoje."
      vocabulary:
        - atual
        - anterior_2022_07
    - name: issue_number
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Número da emissão da securitizadora. É a chave que fecha o
        casamento com a oferta registrada na CVM — sem ele, o par (CNPJ, série)
        deixava 1.583 ofertas ambíguas.
      vocabulary: null
    - name: issue_date
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Data de emissão declarada do certificado. É o `obs_date` da aresta
        `issued` que liga a securitizadora a esta emissão.
      vocabulary: null
    - name: collateral_type
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Tipo do lastro declarado. Dois valores dominam o universo, e a
        distinção é entre comprar um contrato de dívida e comprar um fluxo de
        recebíveis.
      vocabulary:
        - Título de Dívida
        - Créditos
    - name: collateral_detail
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Detalhamento do lastro em texto livre, como a securitizadora
        escreveu. É onde aparece o que o tipo não diz — incorporação, aluguel,
        home equity, loteamento.
      vocabulary: null
    - name: guarantees
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: 'As garantias da emissão em texto livre. A coluna se chama
        sobrecolateralização na fonte e NÃO é número: traz "Alienação Fiduciária
        - Imóveis Cessão Fiduciária - Créditos Presentes Fiança". Nome de coluna
        não é documentação.'
      vocabulary: null
    - name: fiduciary_regime
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Se a emissão tem regime fiduciário instituído. É o que segrega o
        patrimônio da securitizadora: sem ele, o investidor concorre com os
        credores da emissora."
      vocabulary:
        - "true"
        - "false"
    - name: risk_retention_type
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Como o risco foi retido, em texto livre da fonte. Preenchido em ~2
        de 3 linhas, e 'Não há' é resposta declarada — que é diferente de campo
        vazio.
      vocabulary: null
    - name: risk_retainer
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Quem retém o risco, como declarado. É o complemento de
        `risk_retention_type`: sem ele, saber que há retenção não diz quem
        absorve a perda."
      vocabulary: null
    - name: trustee_name
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Agente fiduciário da emissão, pelo NOME. Não vira aresta de
        propósito: o CNPJ do prestador está preenchido em zero linhas desde a
        migração de layout, e casar casa por razão social liga a emissão à
        empresa errada."
      vocabulary: null
    - name: custodian_name
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Custodiante da emissão, pelo NOME. Mesma ressalva do agente
        fiduciário: sem CNPJ na fonte, não vira relação do grafo."
      vocabulary: null
    - name: rating_agency
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: Agência classificadora declarada no informe, as-filed. A fonte
        também escreve nome de agência no campo de CNPJ dela, então este texto é
        o que há — não é o cadastro da agência.
      vocabulary: null
    - name: credit_segment
      kind: securitization
      source: Informe mensal de securitizadora (CVM)
      description: "Segmento dos créditos vinculados. Campo da era ANTERIOR do layout
        do CRI: vazio desde 2022-07 e preenchido antes disso — leia junto de
        `layout_era` antes de concluir ausência."
      vocabulary: null
  aspects:
    - kind: company
      name: quotes
      id: market.quotes.history
      authority: projected
      stability: stable
      subject_key_type: ticker
      description: Cotações diárias de {ticker}, ajustadas por proventos por default
      operation: listQuotes
      parameter: ticker
      grain: paper
      shape: series
    - kind: company
      name: indicators
      id: market.indicators.latest
      authority: calculated
      stability: stable
      subject_key_type: ticker
      description: Indicadores fundamentalistas de {ticker}, TTM e consolidados
      operation: getStockIndicators
      parameter: ticker
      grain: paper
      shape: snapshot
    - kind: company
      name: corporate_events
      id: market.corporate_events.list
      authority: projected
      stability: stable
      subject_key_type: ticker
      description: Eventos societários MECÂNICOS de {ticker} — desdobramento,
        grupamento, bonificação, com o factor de ajuste por data-ex. Não é o
        ledger editorial de `getObjectEvents`
      operation: listCorporateEvents
      parameter: ticker
      grain: paper
      shape: event
    - kind: company
      name: documents
      id: documents.company.list
      authority: projected
      stability: stable
      subject_key_type: cvm_code
      description: Documentos entregues à CVM, por data de referência e de entrega. É
        da COMPANHIA, não do papel
      operation: listCompanyDocuments
      parameter: company
      grain: object
      shape: event
    - kind: company
      name: debentures
      id: credit.debentures.list
      authority: projected
      stability: stable
      subject_key_type: cnpj
      description: Debêntures emitidas por esta companhia
      operation: listDebentures
      parameter: issuerCnpj
      grain: object
      shape: static
    - kind: company
      name: insider
      id: market.insider.history
      authority: calculated
      stability: stable
      subject_key_type: ticker
      description: "Fluxo mensal de insiders (compras menos vendas de mercado). É do
        EMISSOR: qualquer papel desta companhia devolve os MESMOS números, então
        somar papéis conta a mesma movimentação duas vezes"
      operation: listInsiderMoves
      parameter: ticker
      grain: object
      shape: series
    - kind: company
      name: ratings
      id: credit.ratings.list
      authority: projected
      stability: preview
      subject_key_type: cnpj
      description: Rating de crédito vigente do emissor, por agência, com o documento
        de onde a nota foi lida. É do EMISSOR, não do papel; cobertura parcial
      operation: listCreditRatings
      parameter: issuerCnpj
      grain: object
      shape: event
    - kind: company
      name: us_filings
      id: us.filings.list
      authority: projected
      stability: stable
      subject_key_type: us_ticker
      description: Filings SEC de {ticker} (10-K, 10-Q, 8-K…), com link do documento
        no EDGAR. O tamanho e o frescor do acervo estão nas propriedades
        `us_filings_*`
      operation: listUsFilings
      parameter: ticker
      grain: object
      shape: event
    - kind: equity_security
      name: quotes
      id: market.quotes.history
      authority: projected
      stability: stable
      subject_key_type: ticker
      description: Cotações diárias de {ticker}, ajustadas por proventos por default
      operation: listQuotes
      parameter: ticker
      grain: object
      shape: series
    - kind: equity_security
      name: indicators
      id: market.indicators.latest
      authority: calculated
      stability: stable
      subject_key_type: ticker
      description: Indicadores fundamentalistas de {ticker}, TTM e consolidados
      operation: getStockIndicators
      parameter: ticker
      grain: object
      shape: snapshot
    - kind: equity_security
      name: corporate_events
      id: market.corporate_events.list
      authority: projected
      stability: stable
      subject_key_type: ticker
      description: Eventos societários MECÂNICOS de {ticker} — desdobramento,
        grupamento, bonificação, com o factor de ajuste por data-ex. A rota
        resolve os códigos antigos do papel. Não é o ledger editorial de
        `getObjectEvents`
      operation: listCorporateEvents
      parameter: ticker
      grain: object
      shape: event
    - kind: fund
      name: profile
      id: funds.profile.get
      authority: projected
      stability: stable
      subject_key_type: cnpj
      description: "Cadastro do fundo: administrador, gestor, taxas, situação"
      operation: getFund
      parameter: cnpj
      grain: object
      shape: static
    - kind: fund
      name: holdings
      id: funds.holdings.latest
      authority: projected
      stability: stable
      subject_key_type: cnpj
      description: Carteira declarada (CDA), por competência
      operation: listFundHoldings
      parameter: cnpj
      grain: object
      shape: snapshot
    - kind: fund
      name: regulation_terms
      id: credit.regulation.terms
      authority: canonical
      stability: preview
      subject_key_type: cnpj
      description: "O que o REGULAMENTO da classe estipula, com página e trecho
        literal por campo: índices de subordinação, eventos de avaliação e
        liquidação, limites de concentração, elegibilidade, taxas e cascata.
        Cobertura parcial e extração manual — ausência é 'ainda não extraído',
        nunca 'o regulamento não estipula'"
      operation: getFidcRegulationTerms
      parameter: cnpj
      grain: object
      shape: static
    - kind: instrument
      name: ratings
      id: credit.ratings.list
      authority: projected
      stability: preview
      subject_key_type: isin
      description: "Rating de crédito vigente do papel, por agência, com o documento
        de onde a nota foi lida. Cobertura parcial: ausência é 'ainda não
        observado', nunca 'sem nota'"
      operation: listCreditRatings
      parameter: assetCode
      grain: object
      shape: event
    - kind: index
      name: composition
      id: indices.composition.latest
      authority: projected
      stability: stable
      subject_key_type: index_code
      description: Carteira teórica do índice, com peso por papel
      operation: getIndexComposition
      parameter: code
      grain: object
      shape: snapshot
  examples:
    - operation: resolveObject
      input:
        q: PETR4
        kind: equity_security
      description: O papel PETR4 — não a companhia; para ela, atravesse `issued`.
    - operation: listObjects
      input:
        kind: company
        where: sector=Petróleo e Gás
