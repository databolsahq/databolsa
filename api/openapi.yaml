          type:
            - string
            - "null"
          enum:
            - rate
            - index
            - currency
            - share
            - ratio
            - score
            - ordinal
            - null
          description: O que o número É, no MESMO vocabulário da régua da série
            (`axes.dimension` em `getObjectFacts`/`getObjectHistory`) — é isso
            que torna esta rota e o fato bruto comparáveis. `score` é o par de
            regime, em [-1,1]; `ordinal` é o quadrante 1–4, que não se soma nem
            se tira média.
        scale:
          type:
            - string
            - "null"
          enum:
            - unit
            - thousand
            - million
            - billion
            - percent
            - bps
            - null
          description: "Quase tudo aqui é `unit` (decimal: 0,5576 e não 55,76) porque esta
            é a camada derivada. A série CRUA equivalente sai em
            `getObjectHistory` com `scale: percent` — o mesmo número em escalas
            100× diferentes, e antes deste campo nada dizia isso."
        period:
          type:
            - string
            - "null"
          enum:
            - none
            - monthly
            - quarterly
            - annual
            - ttm_12m
            - null
          description: Que janela o número cobre. `ipca_mensal` e `ipca_12m` são o mesmo
            indicador em janelas diferentes.
        expected_range:
          type:
            - object
            - "null"
          properties:
            min:
              type: number
            max:
              type: number
          required:
            - min
            - max
          description: Faixa plausível declarada, na escala deste campo. Guarda-corpo
            contra erro dimensional, não previsão.
        prior_note:
          type:
            - string
            - "null"
        entity_id:
          type:
            - string
            - "null"
          description: 'O ENDEREÇO deste indicador no grafo. Esta rota é um SNAPSHOT por
            seção: ela diz quanto é hoje e não tem eixo de tempo por indicador.
            Com o id, `getObjectHistory` devolve a série inteira e `rankObjects`
            ordena a coorte — sem precisar resolver o nome de novo, que é onde
            se perde o objeto certo (existem `ipca_mensal` e `ipca_12m`, e
            buscar "IPCA" não diz qual dos dois).'
