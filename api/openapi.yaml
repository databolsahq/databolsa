        - in: query
          name: instrumento
          schema:
            type: string
            enum:
              - acao
              - unit
              - bdr
              - bonus_subscricao
              - warrant
              - debenture
              - debenture_conversivel
              - debenture_permutavel
              - token_debenture
              - nota_comercial
              - letra_financeira
