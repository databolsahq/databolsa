                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listFidcPricing
      tags:
        - Credit
      parameters:
        - in: path
          name: cnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ completo do emissor, 14 dígitos sem pontuação.
          required: true
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Por quanto o fundo compra o risco, com a mediana dos pares ao lado
      description: >-
        O preço de ENTRADA — a que taxa o fundo comprou os direitos creditórios.
        É a peça que faltava para responder se um FIDC está caro ou barato: o
        informe já dizia o que o fundo tem e quanto disso não paga, e nunca
        dizia por quanto comprou. Sem isso não existe excesso de spread, o
        colchão que separa um fundo capaz de absorver perda de um que repassa
        direto para a cota.


        **As duas taxas não se somam.** `desconto_aquisicao` é o deságio pago na
        compra do recebível e `juros` é a remuneração embutida no papel;
        empilhá-las num "custo" único inventaria um número que não existe em
        lugar nenhum.


        `peer_median_buy_avg` viaja em toda linha porque **taxa isolada não
        informa nada**: a pergunta é "estou comprando a tanto, o setor está em
        quanto". É a mediana da mesma classe de ativo na mesma competência,
        calculada só sobre taxa plausível — incluir as marcadas puxaria a régua
        para um número que ninguém pagou. `buy_vs_peer_pp` positivo é comprar
        mais caro que os pares, o que pode ser risco maior **ou** negociação
        pior: a fonte não distingue os dois, e dizer qual seria inventar.


        `buy_spread` é a dispersão dentro da própria carteira. Um fundo que
        compra entre 10% e 300% não tem uma política de crédito, tem várias — e
        a média sozinha esconde isso.


        `rate_implausible` marca acima de 1.000 (valor em reais no campo de
        taxa). A faixa de 100 a 1.000 fica **sem marca de propósito**: desconto
        de factoring passa de 100% ao ano sem ser erro.


        Cerca de 27% das classes declaram alguma taxa numa competência típica.
        Resposta vazia é o normal da fonte, não falha de cobertura.
      x-capability: credit-market-data
      x-lifecycle: default
