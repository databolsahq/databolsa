          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Atalho: eventos de UM dia (equivale a from=to=date)."
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
