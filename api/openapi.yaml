      responses:
        "200":
          description: Objetos nos dois conjuntos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          description: Tipo do objeto como o servidor o publica; `string`, não enum.
                            `getObjectCensus` lista os vigentes.
                        subkind:
                          type:
                            - string
                            - "null"
                          description: "Fundo: `fidc`, `fii`, `fip`, `fif`, `fiagro`, `fiim`, `etf`,
                            `fapi`, `funcine`. Instrumento: `debenture`,
                            `securitizado`, `bdr`, `coe`, `tesouro`. Emissão de
                            securitização: `cri`, `cra`, `ots`; `securitizado` é
                            a série e `securitizacao` é a oferta. Papel: `on`,
                            `pn`, `unit`. Norma: `resolucao_cvm`,
                            `instrucao_cvm`, `deliberacao_cvm`,
                            `oficio_circular`, `resolucao_cmn`, `resolucao_bcb`,
                            `lei`, `decreto`, `medida_provisoria`. Prestador:
                            `gestora`, `administradora_fiduciaria`,
                            `assessoria`, `agencia_rating`; auditor e
                            custodiante não têm subtipo e aparecem pelas arestas
                            `audits` e `custodies`. Nulo significa não
                            classificado pela fonte, como fundos encerrados."
                        name:
                          type:
                            - string
                            - "null"
                        cnpj:
                          type:
                            - string
                            - "null"
                        tickers:
                          type:
                            - array
                            - "null"
                          items:
                            type: string
                        a_count:
                          type: integer
                          description: Contrapartes distintas na relação A, não afirmações.
                        b_count:
                          type:
                            - integer
                            - "null"
                          description: Contrapartes distintas na relação B. Nulo em `union` e
                            `difference`.
                      required:
                        - id
                        - kind
                        - subkind
                        - name
                        - cnpj
                        - tickers
                        - a_count
                        - b_count
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      total:
                        type: integer
                        description: Itens no universo filtrado, ignorando a paginação. Só com
                          `?total=true`.
                      subject:
                        type: object
                        additionalProperties:
                          type: string
                        description: Os parâmetros de caminho desta requisição, ecoados. Presente em
                          toda rota endereçada por um objeto. Use-o para
                          conferir a atribuição quando fizer chamadas
                          concorrentes — sem ele, resposta trocada e resposta
                          certa têm exatamente a mesma cara.
                      as_of:
                        type:
                          - string
                          - "null"
                        description: Data efetivamente aplicada; verbo de retrato recua até a última
                          competência publicada (`last_valid_to` em
                          `listObjectRelations`). Nulo quando a consulta mistura
                          formas.
                      as_of_by_rel:
                        type: object
                        additionalProperties:
                          type:
                            - string
                            - "null"
                        description: "Data efetivamente aplicada a cada verbo quando a consulta prende
                          mais de um: em retrato pode ter recuado; em evento é o
                          teto do corte."
                      excluded_shapes:
                        type: array
                        items:
                          type: string
                          enum:
                            - event
                            - snapshot
                            - static
                            - interval
                          description: "`event`: aconteceu numa data e se acumula (emissão, sucessão); a
                            contagem é o total. `snapshot`: retrato por
                            competência que substitui o anterior (carteira de
                            fundo, de índice); a contagem é o último retrato.
                            `static`: o registro publica só o vigente (gestor,
                            custodiante, auditor, sócio). `interval`: a fonte
                            declara começo e fim (registro na CVM, distribuição
                            de oferta); `valid_to` nulo é aberto."
                        description: Formas removidas do conjunto pela data. `static` sai quando `at` é
                          passado e a consulta não prende um verbo, porque o
                          registro só publica o vigente.
                      order:
                        type: string
                        enum:
                          - name
                          - a_count
                          - b_count
                          - total
                        description: Como a página foi ordenada.
                    required:
                      - next_cursor
                      - count
                      - order
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
