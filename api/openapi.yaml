              volatilidade, retorno_12m, volume_medio_2m) não têm série
              histórica: sob `at` anterior à janela corrente saem como null com
              `reason` explícito, nunca o valor atual. `free_float` vem do
              cadastro ATUAL (FRE, sem data): sob QUALQUER `at` sai null com
              `reason`."
