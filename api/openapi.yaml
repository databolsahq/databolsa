        CRI/CRA/LCI/LCA pelo código do instrumento no balcão. Para ações vem
        também o `cvm_code` da companhia, que abre os documentos e as
        demonstrações (esses endpoints também aceitam o ticker direto)."
  /v1/ingest:
    get:
      responses:
        "200":
          description: Saúde da ingestão
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest:
                    oneOf:
                      - $ref: "#/components/schemas/IngestRunDetail"
                      - type: "null"
                  latest_by_trigger:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestRunDetail"
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestSourceHealth"
                  pollers:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestPollerHealth"
                  recent_runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestRunSummary"
                required:
                  - latest
                  - latest_by_trigger
                  - sources
                  - pollers
                  - recent_runs
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getIngestHealth
      tags:
        - System
      parameters: []
      summary: Saúde da ingestão (pipeline, fontes, pollers, histórico)
      description: "`latest` é o último run do pipeline completo, não o último run a
        terminar: reparos e recargas pontuais têm trigger próprio e aparecem em
        `latest_by_trigger`, com as mensagens de erro em `errors`. Uma fonte
        pode estar fresca e oca ao mesmo tempo — `missing_ratio` mede a fração
        de partições sem dado e `status: incomplete` sinaliza quando ela deixa
        de ser sazonal. O frescor é julgado contra a cadência da própria fonte:
        `expected_max_age_days` é o intervalo de atualização que ela declara e
        `stale_after_days`, o silêncio tolerado antes de `status: stale`."
  /v1/portfolio:
