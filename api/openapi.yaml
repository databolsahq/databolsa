    SuitabilityEnvelope:
      type: object
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/SuitabilityProfile"
            - type: "null"
      required:
        - profile
    DocumentEntityType:
      type: string
      enum:
        - stock
        - fii
        - issuer
        - securitization
        - fidc
      description: stock = companhia com ação negociada · fii = fundo imobiliário ·
        issuer = companhia registrada apenas para emitir dívida (não tem ticker)
        · securitization = certificado CRI/CRA/OTS, identificado pelo ISIN ·
        fidc = fundo de direitos creditórios.
    DocumentCitation:
      type: object
      properties:
        ticker:
          type:
            - string
            - "null"
          description: Null para documento de crédito — use asset_code/issuer_cnpj.
        company_name:
          type:
            - string
            - "null"
        entity_type:
          type:
            - string
            - "null"
          enum:
            - stock
            - fii
            - issuer
            - securitization
            - fidc
            - null
        issuer_cnpj:
          type:
            - string
            - "null"
          description: CNPJ do emissor (14 dígitos). Null para ação e FII, que se
            identificam por ticker.
        asset_code:
          type:
            - string
            - "null"
          description: "Papel a que o documento se refere: ISIN, código ANBIMA ou código
            de instrumento B3."
        asset_family:
          type:
            - string
            - "null"
          enum:
            - DEB
            - CRI
            - CRA
            - OTS
            - FIDC
            - null
        doc_category:
          type:
            - string
            - "null"
          description: Categoria bruta da fonte.
        doc_type_raw:
          type:
            - string
            - "null"
          description: Subtipo bruto da fonte.
        document_kind:
          $ref: "#/components/schemas/DocumentKind"
        reference_date:
          type:
            - string
            - "null"
          format: date
          description: "Período a que o documento se REFERE (ex.: fim do trimestre
            coberto). Não é a data de publicação."
        filed_at:
          type:
            - string
            - "null"
          format: date
          description: Data em que o documento foi PROTOCOLADO/publicado na fonte
            (Data_Entrega). É a data que define disponibilidade point-in-time;
            pode ser semanas depois de reference_date.
        filed_at_source:
          type:
            - string
            - "null"
          enum:
            - source
            - null
          description: 'Qualidade de filed_at: "source" = veio da fonte oficial; null = a
            fonte não forneceu (nunca há fallback para reference_date).'
        protocol:
          type:
            - string
            - "null"
          description: Identificador do documento na fonte (protocolo CVM/FNET) —
            auditável em conjunto com source.
        source:
          type:
            - string
            - "null"
          description: "Conector de origem do documento (ex.: cvm_ipe, fnet_fii)."
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
        download_url:
          type:
            - string
            - "null"
          format: uri
        heading_path:
          type:
            - string
            - "null"
      required:
        - ticker
        - company_name
        - entity_type
        - issuer_cnpj
        - asset_code
        - asset_family
        - doc_category
        - doc_type_raw
        - document_kind
        - reference_date
        - filed_at
        - filed_at_source
        - protocol
        - source
        - page_start
        - download_url
        - heading_path
      additionalProperties: false
