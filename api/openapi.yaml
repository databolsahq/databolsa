              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listFidcPricing
      tags:
        - Credit
      parameters:
        - in: path
          name: cnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ completo do emissor, 14 dígitos sem pontuação.
          required: true
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Por quanto o fundo compra o risco, com a mediana dos pares ao lado
      description: >-
        O preço de ENTRADA — a que taxa o fundo comprou os direitos creditórios.
        É a peça que faltava para responder se um FIDC está caro ou barato: o
        informe já dizia o que o fundo tem e quanto disso não paga, e nunca
        dizia por quanto comprou. Sem isso não existe excesso de spread, o
        colchão que separa um fundo capaz de absorver perda de um que repassa
        direto para a cota.


        **As duas taxas não se somam.** `desconto_aquisicao` é o deságio pago na
        compra do recebível e `juros` é a remuneração embutida no papel;
        empilhá-las num "custo" único inventaria um número que não existe em
        lugar nenhum.


        `peer_median_buy_avg` viaja em toda linha porque **taxa isolada não
        informa nada**: a pergunta é "estou comprando a tanto, o setor está em
        quanto". É a mediana da mesma classe de ativo na mesma competência,
        calculada só sobre taxa plausível — incluir as marcadas puxaria a régua
        para um número que ninguém pagou. `buy_vs_peer_pp` positivo é comprar
        mais caro que os pares, o que pode ser risco maior **ou** negociação
        pior: a fonte não distingue os dois, e dizer qual seria inventar.


        `buy_spread` é a dispersão dentro da própria carteira. Um fundo que
        compra entre 10% e 300% não tem uma política de crédito, tem várias — e
        a média sozinha esconde isso.


        `rate_implausible` marca acima de 1.000 (valor em reais no campo de
        taxa). A faixa de 100 a 1.000 fica **sem marca de propósito**: desconto
        de factoring passa de 100% ao ano sem ser erro.


        Cerca de 27% das classes declaram alguma taxa numa competência típica.
        Resposta vazia é o normal da fonte, não falha de cobertura.
  /v1/credit/originators/{cnpj}:
    get:
      responses:
        "200":
          description: Classes que declaram este cedente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FidcOriginatorExposure"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      originator_cnpj:
                        type: string
                      reference_date:
                        type:
                          - string
                          - "null"
                      class_count:
                        type:
                          - number
                          - "null"
                    required:
                      - next_cursor
                      - count
                      - originator_cnpj
                      - reference_date
                      - class_count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listFidcOriginatorExposure
      tags:
        - Credit
      parameters:
        - in: path
          name: cnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ completo do emissor, 14 dígitos sem pontuação.
          required: true
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Em quais FIDCs este CNPJ aparece como cedente
      description: >-
        A pergunta inversa de `/credit/fidc/{cnpj}/originators`, e a que muda
        uma decisão: dado um CNPJ, **em quantas classes de FIDC ele originou os
        recebíveis, e com que peso em cada uma**.


        É o que revela concentração disfarçada de diversificação. Uma carteira
        com quatro FIDCs de gestores diferentes, lastros diferentes e prospectos
        diferentes pode depender do mesmo originador em três deles — e nenhum
        dos quatro relatórios mensais que o investidor recebe diz isso, porque
        cada um enxerga só o próprio fundo.


        `net_worth`, `portfolio` e `impaired_ratio` da classe viajam na resposta
        para que a exposição seja dimensionável sem uma segunda chamada: 5% de
        um fundo de R$ 3 bilhões e 60% de um de R$ 20 milhões não são o mesmo
        risco. Vêm null quando a classe declarou cedente e não tem linha de
        patrimônio na competência — a linha de exposição permanece, porque
        omiti-la esconderia justamente o que a rota existe para mostrar.


        `class_count` no `meta` conta **classes distintas**, não linhas: o mesmo
        cedente aparece nos dois blocos de risco da mesma classe e em mais de um
        slot da declaração, e contar linhas inflaria a exposição.


        Só CNPJ é consultável. Cedente pessoa física existe na fonte e o CPF não
        é indexado aqui — as fontes federais de enriquecimento publicam CPF
        mascarado, então não há cruzamento possível, e manter a PII consultável
        só criaria exposição sem uso.
