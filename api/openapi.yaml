      additionalProperties: false
      description: Documento de report estruturado, com seções e blocos discriminados
        por `kind`. O schema é gerado do mesmo validador que aceita escritas no
        servidor; erros voltam com o caminho do campo violado.
    PortfolioHolding:
      type: object
      description: Posição computada da carteira (snake_case, como todo o /v1).
        `asset_type` e `transactions[].trade_date` são os MESMOS campos do
        ledger (listPortfolioTransactions). Valores monetários sempre em BRL;
        ativos em moeda estrangeira (asset_type=us) expõem também currency,
        price_native (US$) e fx_rate.
      properties:
        symbol:
          type: string
        asset_type:
          type: string
          description: stock | fii | etf | bdr | fund | tesouro | rf | crypto | us.
        name:
          type: string
        qty:
          type: number
        avg_price:
          type:
            - number
            - "null"
          description: Preço médio de custo (null = custo desconhecido/watchlist).
        invested_cost:
          type:
            - number
            - "null"
        cost_basis_known:
          type: boolean
          description: true quando todos os buy/sell têm preço → P&L confiável.
        price:
          type:
            - number
            - "null"
          description: Cotação atual em BRL (null = sem cotação).
        change_pct:
          type:
            - number
            - "null"
        market_value:
          type:
            - number
            - "null"
        unrealized_pl:
          type:
            - number
            - "null"
          description: Resultado não-realizado em R$. Com valuation=accrual (renda fixa
            privada) é RENDIMENTO acruado pela taxa contratada, não marcação a
            mercado.
        unrealized_pct:
          type:
            - number
            - "null"
          description: Percentual sobre o custo. null quando o percentual é indefinido —
            veja unrealized_pct_reason.
        unrealized_pct_reason:
          type:
            - string
            - "null"
          enum:
            - zero_cost
            - cost_unknown
            - null
          description: "Por que unrealized_pct é null numa posição aberta e valorada:
            zero_cost = custo abaixo de um centavo (resíduo de fusão/bonificação
            — o percentual é indefinido, não 0 nem centenas de por cento);
            cost_unknown = há buy/sell sem preço no ledger. null = percentual
            definido."
        valuation:
          type:
            - string
            - "null"
          enum:
            - market
            - accrual
            - cost
            - null
          description: "Como a posição foi valorada: market = cotação; accrual = renda
            fixa privada acruada pela taxa contratada (não existe preço público
            do papel); cost = sem cotação, marcada pelo custo remanescente; null
            = sem valor de mercado."
        realized_pl:
          type:
            - number
            - "null"
        realized_by_month:
          type: object
          additionalProperties:
            type: number
          description: "'AAAA-MM' → R$ realizado no mês."
        income_received:
          type: number
          description: Proventos recebidos acumulados (R$).
        income_by_month:
          type: object
          additionalProperties:
            type: number
          description: "'AAAA-MM' → R$ de proventos no mês."
        weight_pct:
          type:
            - number
            - "null"
        day_change_brl:
          type:
            - number
            - "null"
        added_at:
          type:
            - string
            - "null"
          description: Data da 1ª transação (AAAA-MM-DD).
        tx_count:
          type: integer
          description: Nº de transações da posição.
        closed:
          type: boolean
          description: qty = 0 com transações (posição encerrada).
        is_watchlist:
          type: boolean
          description: Entrada sem nenhuma transação (radar).
        priced:
          type: boolean
        renamed_to:
          type:
            - string
            - "null"
          description: Ticker vigente quando o papel foi renomeado/incorporado.
        merged_from:
          type:
            - array
            - "null"
          items:
            type: string
          description: "Tickers antigos fundidos nesta posição por sucessão (ex.:
            ['BCFF11'] num holding BTHF11). O ledger em `transactions` já inclui
            as transações dos predecessores. null = nenhum."
        currency:
          type: string
          description: Moeda nativa de negociação (BRL | USD).
        price_native:
          type:
            - number
            - "null"
          description: Cotação na moeda nativa quando ≠ BRL.
        fx_rate:
          type:
            - number
            - "null"
          description: Câmbio usado na marcação (price = price_native × fx_rate).
        asset_id:
          type:
            - string
            - "null"
          description: Id do ativo no ledger (correlaciona com /assets e /transactions).
        meta:
          description: "portfolio_assets.meta (ex.: { rf: { indexer, rate } })."
        transactions:
          type: array
          description: Ledger da posição, ordenado por trade_date. Só presente com
            `include=transactions`; o mesmo dado, por ativo, está em
            listPortfolioTransactions.
          items:
            $ref: "#/components/schemas/PortfolioTransaction"
      required:
        - symbol
        - asset_type
        - qty
    PortfolioByCarteira:
      type: object
      properties:
        name:
          type: string
        patrimonio:
          type: number
        unrealized_pct:
          type: number
        open_positions:
          type: integer
          description: Posições com quantidade > 0 nesta carteira.
        watchlist_entries:
          type: integer
          description: Entradas sem nenhuma transação (radar) nesta carteira.
      required:
        - name
        - patrimonio
        - unrealized_pct
        - open_positions
        - watchlist_entries
    PortfolioListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ledger_assets:
          type: integer
          description: Nº de LINHAS DE ATIVO no ledger da carteira. Inclui posições já
            encerradas e tickers predecessores fundidos por sucessão, que não
            têm holding próprio — por isso é ≥ holdings_count do detalhe, que
            por sua vez é ≥ open_positions.
        created_at:
          type: string
          format: date-time
        exclude_from_consolidated:
          type: boolean
          description: true = carteira de simulação.
      required:
        - id
        - name
    PortfolioDetail:
      type: object
      description: "Carteira computada: posições derivadas do ledger + métricas
        agregadas (snake_case)."
      properties:
        id:
          type: string
        name:
          type: string
        visibility:
          type: string
        created_at:
          type:
            - string
            - "null"
        exclude_from_consolidated:
          type: boolean
          description: true = carteira de simulação.
        holdings_count:
          type: integer
          description: Linhas devolvidas em holdings[] (abertas + encerradas + watchlist).
        open_positions:
          type: integer
          description: Posições com quantidade > 0.
        closed_positions:
          type: integer
          description: Posições zeradas por venda (qty = 0 com transações).
        watchlist_entries:
          type: integer
          description: Entradas sem nenhuma transação (radar).
        merged_assets:
          type: integer
          description: Tickers predecessores fundidos nas posições por sucessão. Contam em
            ledger_assets (listPortfolios) e não em holdings_count — é a
            diferença entre as duas contagens.
        patrimonio:
          type: number
        invested:
          type: number
        unrealized_pl:
          type: number
        unrealized_pct:
          type: number
        realized_pl:
          type: number
        realized_by_month:
          type: object
          additionalProperties:
            type: number
        income_received:
          type: number
        income_by_month:
          type: object
          additionalProperties:
            type: number
        total_pl:
          type: number
          description: unrealized_pl + realized_pl.
        xirr:
          type:
            - number
            - "null"
          description: "XIRR (TIR anualizada, money-weighted): o retorno REAL do
            investidor sobre os fluxos datados (aportes/resgates/proventos) +
            patrimônio a mercado como valor terminal. Decimal a.a. (0,1423 =
            14,23%). null quando custo desconhecido, fluxo sem TIR definível ou
            implausível (> +300% a.a., artefato de giro/curto prazo → use o
            twr). Mesmo valor de returns.xirr, onde ele aparece ao lado do
            time-weighted."
        returns:
          $ref: "#/components/schemas/PortfolioReturns"
        day_change_brl:
          type: number
        day_change_pct:
          type: number
        kind_mix:
          type: string
          description: "Resumo humano, ex.: '3 ações · 2 FIIs'."
        is_watchlist:
          type: boolean
        any_unpriced:
          type: boolean
        any_cost_unknown:
          type: boolean
        holdings:
          type: array
          description: Posições com qty, preço médio, valor de mercado, P&L, proventos e
            peso.
          items:
            $ref: "#/components/schemas/PortfolioHolding"
    PortfolioTransaction:
      type: object
      description: Transação do ledger. É o MESMO shape das transações embutidas em
        PortfolioHolding.transactions.
      properties:
        id:
          type: string
        kind:
          type: string
          description: buy | sell | split | adjust
        trade_date:
          type: string
          description: AAAA-MM-DD
        quantity:
          type: number
        price:
          type:
            - number
            - "null"
          description: Preço unitário (null = custo desconhecido).
        fees:
          type: number
        ratio:
          type:
            - number
            - "null"
          description: Fator do split (só kind=split).
        currency:
          type: string
        note:
          type:
            - string
            - "null"
        event_kind:
          type:
            - string
            - "null"
          description: "Subtipo do evento societário de origem quando a transação veio de
            evento (import da Movimentação B3): split | bonus | incorporation |
            subscription | fraction. null = lançamento comum."
      required:
        - id
        - kind
        - trade_date
        - quantity
    PortfolioTwr:
      type:
        - object
        - "null"
      description: TWR (time-weighted return) derivado da série mensal — neutraliza o
        efeito do timing dos aportes, o número comparável a benchmark
        (CDI/IBOV/IPCA). null quando não há período válido.
      properties:
        cumulative:
          type: number
          description: Retorno acumulado na janela (decimal; 0,25 = +25%).
        annualized:
          type:
            - number
            - "null"
          description: Equivalente anualizado (decimal).
        months:
          type: integer
          description: Meses na grade.
    PortfolioReturns:
      type: object
      description: As DUAS medidas de retorno da carteira no mesmo objeto. Elas
        divergem sempre que os aportes não são uniformes — é esperado, não é
        erro, e `explain` diz isso em uma linha.
      properties:
        xirr:
          type:
            - number
            - "null"
          description: Money-weighted anualizada (decimal a.a.).
        twr:
          $ref: "#/components/schemas/PortfolioTwr"
        explain:
          type: string
          description: Nota curta sobre a diferença entre as duas medidas.
    PortfolioHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            description: "Um mês: patrimônio, aporte acumulado, proventos e realizado."
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            twr:
              $ref: "#/components/schemas/PortfolioTwr"
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
    PortfolioHistoryDetailResponse:
      type: object
      description: "Histórico de UMA carteira: a série mensal em `data`, o TWR e a
        nota que o separa da xirr do detalhe em `meta`."
      properties:
        data:
          type: array
          items:
            type: object
            description: "Um mês: patrimônio, aporte acumulado, proventos e realizado."
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            twr:
              $ref: "#/components/schemas/PortfolioTwr"
            returns_explain:
              type: string
              description: Por que o twr daqui difere da xirr do detalhe da carteira
                (time-weighted × money-weighted).
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
    PortfolioImportSummary:
      type: object
      description: Resumo de um import de planilha (o detalhe linha a linha fica em
        listPortfolioImportRows).
      properties:
        import_id:
          type: string
        source:
          type: string
          description: negociacao | movimentacao | manual (detectado pelo cabeçalho).
        parsed:
          type: integer
          description: Linhas entendidas no arquivo.
        imported:
          type: integer
          description: Lançamentos novos gravados.
        duplicates_skipped:
          type: integer
          description: Lançamentos já existentes (reimport) pulados.
        rows_ignored:
          type: integer
        cross_source_skipped:
          type: integer
          description: Trades pulados por já estarem cobertos por outra fonte.
        symbols:
          type: integer
        period:
          type: object
          properties:
            from:
              type:
                - string
                - "null"
            to:
              type:
                - string
                - "null"
        warnings:
          type: array
          items:
            type: string
          description: Até 10 avisos.
        warnings_truncated:
          type: integer
          description: Nº de avisos omitidos além dos 10 primeiros.
      required:
        - import_id
        - source
        - imported
    PortfolioImportListItem:
      type: object
      properties:
        id:
          type: string
        filename:
          type:
            - string
            - "null"
        source:
          type: string
        created_at:
          type: string
          format: date-time
        summary:
          type: object
        warnings:
          type: array
          items:
            type: string
      required:
        - id
        - source
    PortfolioImportRow:
      type: object
      properties:
        row_index:
          type: integer
        status:
          type: string
          description: imported | ignored | duplicate | error
        kind:
          type:
            - string
            - "null"
        label:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        external_id:
          type:
            - string
            - "null"
        raw: {}
      required:
        - row_index
        - status
    PortfolioPosition:
      type: object
      description: Posição resumida do consolidado (o detalhe completo vem em
        getPortfolioDetail).
      properties:
        symbol:
          type: string
        asset_type:
          type: string
        qty:
          type: number
        weight_pct:
          type:
            - number
            - "null"
        market_value:
          type:
            - number
            - "null"
        unrealized_pct:
          type:
            - number
            - "null"
      required:
        - symbol
        - asset_type
        - qty
    PortfolioContext:
      type: object
      description: Carteira consolidada do usuário (mesmo resumo que o agente de IA usa).
      properties:
        has_portfolio:
          type: boolean
        carteiras:
          type: integer
        patrimonio:
          type: number
        invested:
          type: number
        unrealized_pl:
          type: number
        unrealized_pct:
          type: number
        realized_pl:
          type: number
        xirr:
          type:
            - number
            - "null"
          description: XIRR (TIR anualizada, money-weighted) do consolidado. Decimal a.a.
            (0,14 = 14%).
        day_change_brl:
          type: number
        kind_mix:
          type: string
        any_unpriced:
          type: boolean
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPosition"
          description: Todas as posições consolidadas (qty > 0), ordenadas por valor
            (maiores primeiro).
        by_carteira:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioByCarteira"
      required:
        - has_portfolio
        - carteiras
        - patrimonio
        - invested
        - unrealized_pl
        - unrealized_pct
        - realized_pl
        - day_change_brl
        - kind_mix
        - any_unpriced
        - positions
        - by_carteira
    SuitabilityProfile:
      type: object
      properties:
        level:
          type: string
          enum:
            - Conservador
            - Moderado
            - Arrojado
        score:
          type: integer
          description: Posição na régua 0–100 (Conservador→Arrojado), não uma nota.
        answers:
          type: array
          items:
            type: object
            properties:
              q:
                type: string
              a:
                type: string
            required:
              - q
              - a
        updatedAt:
          type: string
      required:
        - level
        - score
        - answers
        - updatedAt
    SuitabilityEnvelope:
      type: object
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/SuitabilityProfile"
            - type: "null"
      required:
        - profile
    DocumentCitation:
      type: object
      properties:
        ticker:
          type:
            - string
            - "null"
        company_name:
          type:
            - string
            - "null"
        doc_category:
          type:
            - string
            - "null"
          description: Categoria bruta da fonte.
        doc_type_raw:
          type:
            - string
            - "null"
          description: Subtipo bruto da fonte.
        document_kind:
          $ref: "#/components/schemas/DocumentKind"
        reference_date:
          type:
            - string
            - "null"
          format: date
          description: "Período a que o documento se REFERE (ex.: fim do trimestre
            coberto). Não é a data de publicação."
        filed_at:
          type:
            - string
            - "null"
          format: date
          description: Data em que o documento foi PROTOCOLADO/publicado na fonte
            (Data_Entrega). É a data que define disponibilidade point-in-time;
            pode ser semanas depois de reference_date.
        filed_at_source:
          type:
            - string
            - "null"
          enum:
            - source
            - null
          description: 'Qualidade de filed_at: "source" = veio da fonte oficial; null = a
            fonte não forneceu (nunca há fallback para reference_date).'
        protocol:
          type:
            - string
            - "null"
          description: Identificador do documento na fonte (protocolo CVM/FNET) —
            auditável em conjunto com source.
        source:
          type:
            - string
            - "null"
          description: "Conector de origem do documento (ex.: cvm_ipe, fnet_fii)."
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
        download_url:
          type:
            - string
            - "null"
          format: uri
        heading_path:
          type:
            - string
            - "null"
      required:
        - ticker
        - company_name
        - doc_category
        - doc_type_raw
        - document_kind
        - reference_date
        - filed_at
        - filed_at_source
        - protocol
        - source
        - page_start
        - download_url
        - heading_path
      additionalProperties: false
    DocumentChunk:
      type: object
      properties:
        text:
          type: string
        text_expanded:
          type: string
          description: Entorno costurado (context-expansion), quando disponível.
        score:
          type: number
          minimum: -1
          maximum: 1
          description: Similaridade (1 - distância cosseno).
        ticker:
          type:
            - string
            - "null"
          deprecated: true
        company_name:
          type:
            - string
            - "null"
          deprecated: true
        doc_category:
          type:
            - string
            - "null"
          deprecated: true
        doc_type:
          type:
            - string
            - "null"
          deprecated: true
        reference_date:
          type:
            - string
            - "null"
          format: date
          deprecated: true
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
          deprecated: true
        download_url:
          type:
            - string
            - "null"
          format: uri
          deprecated: true
        heading_path:
          type:
            - string
            - "null"
          deprecated: true
        citation:
          $ref: "#/components/schemas/DocumentCitation"
        is_table:
          type: boolean
      required:
        - text
        - score
        - citation
        - is_table
      additionalProperties: false
    DocumentTaxonomy:
      type: object
      properties:
        kinds:
          type: array
          items:
            type: object
            properties:
              kind:
                $ref: "#/components/schemas/DocumentKind"
              label:
                type: string
              document_count:
                type: integer
                minimum: 0
              categories:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type:
                        - string
                        - "null"
                    doc_type_raw:
                      type:
                        - string
                        - "null"
                    document_count:
                      type: integer
                      minimum: 0
                  required:
                    - category
                    - doc_type_raw
                    - document_count
                  additionalProperties: false
            required:
              - kind
              - label
              - document_count
              - categories
            additionalProperties: false
        entity_types:
          type: array
          items:
            type: string
            enum:
              - stock
              - fii
        reference_years:
          type: object
          properties:
            min:
              type:
                - integer
                - "null"
            max:
              type:
                - integer
                - "null"
          required:
            - min
            - max
          additionalProperties: false
      required:
        - kinds
        - entity_types
        - reference_years
      additionalProperties: false
    MarketEventSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: integer
                description: Use em /v1/events/{id} e /v1/events/{id}/similar.
              dedup_key:
                type: string
                description: Chave de idempotência do evento na origem.
              day:
                type: string
                description: Dia BRT do evento (AAAA-MM-DD).
              layer:
                type: string
                description: estrutural | setorial | corporativa
              category:
                type: string
                description: macro | politica | internacional | commodities | corporate | fii |
                  cripto | mercado | outros
              title:
                type: string
              summary:
                type:
                  - string
                  - "null"
              entities:
                type: array
                items:
                  type: string
              tickers:
                type: array
                items:
                  type: string
                description: Um papel por posição.
              transmission_channels:
                type: array
                items:
                  type: string
                description: dolar | ibov | brent | curva | selic
              score:
                type:
                  - number
                  - "null"
                description: Rank do funil (imprensa) ou |z| (mercado) — NÃO é a relevância da
                  busca.
              detectors:
                type: array
                items:
                  type: string
                description: official | press | market
              thread_slug:
                type:
                  - string
                  - "null"
                description: Use em /v1/events/threads/{slug}.
              source_refs:
                type: array
                items:
                  type: object
              similarity:
                type: number
                description: Relevância semântica desta busca (maior = mais próximo da
                  pergunta).
            required:
              - event_id
              - dedup_key
              - day
              - layer
              - category
              - title
              - similarity
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
    DocumentSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
            context:
              type: string
              description: Bloco pronto p/ prompt, com citação por trecho. Vazio quando
                include_context=false.
            warnings:
              type: array
              items:
                type: string
              description: "Avisos de semântica da busca (ex.: exclusão de documentos sem
                filed_at no modo point-in-time). Ausente quando não há avisos."
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
tags:
  - name: Companies
    description: Companhias abertas (cadastro CVM) e demonstrações
  - name: Stocks
    description: Ações — cotações, indicadores, proventos e eventos
  - name: Quotes
    description: Cotações ao vivo (delay de 15 min) — lote e séries intradiárias
  - name: FIIs
    description: Fundos imobiliários — indicadores e distribuições
  - name: Bonds
    description: Títulos públicos (Tesouro Direto) e curvas de juros
  - name: Crypto
    description: Criptoativos — catálogo, velas diárias em BRL e cotações quase-live
  - name: EUA
    description: Ativos dos EUA (S&P 500/Nasdaq-100 + ETFs) — EOD em USD,
      fundamentos e filings SEC
  - name: Indices
    description: Índices da B3 (IBOV, IFIX, ...) e composições
  - name: Events
    description: Ledger de eventos de mercado e mundo — o que foi relevante em cada
      dia (decisões de juros, medidas provisórias, tarifas, geopolítica,
      anomalias de preço), com fontes. Não confunda com eventos SOCIETÁRIOS
      (listCorporateEvents) nem com a agenda de resultados (earnings).
  - name: Market
    description: Microestrutura de mercado — fluxo por perfil de investidor
  - name: Primary Market
    description: Mercado primário — ofertas públicas de distribuição (CVM)
  - name: BDR
    description: BDRs (recibos de ações estrangeiras) — catálogo e cotações
  - name: ETFs
    description: ETFs listados na B3 — catálogo (gestor, CNPJ, segmento)
  - name: Funds
    description: Fundos de investimento (CVM 175) — perfil, cota diária e screener
  - name: Options
    description: Opções sobre ações — cadeia vigente e histórico EOD
  - name: Macro
    description: Séries macroeconômicas, expectativas Focus e regime
  - name: Screener
    description: Filtros multi-critério sobre ações e FIIs
  - name: System
    description: Saúde e metadados da API
  - name: Carteira
    description: Carteira e perfil do usuário dono da chave de API
  - name: Documentos
    description: Busca semântica no texto de documentos CVM/B3
  - name: Teses
    description: "Teses de investimento do dono da chave: documentos estruturados de
      research (capa, rating, cenários, fontes) salvos na conta, compartilháveis
      por link público e exportáveis em PDF."
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default: &a1
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getHealth
      tags:
        - System
      parameters: []
      summary: Status da API e frescor dos dados
      security: []
  /v1/companies:
    get:
      responses:
        "200":
          description: Página de companhias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listCompanies
      tags:
        - Companies
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: sector
          schema:
            type: string
            description: Setor (match exato, case-sensitive). Valor desconhecido → página
              vazia.
        - in: query
          name: segment
          schema:
            type: string
            description: "Segmento de listagem B3 (substring, case-insensitive), ex.: 'Novo
              Mercado'."
        - in: query
          name: search
          schema:
            type: string
            description: Busca por nome ou ticker da companhia.
      summary: Lista companhias abertas (cadastro CVM)
  /v1/companies/{company}:
    get:
      responses:
        "200":
          description: Companhia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default: *a1
      operationId: getCompany
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: Ticker do papel (BBAS3) OU código CVM numérico da companhia (1023).
          required: true
      summary: Companhia por ticker ou código CVM
  /v1/companies/{company}/documents:
    get:
      responses:
        "200":
          description: Página de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listCompanyDocuments
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: Ticker do papel (BBAS3) OU código CVM numérico da companhia (1023).
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: kind
          schema:
            $ref: "#/components/schemas/DocumentKind"
            description: "Tipo estável do documento (mesma taxonomia do campo `kind` da
              resposta). Prefira este filtro a `category`: a categoria é texto
              livre em português e muda com a fonte."
        - in: query
          name: category
          schema:
            type: string
            description: "Categoria bruta do documento no IPE/CVM, ex.: 'Fato Relevante',
              'Comunicado ao Mercado', 'Aviso aos Acionistas', 'Assembleia',
              'Dados Econômico-Financeiros'."
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Filtra a DATA DE REFERÊNCIA do documento (período a que ele se
              refere), não a de protocolo — um DFP do exercício 2022 é entregue
              em 2023 e aparece em from/to de 2022. A data de entrega segue no
              campo `filed_at` de cada documento.
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fim do período (data de referência, inclusive).
      summary: Documentos e comunicados (IPE/CVM)
      description: Fatos relevantes, comunicados e documentos protocolados na CVM
        (IPE) da companhia. Aceita ticker (BBAS3) ou código CVM (1023). Filtre
        por `kind` (taxonomia estável), `category` (texto bruto da fonte) e
        período (`from`/`to`); paginação por cursor.
  /v1/companies/{company}/statements:
    get:
      responses:
        "200":
          description: Página de demonstrações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyStatement"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
