                          - median
                          - min
                          - max
                          - count
                      group_by:
                        type: string
                      group_by_kind:
                        type: string
                        enum:
                          - property
                          - edge
                          - time
                        description: Natureza do grupo, resolvida pelo servidor a partir do nome.
                      source:
                        type: string
                      cadence:
                        type: string
                        enum:
                          - daily
                          - weekly
                          - monthly
                          - quarterly
                          - annual
                          - irregular
                        description: Frequência de publicação da fonte. `irregular` cobre papéis que não
                          negociam todo dia e séries sem calendário fixo. Não é
                          a janela coberta pelo número, que fica em
                          `axes.period`.
                      grain:
                        type: string
                        enum:
                          - object
                          - paper
                        description: "`object`: uma resposta para o objeto inteiro; somar papéis
                          duplica. `paper`: varia por classe de ação; peça por
                          papel."
                      description:
                        type: string
                      cohort_objects:
                        type: integer
                        description: Coorte inteira, com ou sem valor na medida. Em `rankObjects`,
                          `cohort_size` conta só quem tem valor.
                      cohort_with_value:
                        type: integer
                        description: Objetos da coorte com valor na medida; equivale a `cohort_size` de
                          `rankObjects`.
                      cohort_value:
                        type:
                          - number
                          - "null"
                        description: "Agregação sobre a coorte inteira, calculada antes do agrupamento:
                          inclui `ungrouped` e não depende de `limit`. Leia aqui
                          o total; não some a página. Nulo sem valores."
                      excluded_out_of_prior:
                        type:
                          - integer
                          - "null"
                        description: Objetos excluídos por `exclude_out_of_prior=true`. Nulo sem filtro,
                          sem `fact` ou sem faixa declarada; zero significa
                          faixa aplicada sem exclusões.
                      since:
                        type:
                          - string
                          - "null"
                        description: "Data-base mínima efetiva do valor, como em `rankObjects`: por
                          default, a janela da cadência da medida relativa a
                          `at`. Nula no censo e em medida `irregular`."
                      since_policy:
                        type:
                          - string
                          - "null"
                        enum:
                          - caller
                          - cadence
                          - null
                        description: "Origem do corte de frescor: `since` do chamador ou default da
                          cadência. Nulo sem corte."
                      stale_excluded:
                        type:
                          - integer
                          - "null"
                        description: Objetos com valor excluídos do total por data-base anterior a
                          `since`. Nulo sem corte de frescor.
                      order_by:
                        type: string
                        enum:
                          - value
                          - objects
                        description: "Como a página foi ordenada e cortada: pela agregação (`value`) ou
                          pelo tamanho do grupo (`objects`)."
                      total_groups:
                        type: integer
                        description: Grupos existentes na coorte, incluindo os que não couberam em
                          `data`.
                      groups_truncated:
                        type: boolean
                        description: "`true` quando `total_groups` excede os grupos devolvidos; `data`
                          traz os maiores, não o total."
                      ungrouped:
                        type: integer
                        description: "Objetos da coorte fora de todo grupo: sem a propriedade, sem a
                          relação ou, no balde temporal, sem valor elegível para
                          cair num período."
                      multi_group:
                        type: integer
                        description: Objetos em mais de um grupo. Zero em verbos funcionais como
                          `manages`; alto em `issued`, onde `sum` conta a
                          companhia por emissão.
                      filterable_properties:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            vocabulary:
                              type:
                                - array
                                - "null"
                              items:
                                type: string
                          required:
                            - name
                            - vocabulary
                        description: Propriedades que aceitam corte por palavra nesta coorte, com os
                          valores possíveis, como em `rankObjects`.
                      groupable:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                              enum:
                                - property
                                - edge
                          required:
                            - name
                            - kind
                        description: Eixos de agrupamento aceitos neste tipo.
                      empty_reason:
                        type: string
                        description: Por que `data` veio vazia; o caso comum é direção invertida, e o
                          campo nomeia a que funcionaria. Ausente quando há
                          grupos.
                    required:
                      - next_cursor
                      - count
                      - fact
                      - unit
                      - agg
                      - group_by
                      - group_by_kind
                      - source
                      - cadence
                      - grain
                      - description
                      - cohort_objects
                      - cohort_with_value
                      - cohort_value
                      - excluded_out_of_prior
                      - since
                      - since_policy
                      - stale_excluded
                      - order_by
                      - total_groups
                      - groups_truncated
                      - ungrouped
                      - multi_group
                      - filterable_properties
                      - groupable
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: aggregateObjects
      tags:
        - Objects
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: O tipo dos objetos que entram na coorte.
          required: true
        - in: query
          name: subkind
          schema:
            type: string
            description: Recorte dentro do tipo.
          required: false
        - in: query
          name: fact
          schema:
            type: string
            description: Medida a resumir, pelo nome de `listFactCatalog`. Omita com
              `agg=count` para contar objetos por grupo, o único caminho para
              tipos que só têm propriedades.
          required: false
        - in: query
          name: agg
          schema:
            type: string
            enum:
              - sum
              - avg
              - median
              - min
              - max
              - count
            description: Redução por grupo. `sum` é recusado em `pct`, `ratio`, `x` e
              `points`. `count` conta objetos com valor na medida; sem `fact`,
              conta todos os objetos do grupo.
          required: true
        - in: query
          name: group_by
          schema:
            type: string
            description: "Eixo do agrupamento: propriedade (`situation`), relação
              (`manages`, com `group_by_direction`) ou balde de tempo (`year`,
              `quarter`, `month`, que exigem `fact`). `meta.groupable` lista as
              opções e `meta.group_by_kind` informa a usada."
          required: true
        - in: query
          name: group_by_direction
          schema:
            type: string
            enum:
              - in
              - out
            default: out
            description: Lado da coorte na aresta quando `group_by` é relação, como em
              `rel_direction`. Direção errada devolve lista vazia e
              `meta.empty_reason` indica a correta.
          required: false
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data-base dos valores e vigência das relações da coorte. Sem `at`,
              usa o valor mais recente por objeto e o acervo histórico das
              relações, como `listObjectLinks`.
          required: false
        - in: query
          name: rel
          schema:
            type: string
            description: Restringe a coorte a quem tem esta relação com `rel_to`.
          required: false
        - in: query
          name: rel_to
          schema:
            type: string
            description: O outro lado de `rel`.
          required: false
        - in: query
          name: rel_direction
          schema:
            type: string
            enum:
              - in
              - out
            default: in
            description: Onde a coorte está na aresta de `rel`.
          required: false
        - in: query
          name: where
          schema:
            type: string
            description: Os mesmos cortes de `rankObjects`, por número e por palavra,
              aplicados antes do agrupamento.
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Grupos por página (1–200, default 50).
          required: false
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor de `meta.next_cursor` da página anterior de grupos.
          required: false
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
            maxLength: 120
            description: Busca no rótulo do grupo, sem acento nem caixa. `meta.total_groups`
              conta só os que casam.
          required: false
        - in: query
          name: order_by
          schema:
            type: string
            enum:
              - value
              - objects
            default: value
            description: Ordena e corta a página pela agregação (`value`) ou pelo número de
              objetos do grupo (`objects`).
          required: false
        - in: query
          name: since
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data-base mínima aceita no valor, como em `rankObjects`. Sem ela, a
              cadência da medida define o piso e `meta.stale_excluded` conta os
              objetos parados que ficaram fora. `meta.since` e `since_policy`
              informam o corte efetivo.
          required: false
        - in: query
          name: exclude_out_of_prior
          schema:
            type: boolean
            description: Exclui da agregação os valores fora da faixa plausível declarada
              para `fact`. `meta.excluded_out_of_prior` informa quantos valores
              saíram; vem nulo quando o filtro não foi pedido ou a medida não
              declara faixa. No censo sem `fact`, não há medida a validar.
          required: false
      summary: Agrega uma coorte por propriedade ou relação
      description: >-
        Agrega a mesma coorte de `rankObjects`, recortada por `kind`, `subkind`,
        relações e `where`. `group_by` aceita propriedade ou relação;
        `meta.group_by_kind` identifica o caso e grupos relacionais trazem
        `entity_id`. Use `group_by_direction` para indicar onde a coorte está na
        aresta.


        `sum` é recusado para percentual, razão, múltiplo e ponto de índice;
        `avg`, `median`, `min` e `max` preservam a unidade. Sem `fact`,
        `agg=count` conta objetos. `cohort_objects`, `cohort_with_value`,
        `ungrouped` e `multi_group` mostram cobertura e sobreposição; ausência
        de valor produz `null`, nunca zero.


        Leia o total da coorte em `meta.cohort_value`, não somando a página.
        `cursor` pagina os grupos, `q` filtra seus rótulos e `order_by` escolhe
        ordenar pelo valor ou pelo número de objetos.
      x-capability: object-context
      x-lifecycle: object-native
  /v1/objects/rank:
