                description: official | press | market
              thread_slug:
                type:
                  - string
                  - "null"
                description: Use em /v1/events/threads/{slug}.
              source_refs:
                type: array
                items:
                  type: object
              similarity:
                type: number
                description: Relevância semântica desta busca (maior = mais próximo da
                  pergunta).
            required:
              - event_id
              - dedup_key
              - day
              - layer
              - category
              - title
              - similarity
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
    DocumentSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
            context:
              type: string
              description: Bloco pronto p/ prompt, com citação por trecho. Vazio quando
                include_context=false.
            warnings:
              type: array
              items:
                type: string
              description: "Avisos de semântica da busca (ex.: exclusão de documentos sem
                filed_at no modo point-in-time). Ausente quando não há avisos."
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
tags:
  - name: Companies
    description: Companhias abertas (cadastro CVM) e demonstrações
  - name: Stocks
    description: Ações — cotações, indicadores, proventos e eventos
  - name: Quotes
    description: Cotações ao vivo (delay de 15 min) — lote e séries intradiárias
  - name: FIIs
    description: Fundos imobiliários — indicadores e distribuições
  - name: Bonds
    description: Títulos públicos (Tesouro Direto) e curvas de juros
  - name: Credit
    description: Crédito privado — debêntures, CRI/CRA, FIDC, ratings, curvas de
      crédito, risco de emissor e negócios de balcão. É a maior superfície de
      renda fixa privada do contrato. Não confunda com Bonds (título público)
      nem com Estruturados (COE).
  - name: Commodities
    description: "Ajuste diário dos contratos FUTUROS de mercadoria na B3 (boi
      gordo, milho, café, etanol, soja, ouro). ATENÇÃO: é preço de ajuste por
      vencimento, NÃO preço à vista — o vencimento mais curto é base futura, não
      spot. Para o preço internacional de Brent, minério de ferro e soja use as
      séries de getSeries (fonte fred)."
  - name: Minerais
    description: "Produção e reservas de MINERAIS por país (lítio, cobre, nióbio,
      cobalto, terras raras, grafita, ferro, ouro, fosfato...), da publicação
      Mineral Commodity Summaries do USGS. Responde quem produz e quem detém
      reserva, em quantidade física e participação no total mundial. Não
      confunda com Commodities, que é ajuste de contrato FUTURO da B3 em BRL:
      aqui não há preço. 'Reserves' é estimativa geológica agregada por país,
      NÃO reserva provada sob SEC S-K 1300, JORC ou NI 43-101."
  - name: Crypto
    description: Criptoativos — catálogo, velas diárias em BRL e cotações quase-live
  - name: EUA
    description: Ativos dos EUA (S&P 500/Nasdaq-100 + ETFs) — EOD em USD,
      fundamentos e filings SEC
  - name: Indices
    description: Índices da B3 (IBOV, IFIX, ...) e composições
  - name: Events
    description: Ledger de eventos de mercado e mundo — o que foi relevante em cada
      dia (decisões de juros, medidas provisórias, tarifas, geopolítica,
      anomalias de preço), com fontes. Não confunda com eventos SOCIETÁRIOS
      (listCorporateEvents) nem com a agenda de resultados (earnings).
  - name: Market
    description: Microestrutura de mercado — fluxo por perfil de investidor
  - name: Primary Market
    description: Mercado primário — ofertas públicas de distribuição (CVM)
  - name: BDR
    description: BDRs (recibos de ações estrangeiras) — catálogo e cotações
  - name: ETFs
    description: ETFs listados na B3 — catálogo (gestor, CNPJ, segmento)
  - name: Funds
    description: Fundos de investimento (CVM 175) — perfil, cota diária e screener
  - name: Options
    description: Opções sobre ações — cadeia vigente e histórico EOD
  - name: Estruturados
    description: "COE (Certificado de Operações Estruturadas) registrado no balcão.
      Categoria à parte de Bonds e Credit de propósito: o retorno NÃO é fixo. É
      um payoff de derivativo embrulhado no risco de crédito do banco emissor —
      o investidor carrega os dois. O registro público dá emissor, tamanho,
      prazo e liquidez secundária; a estrutura (proteção de capital, subjacente,
      cenários) vive no DIE e não está aqui."
  - name: Macro
    description: Séries macroeconômicas, expectativas Focus e regime
  - name: Screener
    description: Filtros multi-critério sobre ações e FIIs
  - name: System
    description: Saúde e metadados da API
  - name: Carteira
    description: Carteira e perfil do usuário dono da chave de API
  - name: Documentos
    description: Busca semântica no texto de documentos CVM/B3
  - name: Teses
    description: "Teses de investimento do dono da chave: documentos de research
      escritos em markdown (capa, rating, cenários, fontes) salvos na conta,
      compartilháveis por link público e exportáveis em PDF."
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getHealth
      tags:
        - System
      parameters: []
      summary: Status da API e frescor dos dados
      security: []
  /v1/companies:
    get:
      responses:
        "200":
          description: Página de companhias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listCompanies
      tags:
        - Companies
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: sector
          schema:
            type: string
            description: Setor (match exato, case-sensitive). Valor desconhecido → página
              vazia.
        - in: query
          name: segment
          schema:
            type: string
            description: "Segmento de listagem B3 (substring, case-insensitive), ex.: 'Novo
              Mercado'."
        - in: query
          name: search
          schema:
            type: string
            description: Busca por nome ou ticker da companhia.
      summary: Lista companhias abertas (cadastro CVM)
  /v1/companies/{company}:
    get:
      responses:
        "200":
          description: Companhia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getCompany
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: "Ticker do papel (BBAS3), código CVM numérico da companhia (1023)
              OU CNPJ de 14 dígitos (10531501000158). O CNPJ é a porta para a
              companhia SEM ação em bolsa: quem se registra na CVM apenas para
              emitir dívida (Categoria B) entrega demonstração financeira
              completa e não tem ticker. Debênture, FIDC e informe de
              securitização identificam o emissor por CNPJ, nunca por cd_cvm."
          required: true
      summary: Companhia por ticker, código CVM ou CNPJ
  /v1/companies/{company}/documents:
    get:
      responses:
        "200":
          description: Página de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listCompanyDocuments
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: "Ticker do papel (BBAS3), código CVM numérico da companhia (1023)
              OU CNPJ de 14 dígitos (10531501000158). O CNPJ é a porta para a
              companhia SEM ação em bolsa: quem se registra na CVM apenas para
              emitir dívida (Categoria B) entrega demonstração financeira
              completa e não tem ticker. Debênture, FIDC e informe de
              securitização identificam o emissor por CNPJ, nunca por cd_cvm."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: kind
          schema:
            $ref: "#/components/schemas/DocumentKind"
            description: "Tipo estável do documento (mesma taxonomia do campo `kind` da
              resposta). Prefira este filtro a `category`: a categoria é texto
              livre em português e muda com a fonte."
        - in: query
          name: category
          schema:
            type: string
            description: "Categoria bruta do documento no IPE/CVM, ex.: 'Fato Relevante',
              'Comunicado ao Mercado', 'Aviso aos Acionistas', 'Assembleia',
              'Dados Econômico-Financeiros'."
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Filtra a DATA DE REFERÊNCIA do documento (período a que ele se
              refere), não a de protocolo — um DFP do exercício 2022 é entregue
              em 2023 e aparece em from/to de 2022. A data de entrega segue no
              campo `filed_at` de cada documento.
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fim do período (data de referência, inclusive).
      summary: Documentos e comunicados (IPE/CVM)
      description: Fatos relevantes, comunicados e documentos protocolados na CVM
        (IPE) da companhia. Aceita ticker (BBAS3), código CVM (1023) ou CNPJ de
        14 dígitos (10531501000158). Filtre por `kind` (taxonomia estável),
        `category` (texto bruto da fonte) e período (`from`/`to`); paginação por
        cursor.
  /v1/companies/{company}/statements:
    get:
      responses:
        "200":
          description: Página de demonstrações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyStatement"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listCompanyStatements
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: "Ticker do papel (BBAS3), código CVM numérico da companhia (1023)
              OU CNPJ de 14 dígitos (10531501000158). O CNPJ é a porta para a
              companhia SEM ação em bolsa: quem se registra na CVM apenas para
              emitir dívida (Categoria B) entrega demonstração financeira
              completa e não tem ticker. Debênture, FIDC e informe de
              securitização identificam o emissor por CNPJ, nunca por cd_cvm."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: scope
          schema:
            type: string
            enum:
              - con
              - ind
            description: con = consolidado, ind = controladora; omitir retorna ambos.
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Início do período (ref_date, fim do trimestre contábil).
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fim do período (ref_date, inclusive).
      summary: Demonstrações financeiras estruturadas (TTM + balanço)
      description: "Aceita ticker (BBAS3), código CVM (1023) ou CNPJ de 14 dígitos
        (10531501000158). O CNPJ é a porta para a companhia SEM ação em bolsa:
        quem se registra na CVM apenas para emitir dívida (Categoria B) entrega
        a mesma demonstração trimestral e não tem ticker — e debênture, FIDC e
        informe de securitização identificam o emissor por CNPJ. Séries
        estruturadas por trimestre (CVM DFP/ITR): fluxos em TTM (receita, EBIT,
        EBITDA, lucro, caixa operacional/livre, capex) e balanço ponto-no-tempo
        (ativos, caixa, dívida, patrimônio). Valores em R$ (unidade), escopo
        consolidado e controladora. `filed_at` traz a 1ª publicação na CVM para
        corte point-in-time sem lookahead. `from`/`to` filtram ref_date;
        paginação por cursor."
  /v1/quotes/live:
    get:
      responses:
        "200":
          description: Lote de cotações ao vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveQuote"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      as_of:
                        type: string
                        description: Instante da resposta (ISO 8601).
                    required:
                      - next_cursor
                      - count
                      - as_of
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getLiveQuotes
      tags:
        - Quotes
      parameters:
        - in: query
          name: tickers
          schema:
            type: string
            description: Tickers separados por vírgula (máx 200). Exclusivo com 'index'.
        - in: query
          name: index
          schema:
            type: string
            description: "Código de índice (ex.: IBOV) — resolve os constituintes. Exclusivo
              com 'tickers'."
      summary: Cotações ao vivo (delay de 15 min) em lote
      description: Último preço de vários papéis de uma vez, com delay de 15 min
        durante o pregão. Informe `tickers` (CSV, máx 200) OU `index` (código,
        resolve os constituintes). Durante o pregão o preço vem do intradiário
        (`source=intraday`); fora dele, do fechamento oficial (`source=eod`).
        Tickers desconhecidos são omitidos.
  /v1/stocks/{ticker}:
    get:
      responses:
        "200":
          description: Ação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getStock
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
      summary: Perfil e última cotação do papel
  /v1/stocks/{ticker}/quotes:
    get:
      responses:
        "200":
          description: Página de cotações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listQuotes
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 100
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: adjusted
          schema:
            type: string
      summary: Série de cotações OHLCV
      description: Ajustada por eventos por default; `from`/`to` filtram o período
        (from <= to).
  /v1/stocks/{ticker}/intraday:
    get:
      responses:
        "200":
          description: Série intradiária
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IntradayPoint"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      ticker:
                        type: string
                      session_date:
                        type: string
                      prev_close:
                        type:
                          - number
                          - "null"
                      sessions_behind:
                        type: integer
                        description: "Pregões entre `session_date` e a última sessão do mercado. 0 = a
                          série é do pregão corrente. > 0 = série ANTIGA: sem o
                          parâmetro `session`, esta rota devolve a última sessão
                          que o caminho intradiário conseguiu registrar, e ela
                          pode estar parada — em 07/2026 a B3 desativou o
                          endpoint que a alimentava (Comunicado Externo
                          01/2026-VTEC) e a série congelou. Os pontos seguem
                          fiéis ao pregão que descrevem; este campo diz QUAL
                          pregão é. O fechamento oficial não depende deste
                          caminho e continua fresco."
                    required:
                      - next_cursor
                      - count
                      - ticker
                      - session_date
                      - prev_close
                      - sessions_behind
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getStockIntraday
      tags:
        - Quotes
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: session
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Sessão (AAAA-MM-DD); default = sessão intradiária mais recente.
      summary: Série intradiária da sessão (delay de 15 min)
      description: Barras de minuto do pregão; `session` filtra o pregão (default =
        mais recente).
  /v1/stocks/{ticker}/indicators:
    get:
      responses:
        "200":
          description: Indicadores do papel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndicatorValue"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      ticker:
                        type: string
                      reference_date:
                        type: string
                      statement_date:
                        type:
                          - string
                          - "null"
                        description: Fim do período contábil da demonstração usada (DT_REFER)
                      filed_at:
                        type:
                          - string
                          - "null"
                        description: "1ª publicação da demonstração na CVM (DT_RECEB) — é o corte que
                          `at` respeita. null: data de entrega desconhecida; o
                          corte de `at` cai no período contábil."
                      is_financial:
                        type: boolean
                    required:
                      - next_cursor
                      - count
                      - ticker
                      - reference_date
                      - statement_date
                      - filed_at
                      - is_financial
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getStockIndicators
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: names
          schema:
            type: string
            description: "Lista separada por vírgula de indicadores a retornar (omitir =
              todos). Ex.: 'pl,roe,dy'. Nomes válidos (abreviações SEM
              underscore — use 'pl', não 'p_l'): pl, pvp, psr, ev_ebitda,
              ev_ebit, lpa, vpa, roe, roa, roic, margem_bruta, margem_ebit,
              margem_liquida, div_liq_ebitda, div_liq_pl, dy, payout,
              market_cap, price; e dinâmicos: free_float, beta, volatilidade,
              retorno_12m, volume_medio_2m."
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Snapshot point-in-time SEM lookahead: retorna a última
