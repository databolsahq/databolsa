      tags:
        - Carteira
      summary: Histórico de imports
      description: Lista os imports já feitos nesta carteira (arquivo, fonte, data e
        resumo persistido).
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Imports da carteira.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioImportListItem"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
