      summary: Fundos de investimento que detêm o ativo (visão reversa do CDA)
      description: "Quais fundos têm o ativo em carteira e quanto (R$), da competência
        mais recente do CDA (CVM). Ordenado por posição a mercado. Use `date` p/
        outra competência. ESCOPO: é a posição DECLARADA em carteira — não
        inclui ações cedidas em empréstimo nem desconta obrigações por ações
        recebidas. Isso diverge de `/ownership-flow/movers`, que usa posição
        ECONÔMICA: em 2026-05 há R$ 10,53 bi cedidos e R$ 11,21 bi de obrigação,
        e 428 dos 2.770 pares fundo×ativo existem SÓ como empréstimo, logo
        aparecem numa rota e não na outra. As duas respondem perguntas
        diferentes; não some uma com a outra."
