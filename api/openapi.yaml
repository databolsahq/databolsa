    get:
      responses:
        "200":
          description: Página de movimentações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundTickerMove"
                  meta:
                    type: object
