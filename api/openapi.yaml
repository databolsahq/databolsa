          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Competência (AAAA-MM-DD); default = mais recente.
        - in: query
          name: ticker
          schema:
            type: string
            description: "Filtra a exposição a um único papel (ex.: 'PETR4')."
      summary: Exposição a ativos listados somando a carteira direta e a via cotas
      description: >-
        Quanto o fundo tem de cada papel contando o que ele detém diretamente
        (`exposure_direct_brl`) MAIS a parcela que chega através das cotas de
        outros fundos (`exposure_indirect_brl`), com 1 salto de profundidade — o
        2º salto acrescentaria apenas 12,4% e o 1º já captura 88,9% do valor
        indireto conhecível.


        O número é um PISO, jamais um total: o BLC_4 divulgado cobre a mediana
        de 36,3% do PL dos fundos investidos e só 3,3% dos alvos diretos
        reportam ativo que resolve para ticker. `indirect_coverage_pct` diz que
        fração do valor em cotas foi possível abrir; quando ela é null, não
        sabemos abrir nada — o que não significa exposição zero.
