  /v1/portfolios/{id}:
    get:
      operationId: getPortfolioDetail
      tags:
        - Carteira
      summary: Detalhe de uma carteira
      description: "Carteira computada: posições com preço médio, quantidade, valor de
        mercado, P&L, proventos e alocação, além dos totais e das duas medidas
        de retorno (`returns`). A resposta é COMPACTA por default: `holdings[]`
        traz só posições abertas + watchlist (sem as encerradas) e sem as séries
        mensais por posição — os totais e agregados mensais da carteira vêm
        sempre. Use `include` para compor as camadas opcionais. A posição é
        derivada do ledger de transações, que NÃO vem embutido: peça
        `include=transactions` quando precisar dele, ou use
        listPortfolioTransactions por ativo."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira (de listPortfolios).
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: "Camadas opcionais, separadas por vírgula (compõem, ex.:
            `closed,monthly`). `closed` inclui as posições ENCERRADAS em
            holdings[] (default: só abertas + watchlist); `monthly` inclui as
            séries mensais por posição (realized_by_month/income_by_month — os
            agregados da carteira vêm sempre); `transactions` embute o ledger
            completo em cada posição — dezenas de vezes maior que o payload
            padrão numa carteira com histórico."
          schema:
            type: string
            example: closed,monthly
      responses:
        "200":
          description: Carteira computada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDetail"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePortfolio
      tags:
        - Carteira
      summary: Editar carteira
      description: "ALTERA a carteira REAL do dono da chave: renomeia (`name`), muda a
        visibilidade (`visibility`) e/ou marca como simulação
        (`exclude_from_consolidated`, fora do consolidado). Informe ao menos um
        campo."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Novo nome (até 60 caracteres, único na conta).
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                  description: Nova visibilidade.
                exclude_from_consolidated:
                  type: boolean
                  description: true = carteira de simulação (fora do consolidado).
      responses:
        "200":
          description: Campos alterados.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deletePortfolio
      tags:
        - Carteira
      summary: Apagar carteira
      description: APAGA a carteira REAL do dono da chave, com TODOS os ativos e
        transações (cascata, irreversível). Confirme com o usuário antes de
        chamar.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Carteira apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/history:
    get:
      operationId: getPortfolioHistoryById
      tags:
        - Carteira
      summary: Histórico mensal de uma carteira
      description: Série mensal (patrimônio, aporte, proventos, realizado) de UMA
        carteira específica, com o TWR time-weighted. A xirr money-weighted da
        mesma carteira está em getPortfolioDetail (`returns`).
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Pontos mensais em `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHistoryDetailResponse"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/xray:
    get:
      operationId: getPortfolioXray
      tags:
        - Carteira
      summary: Raio-X de concentração da carteira
      description: "Análise DETERMINÍSTICA de concentração da carteira em UMA chamada
        (substitui detalhe + perfil ativo a ativo): distribuição por classe
        (`by_class`), por setor/segmento das posições de bolsa (`by_sector`; sem
        classificação conhecida vira 'Sem classificação'), por indexador da
        renda fixa (`by_indexer` — Tesouro pelo tipo do título, CDB/debênture
        pelo contrato ou catálogo; pct sobre o TOTAL DE RENDA FIXA, não da
        carteira), por moeda (`by_currency`, BRL × USD) e as 10 maiores posições
        (`top_positions`). `flags` traz FATOS pt-BR quando um limite estoura
        (posição >10%, setor >25%, classe >60%, indexador >70% da RF, moeda
        estrangeira >30%) — sem opinião nem recomendação; a leitura é sua.
        Valores CRUS em BRL, percentuais 0-100. Considera só posições ABERTAS
        com valor (mercado, accrual de renda fixa ou custo); abertas sem valor
        nenhum são ignoradas e contadas em `meta.unpriced_ignored`."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira (de listPortfolios).
          schema:
            type: string
      responses:
        "200":
          description: Raio-X da carteira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioXray"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/costs:
    get:
      operationId: getPortfolioCosts
      tags:
        - Carteira
      summary: Raio-X de custos recorrentes da carteira
      description: "Estimativa DETERMINÍSTICA de quanto a carteira paga por ano, PARA
        QUEM, e o que está acima da referência — só a partir de dado público e
        do contrato informado: taxa de administração as-filed dos fundos
        (comparada à MEDIANA dos pares da mesma classificação CVM, quando há ≥20
        pares com ≥100 cotistas e informe fresco), custódia do Tesouro Direto na
        B3 (0,20% a.a.; Tesouro Selic isento até R$ 10 mil de estoque) e gap de
        renda fixa bancária TRIBUTÁVEL (CDB/RDB/LC/LF) contratada abaixo de 100%
        do CDI (estimado com o CDI acumulado 12m). `items` traz cada custo com
        destinatário (`recipient`), referência (`benchmark`) e a parcela acima
        dela (`excess_cost_brl`); `by_recipient` agrega por destinatário;
        `totals` soma tudo. O que NÃO é observável (LCI/LCA isentas, taxas
        internas de ETF/FII, spread de compra de debênture, custos de corretora)
        vira `not_estimated` com o motivo — nunca número inventado. `flags` são
        FATOS pt-BR (fundo acima da mediana; RF abaixo de 100% do CDI) — sem
        opinião nem recomendação; a leitura é sua. Considera só posições abertas
        com valor."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira (de listPortfolios).
          schema:
            type: string
      responses:
        "200":
          description: Raio-X de custos da carteira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioCosts"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/look-through:
    get:
      operationId: getPortfolioLookThrough
      tags:
        - Carteira
      summary: Exposição efetiva (abre as posições em fundos)
      description: "Exposição EFETIVA da carteira em UMA chamada: abre cada posição em
        FUNDO (símbolo = CNPJ) usando a última carteira mensal DIVULGADA do
        fundo e converte cada ação/debênture detida em exposição indireta
        proporcional (valor da posição × peso do ativo no fundo). Fundo que
        detém cotas de OUTRO fundo é aberto em mais UM nível e para aí.
        `exposures` agrega por ativo (top 50 por valor): posição direta,
        indireta, total, % da carteira e por quais fundos chega (`via`) — a
        sobreposição direto × fundo é o ponto. `funds_opened` diz a competência
        usada, quanto do fundo os ativos divulgados explicam (`coverage_pct`) e
        o denominador (`method`: patrimônio oficial na competência, ou soma dos
        ativos divulgados quando ele falta). `not_opened` lista fundos sem
        carteira divulgada. Valores CRUS em BRL, pct 0-100. CAVEAT: a carteira
        divulgada é defasada (semanas/meses) — NÃO é a posição de hoje do fundo;
        a cobertura costuma ser parcial, então a exposição indireta é PISO, não
        total. Carteira sem fundos responde 200 com arrays vazios e
        `meta.note`."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira (de listPortfolios).
          schema:
            type: string
      responses:
        "200":
          description: Exposição efetiva da carteira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioLookThrough"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/assets:
    post:
      operationId: addPortfolioAsset
      tags:
        - Carteira
      summary: Adicionar ativo à carteira
      description: "ADICIONA um ativo à carteira REAL do dono da chave (idempotente —
        repetir não duplica). Ativo sem transações funciona como watchlist;
        lance transações para rastrear posição. Para Tesouro Direto use o nome
        oficial do título (ex.: TESOURO SELIC 2029). Para fundo
        (asset_type=fund) use o CNPJ da classe (14 dígitos, com ou sem máscara);
        para debênture, o código do papel (ex.: ELTN17); para
        CRI/CRA/LCI/LCA/CDB use asset_type=renda_fixa com o código do
        instrumento no balcão (ex.: CRA021000RX) — com negócio recente no
        secundário a posição é marcada a mercado, senão vale o accrual da taxa
        contratada."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
              properties:
                asset_type:
                  type: string
                  enum:
                    - stock
                    - fii
                    - etf
                    - bdr
                    - index
                    - tesouro
                    - crypto
                    - option
                    - renda_fixa
                    - debenture
                    - fund
                    - us
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: "Ticker (ex.: PETR4) ou nome oficial do título do Tesouro."
      responses:
        "201":
          description: Ativo na carteira.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removePortfolioAsset
      tags:
        - Carteira
      summary: Remover ativo da carteira
      description: REMOVE um ativo da carteira REAL do dono da chave, APAGANDO o
        ledger de transações dele nesta carteira (cascata, irreversível).
        Confirme com o usuário antes de chamar.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo.
          schema:
            type: string
            enum:
              - stock
              - fii
              - etf
              - bdr
              - index
              - tesouro
              - crypto
              - option
              - renda_fixa
              - debenture
              - fund
              - us
        - name: symbol
          in: query
          required: true
          description: Ticker ou nome do título.
          schema:
            type: string
      responses:
        "200":
          description: Ativo removido.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePortfolioAsset
      tags:
        - Carteira
      summary: Taxa contratada de renda fixa
      description: "DEFINE a taxa contratada de uma posição de renda fixa (para o
        cálculo de rendimento): `rf_indexer` (cdi = % do CDI, prefixado = %
        a.a., ipca = IPCA + % a.a.) e `rf_rate`. Use `rf_indexer: none` para
        limpar."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo (renda_fixa/tesouro).
          schema:
            type: string
        - name: symbol
          in: query
          required: true
          description: Código do papel.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rf_indexer
              properties:
                rf_indexer:
                  type: string
                  enum:
                    - cdi
                    - prefixado
                    - ipca
                    - none
                  description: Indexador (none limpa a taxa).
                rf_rate:
                  type: number
                  description: "Taxa (ex.: 110 = 110% do CDI; 6.2 = IPCA+6,2%)."
      responses:
        "200":
          description: Meta da posição.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/transactions:
    get:
      operationId: listPortfolioTransactions
      tags:
        - Carteira
      summary: Ledger de um ativo
      description: Lista as transações (compras, vendas, splits, ajustes) de um ativo
        da carteira, em ordem cronológica.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo.
          schema:
            type: string
        - name: symbol
          in: query
          required: true
          description: Ticker ou nome do título.
          schema:
            type: string
      responses:
        "200":
          description: Transações do ativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioTransaction"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      asset:
                        type: object
                        description: Ativo do ledger (id, asset_type, symbol).
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: addPortfolioTransaction
      tags:
        - Carteira
      summary: Lançar transação
      description: LANÇA uma transação na carteira REAL do dono da chave. Se o ativo
        ainda não está na carteira, ele é adicionado automaticamente — "compra
        de 100 PETR4" é uma única chamada. buy/sell exigem `quantity`; `price` é
        opcional (custo desconhecido); split usa `ratio` (2 = 2:1). Confirme
        valores com o usuário.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
                - kind
                - trade_date
              properties:
                asset_type:
                  type: string
                  enum:
                    - stock
                    - fii
                    - etf
                    - bdr
                    - index
                    - tesouro
                    - crypto
                    - option
                    - renda_fixa
                    - debenture
                    - fund
                    - us
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: "Ticker (ex.: PETR4) ou nome oficial do título do Tesouro."
                kind:
                  type: string
                  enum:
                    - buy
                    - sell
                    - split
                  description: Tipo da transação.
                trade_date:
                  type: string
                  description: Data do negócio (AAAA-MM-DD).
                quantity:
                  type: number
                  description: Quantidade (> 0; obrigatória em buy/sell).
                price:
                  type: number
                  description: Preço unitário em BRL (omita se desconhecido).
                fees:
                  type: number
                  description: Custos/corretagem em BRL (default 0).
                ratio:
                  type: number
                  description: Fator do split (2 = 2:1; 0.5 = grupamento 1:2).
                note:
                  type: string
                  description: Observação livre (até 280 caracteres).
      responses:
        "201":
          description: Transação lançada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/PortfolioTransaction"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/transactions/{txId}:
    patch:
      operationId: updatePortfolioTransaction
      tags:
        - Carteira
      summary: Editar transação
