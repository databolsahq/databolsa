                            unit:
                              type: string
                              enum:
                                - brl
                                - usd
                                - pct
                                - ratio
                                - x
                                - count
                                - points
                                - native
                              description: "`ratio` é fração (0,08 é 8%) e `pct` é percentual (8,0 é 8%);
                                converta antes de comparar. `x` é múltiplo.
                                `native` é a unidade da própria série, declarada
                                no catálogo dela."
                            description:
                              type: string
                            via_rel:
                              type: string
                              description: Aresta atravessada num corte relacional (`verbo:direção.fato`).
                            via_direction:
                              type: string
                              enum:
                                - in
                                - out
                            fact_kind:
                              type: string
                              description: Tipo do objeto cujo fato foi comparado no corte relacional. Passa
                                quem tem algum relacionado que satisfaz; sem
                                relação ou sem o fato publicado, não passa.
                          required:
                            - fact
                            - op
                            - value
                            - measure
                            - unit
                            - description
                        description: Como cada condição de `where` foi aplicada, com a unidade usada na
                          comparação. Confira a escala aqui.
                      description:
                        type: string
                    required:
                      - next_cursor
                      - count
                      - fact
                      - unit
                      - measure
                      - cadence
                      - grain
                      - source
                      - availability
                      - order
                      - window_from
                      - window_to
                      - since
                      - since_policy
                      - stale_excluded
                      - as_of_range
                      - mixed_vintage
                      - vintage_spread_days
                      - excluded_out_of_prior
                      - cohort_size
                      - filterable_facts
                      - filterable_properties
                      - description
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: rankObjects
      tags:
        - Objects
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: O tipo dos objetos que entram na coorte.
          required: true
        - in: query
          name: subkind
          schema:
            type: string
            description: Recorte dentro do tipo.
          required: false
        - in: query
          name: fact
          schema:
            type: string
            description: A medida, pelo nome do `listFactCatalog`.
          required: true
        - in: query
          name: measure
          schema:
            type: string
            enum:
              - value
              - delta
              - pct_change
            default: value
            description: "`value` ordena por nível; `delta` pela variação absoluta;
              `pct_change` pela relativa."
          required: false
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Teto da data-base do valor e vigência das relações. Com `since`,
              forma a janela aceita. Sem `since`, a cadência da medida define o
              piso; `meta.since`, `since_policy` e `as_of_range` informam o
              recorte efetivo.
          required: false
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Ponta INICIAL. Obrigatória em `delta` e `pct_change`.
          required: false
        - in: query
          name: since_from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Piso da data-base aceita na ponta inicial. Sem ele, o último valor
              anterior a `from` pode ser mais antigo que a janela pretendida.
              Confira `meta.as_of_from_range`.
          required: false
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
            description: "`asc` lista os menores primeiro; com `delta`, é a maior queda."
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
            description: Linhas do ranking (1–200, default 20).
          required: false
        - in: query
          name: expand
          schema:
            type: string
            enum:
              - issued
              - distributes
              - tokenized_as
              - registered_as
              - assigned_to
              - owes_under
              - holds
              - manages
              - administers
              - custodies
              - audits
              - same_owner
              - shareholder_of
              - indexed_to
              - rates
              - mentions
              - measures
              - forecasts
              - contains
              - member_of
              - exposed_to_issuer
              - succeeded_by
              - produces
              - covers
              - coordinates
              - offers
              - exposed_to_sector
              - regulated_by
              - amends
              - revokes
            description: Inclui em cada linha até três objetos ligados pelo verbo, com id,
              nome e chave pública. Para todos os vizinhos de um objeto, use
              `listObjectLinks`.
          required: false
        - in: query
          name: expand_direction
          schema:
            type: string
            enum:
              - out
              - in
            default: in
            description: "Lado do vizinho na aresta: `in` (default) é quem aponta para a
              linha, como o emissor de uma oferta."
          required: false
        - in: query
          name: rel
          schema:
            type: string
            enum:
              - issued
              - distributes
              - tokenized_as
              - registered_as
              - assigned_to
              - owes_under
              - holds
              - manages
              - administers
              - custodies
              - audits
              - same_owner
              - shareholder_of
              - indexed_to
              - rates
              - mentions
              - measures
              - forecasts
              - contains
              - member_of
              - exposed_to_issuer
              - succeeded_by
              - produces
              - covers
              - coordinates
              - offers
              - exposed_to_sector
              - regulated_by
              - amends
              - revokes
            description: Restringe a coorte a quem tem esta relação com `rel_to`. Sem ela, a
              coorte é o tipo inteiro.
          required: false
        - in: query
          name: rel_to
          schema:
            type: string
            description: "O outro lado da relação: o índice, o fundo, a empresa."
          required: false
        - in: query
          name: rel_direction
          schema:
            type: string
            enum:
              - out
              - in
            default: in
            description: "Lado da coorte na aresta. `in` (default): `rel_to` aponta para os
              membros, como o índice que contém papéis. `out`: os membros
              apontam para `rel_to`, como cedentes de um fundo."
          required: false
        - in: query
          name: since
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data-base mínima aceita na ponta final. Sem ela, a cadência da
              medida define o piso relativo a `at` e `meta.stale_excluded` conta
              os objetos parados que ficaram fora. `meta.since` e `since_policy`
              informam o corte efetivo.
          required: false
        - in: query
          name: exclude_out_of_prior
          schema:
            type: boolean
            description: Exclui valores fora da faixa plausível declarada para a medida
              ordenada. `meta.excluded_out_of_prior` informa quantos saíram e
              fica nulo quando não houve teste. A validação não examina o
              denominador de uma razão; para isso, filtre a medida de tamanho em
              `where`.
          required: false
        - in: query
          name: where
          schema:
            type: string
            description: Condições separadas por vírgula. Medidas usam
              `<medida><operador><número>`; `delta(x)` e `pct_change(x)` filtram
              variação e exigem `from`. Propriedades usam `=` ou `!=`; `|`
              representa alternativas no mesmo campo e valores com vírgula devem
              estar entre aspas. Confira a unidade em `meta.applied_where`.
              Objetos sem a medida não passam; em `!=`, objetos sem a
              propriedade passam.
          required: false
      summary: Filtra e ordena uma coorte por medidas
      description: >-
        Ordena uma coorte por uma medida e permite filtrá-la por outras em
        `where`; cada linha traz os valores usados nos cortes. `expand` inclui o
        objeto ligado indicado, evitando uma consulta adicional.


        Para períodos, `at` é o teto da data-base e `since` o piso. Em `delta` e
        `pct_change`, `since_from` limita a observação inicial. Use `delta` para
        medidas que podem cruzar zero e confira `unit` antes de comparar
        medidas.


        Objetos sem valor nas pontas necessárias ficam fora; `cohort_size`
        informa o denominador. `as_of` e `as_of_from` mostram as competências
        efetivamente comparadas. Com `availability=unknown`, o recorte histórico
        usa somente a data-base; com `filed`, também respeita a data de
        publicação.
      x-capability: object-context
      x-lifecycle: object-native
