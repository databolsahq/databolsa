  /v1/minerals:
    get:
      responses:
        "200":
          description: Página de minerais
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MineralCommodity"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listMinerals
      tags:
        - Minerais
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: search
          schema:
            type: string
            description: Busca por nome em português, chave ou nome em inglês. Ignora
              acento.
        - in: query
          name: critical
          schema:
            type: boolean
            description: true = só minerais da lista de críticos do USGS.
        - in: query
          name: group
          schema:
            type: string
            description: "Grupo exato: Metais básicos, Metais preciosos, Metais ferrosos e
              ligas, Terras raras e críticos, Minerais industriais,
              Fertilizantes, Materiais de construção, Energia."
      summary: Catálogo de minerais com produção e reservas por país
      description: Lista as commodities minerais cobertas (lítio, cobre, nióbio,
        cobalto, terras raras, grafita, ferro, ouro, fosfato, potássio e
        outras), com nome em português, grupo, período coberto, se é mineral
        crítico e o maior produtor do ano mais recente. Use para descobrir a
        chave do mineral antes de pedir o ranking de países ou a série. A busca
        ignora acento, então 'litio', 'lítio' e 'lithium' chegam na mesma linha.
        `top_producer_share_pct` sai nulo quando a participação não é calculável
        para nenhum país da commodity.
  /v1/minerals/observations:
    get:
      responses:
        "200":
          description: Página de observações
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MineralObservation"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listMineralObservations
      tags:
        - Minerais
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: mineral
          schema:
            type: string
            description: "Chave do mineral, ex.: lithium."
        - in: query
          name: country
          schema:
            type: string
            pattern: ^[A-Za-z]{3}$
            description: "País em ISO 3166-1 alfa-3, ex.: BRA, CHN, AUS, CHL."
        - in: query
          name: statistic
          schema:
            type: string
            enum:
              - production
              - reserves
        - in: query
          name: year
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            description: Ano exato.
        - in: query
          name: from
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            description: Ano inicial (inclusive).
        - in: query
          name: to
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            description: Ano final (inclusive).
        - in: query
          name: include_world_total
          schema:
            type: boolean
            description: true inclui as linhas de total mundial, que por default ficam de
              fora por não serem um país.
      summary: Série longa de produção e reservas de minerais, por país e ano
      description: "Formato longo: uma linha por mineral, país, recorte e ano. É a
        rota para perguntas por PAÍS, do tipo 'quais minerais o Brasil produz'
        ou 'o que o Brasil tem de reservas', com `?country=BRA`, e também para a
        série histórica de um mineral com `?mineral=lithium&from=2021&to=2025`.
        Cada linha carrega o valor, a sentinela publicada quando não há valor
        (`value_raw`, `value_flag_reason`), a participação no total mundial com
        o motivo quando ela não existe (`share_of_world_pct` nulo +
        `share_basis`) e a edição da publicação. Edições diferentes não formam
        série comparável: o USGS reestima anos anteriores a cada safra. As
        linhas de total mundial ficam de fora por default. Sobre `reserves`: é
        estimativa geológica agregada por país, não reserva provada sob SEC S-K
        1300, JORC ou NI 43-101."
  /v1/minerals/{mineral}:
    get:
      responses:
        "200":
          description: Mineral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineralCommodity"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getMineral
      tags:
        - Minerais
      parameters:
        - in: path
          name: mineral
          schema:
            type: string
            pattern: ^[A-Za-z0-9_]+$
            minLength: 2
            maxLength: 64
            description: "Chave do mineral, ex.: lithium, copper, niobium_columbium,
              rare_earths."
          required: true
      summary: Ficha de um mineral
      description: "Perfil da commodity mineral: nome em português, grupo, se está na
        lista de minerais críticos do USGS, anos cobertos, unidades, quantos
        países aparecem e o maior produtor com sua participação. Ponto de
        entrada antes do ranking de países e da série histórica."
  /v1/minerals/{mineral}/producers:
    get:
      responses:
        "200":
          description: Ranking de países
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MineralProducer"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      mineral:
                        type: string
                      label:
                        type:
                          - string
                          - "null"
                      statistic:
                        type: string
                        description: production ou reserves.
                      year:
                        type:
                          - number
                          - "null"
                        description: Ano do recorte. Nulo quando não há dado.
                      detail:
                        type:
                          - string
                          - "null"
                        description: Recorte usado no ranking. Nulo quando nenhum agregado do ano tem
                          total mundial e a resposta traz todos os recortes lado
                          a lado (cada linha com o seu `statistic_detail_base`).
                      available_details:
                        type: array
                        items:
                          $ref: "#/components/schemas/MineralDetailOption"
                        description: Outros agregados publicados para o mesmo ano. Troque com o
                          parâmetro `detail`.
                      unit:
                        type:
                          - string
                          - "null"
                      world_total:
                        type:
                          - number
                          - "null"
                        description: Total mundial do recorte. Nulo quando o USGS não publica ou o
                          declara `XX`.
                      world_total_flag:
                        type:
                          - string
                          - "null"
                        description: "`XX` significa que o próprio USGS declara o total mundial
                          incalculável."
                      countries_withheld:
                        type: number
                        description: Países com valor retido pelo USGS neste recorte (sigla `W`, dado
                          proprietário de empresa). Acima de zero o ranking está
                          INCOMPLETO e os shares não somam 100%.
                      is_estimate:
                        type: boolean
                        description: O ano do recorte é estimativa do USGS, não realizado.
                      is_critical:
                        type: boolean
                      edition:
                        type:
                          - string
                          - "null"
                      edition_year:
                        type:
                          - number
                          - "null"
                    required:
                      - next_cursor
                      - count
                      - mineral
                      - label
                      - statistic
                      - year
                      - detail
                      - available_details
                      - unit
                      - world_total
                      - world_total_flag
                      - countries_withheld
                      - is_estimate
                      - is_critical
                      - edition
                      - edition_year
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listMineralProducers
      tags:
        - Minerais
      parameters:
        - in: path
          name: mineral
          schema:
            type: string
            pattern: ^[A-Za-z0-9_]+$
            minLength: 2
            maxLength: 64
            description: "Chave do mineral, ex.: lithium, copper, niobium_columbium,
              rare_earths."
          required: true
        - in: query
          name: statistic
          schema:
            type: string
            enum:
              - production
              - reserves
            default: production
            description: production = quantidade extraída/processada no ano. reserves =
              reserva estimada.
        - in: query
          name: year
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            description: "Ano do recorte. Default: o mais recente publicado."
        - in: query
          name: detail
          schema:
            type: string
            description: "Recorte do agregado quando a commodity tem mais de um, ex.: 'Mine
              production' ou 'Refinery production' no cobre. Sem ele a rota
              escolhe o recorte com total mundial e mais países, e lista os
              outros em `meta.available_details`."
      summary: Ranking de países produtores e detentores de reservas de um mineral
      description: >-
        Responde 'quem produz mais' e 'quem tem as maiores reservas': ranking de
        países produtores com a participação no total mundial, para lítio,
        cobre, nióbio, cobalto, terras raras, grafita, ferro, ouro, fosfato,
        potássio e as demais commodities do catálogo. Use `statistic=production`
        para produção do ano e `statistic=reserves` para reservas. É a rota
        certa para perguntas como 'quanto do nióbio do mundo vem do Brasil',
        'quem domina a produção de terras raras' ou 'quais países concentram as
        reservas de lítio'.


        Como ler o resultado sem errar:

        - `share_of_world_pct` é NULO quando a participação não pode ser
        calculada, e `share_basis` diz o motivo. Nunca trate ausência como zero.
        O motivo mais sutil é `incomparable_basis`: existe total mundial, mas os
        países reportam bases diferentes, como nas reservas de boro, em que a
        Turquia declara boratos refinados, o Chile ulexita e a China óxido
        bórico equivalente. Não são somáveis, e é por isso que o próprio USGS
        marca o total como `XX`.

        - `meta.countries_withheld` acima de zero significa ranking INCOMPLETO:
        o USGS reteve o valor de países onde ele revelaria dado proprietário de
        empresa, então os shares não somam 100%.

        - `meta.is_estimate` verdadeiro significa que o ano é estimativa do
        USGS, não realizado.

        - Quando a commodity tem mais de um agregado (cobre tem produção de mina
        e produção de refino, com totais mundiais distintos), o ranking usa um
        recorte só e informa os outros em `meta.available_details`; troque com
        `?detail=`.

        - Em `statistic=reserves` o número é ESTIMATIVA GEOLÓGICA AGREGADA POR
        PAÍS publicada pelo USGS. Não é reserva provada ou provável declarada
        por companhia sob SEC S-K 1300, JORC ou NI 43-101, não tem a mesma
        auditoria e não deve ser comparada com o relatório técnico de uma
        mineradora.
  /v1/credit/debentures:
    get:
      responses:
        "200":
          description: Página de debêntures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Debenture"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listDebentures
      tags:
        - Credit
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: q
          schema:
            type: string
            description: Busca por código ou nome do emissor.
        - in: query
          name: issuerCnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ do emissor (14 dígitos, sem pontuação).
        - in: query
          name: indexer
          schema:
            type: string
            description: "Indexador as-filed: DI, IPCA, IGP-M, PRÉ, TR…"
        - in: query
          name: incentivada
          schema:
            type: boolean
            description: Somente incentivadas (Lei 12.431, isentas de IR p/ pessoa física).
        - in: query
          name: active
          schema:
            type: boolean
            description: true = só emissões registradas (vivas).
        - in: query
          name: maturityFrom
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento a partir de (YYYY-MM-DD).
        - in: query
          name: maturityTo
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento até (YYYY-MM-DD).
      summary: Catálogo de debêntures (universo completo, vivas e vencidas)
      description: "Uma linha por emissão: emissor, indexação as-filed (índice + % +
        spread), incentivada (Lei 12.431), garantia, vencimento, quantidade em
        mercado e o último negócio do secundário. `active=true` restringe às
        registradas."
  /v1/credit/debentures/{code}:
