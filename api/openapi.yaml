                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listOwnershipMovers
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Competência do CDA (AAAA-MM-DD); default = mais recente COM
              movimentação.
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - in
              - out
              - all
            default: all
            description: in = só quem aumentou/entrou; out = só quem reduziu/saiu; all =
              tudo, das maiores altas às maiores baixas.
      summary: Fundos que mais aumentaram e reduziram posição no papel
      description: >-
        Quem se mexeu, fundo a fundo, numa competência do CDA: posição anterior,
        posição corrente e a variação em QUANTIDADE (`qty_delta`), já na posição
        econômica — direta + cedida em empréstimo − obrigação por recebida, que
        é o que a carteira do fundo esconde (428 dos 2.770 pares fundo×ativo
        cedidos em 2026-05 existem SÓ como empréstimo). Por isso os números aqui
        divergem de `/fund-holders`, que serve a posição DECLARADA em carteira,
        sem empréstimo nem obrigação — as duas rotas respondem perguntas
        diferentes sobre o mesmo papel.


        Só aparecem fundos do PAINEL BALANCEADO, isto é, que divulgaram carteira
        nas duas competências. Sem esse corte a queda de divulgação entre um mês
        de trimestre (6.625 fundos) e o mês seguinte (3.278) seria lida como
        venda — em PETR4 o sinal chega a inverter. Por isso um papel legítimo
        pode responder página vazia: significa 'não há competência comparável',
        não 'papel inexistente'.
  /v1/stocks/{ticker}/ownership-flow:
    get:
      responses:
        "200":
          description: Página de competências mensais
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TickerDemand"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listOwnershipFlow
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      summary: Quem está comprando o papel, por mês (fundos + insiders)
      description: >-
        Série mensal com o delta de posição dos fundos de investimento (CDA/CVM)
        e o fluxo de insiders (VLMO/CVM) no mesmo eixo temporal.


        Dois campos são guardas, não decoração. `funds_shares_delta` só existe
        quando o painel de fundos divulgantes é comparável entre as duas
        competências — quando não é, vem null com o motivo em
        `funds_delta_reason`, o TAMANHO do painel em `funds_panel_n` e a
        cobertura do universo (percentual 0–100) em `funds_panel_coverage_pct`
        (sem esse corte o sinal inverte em 27,8% dos tickers). E o insider é
        nível-COMPANHIA: a mesma linha se repete em todos os tickers do emissor,
        então agregue apenas onde `is_issuer_anchor_ticker` é true, ou o total
        infla 40,4%.


        Fluxo em R$ é `funds_value_flow_brl` (Δqtd × preço implícito do CDA); a
        variação do valor bruto NÃO serve como fluxo, porque embute marcação a
        mercado — em ITUB4 as duas contas dão sinais opostos.
        `insider_corporate_event_shares` nunca deve ser somado a
        `insider_net_shares`.


        Meses em que só há insider vêm com `comptc_date` nula: a série de VLMO é
        mais longa que a janela do CDA.
  /v1/stocks/{ticker}/trade-stats:
    get:
      responses:
        "200":
          description: Página de estatísticas de negociação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TradeStat"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listTradeStats
      tags:
        - Stocks
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]{3}[0-9]{0,2}$
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      summary: VWAP oficial e nº de negócios por pregão (B3 consolidado)
      description: Série diária de VWAP oficial (TradAvrgPric), nº de negócios e
        volume financeiro do instrumento, do arquivo consolidado da B3.
        Complementa o OHLC ajustado de /quotes.
  /v1/screener/stocks:
    get:
      responses:
        "200":
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScreenerRow"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: screenStocks
      tags:
        - Screener
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: pl_min
          schema:
            type: number
        - in: query
          name: pl_max
          schema:
            type: number
        - in: query
          name: pvp_min
          schema:
            type: number
        - in: query
          name: pvp_max
          schema:
            type: number
        - in: query
          name: dy_min
          schema:
            type: number
        - in: query
          name: roe_min
          schema:
            type: number
        - in: query
          name: ev_ebitda_max
          schema:
            type: number
        - in: query
          name: div_liq_ebitda_max
          schema:
            type: number
        - in: query
          name: min_volume
          schema:
            type: number
            description: "Piso de liquidez: volume financeiro médio dos últimos 2 meses, em
              R$/dia (ex.: 1000000 corta micro caps ilíquidas). Papel sem série
              de preço recente fica de fora quando o piso está ativo."
        - in: query
          name: sector
          schema:
            type: string
            description: Filtra por setor da empresa (match EXATO, case-sensitive). Valor
              desconhecido retorna página vazia, sem erro.
        - in: query
          name: segment
          schema:
            type: string
            description: "Filtra por segmento de listagem B3 (substring, case-insensitive),
              ex.: 'Novo Mercado'."
        - in: query
          name: sort
          schema:
            type: string
            default: -market_cap
            description: "Ordena por indicador. Valores: pl, pvp, psr, dy, dy_12m, payout,
              roe, roic, ev_ebitda, market_cap, margem_liquida, volume_medio_2m.
              Prefixe com '-' para decrescente (ex.: -dy_12m). Nomes livres como
              'dividend_yield' são inválidos. Default: -market_cap — o topo de
              -dy_12m é dominado por provento extraordinário sobre base pequena
              e não deve ser servido como resposta a uma consulta sem filtro."
      summary: Filtra ações por múltiplos critérios fundamentalistas
      description: "Filtra o universo de ações por faixas de indicadores
        (pl_min/pl_max, pvp_min/pvp_max, dy_min, roe_min, ev_ebitda_max,
        div_liq_ebitda_max), liquidez mínima (min_volume), setor e segmento;
        ordena por `sort` (default `-market_cap`). Paginação por cursor (use
        meta.next_cursor). Retorna ticker, nome, setor e os indicadores
        principais por papel. Cada linha traz `quality_flags`: indicador
        estatisticamente implausível (DY > 20%, P/L < 1, ROE > 100%, payout >
        200%) é MARCADO com o motivo, nunca escondido nem nulado."
  /v1/screener/fiis:
    get:
      responses:
        "200":
          description: Página de FIIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FiiListRow"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: screenFiis
      tags:
        - Screener
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: segment
          schema:
            type: string
            description: "Filtra por segmento do FII (substring, case-insensitive), ex.:
              'Logística', 'Papel'."
        - in: query
          name: paper
          schema:
            type: string
            enum:
              - "true"
              - "false"
            description: true = papel (CRI), false = tijolo. Omitir = todos.
        - in: query
          name: min_pl
          schema:
            type: number
            description: Patrimônio líquido mínimo (R$) — corta micro-fundos ilíquidos.
        - in: query
          name: include_stale
          schema:
            type: string
            enum:
              - "true"
              - "false"
            description: "true = inclui fundos sem informe mensal recente
              (encerrados/incorporados). Default: só fundos com informe nos
              últimos 6 meses."
        - in: query
          name: sort
          schema:
            type: string
            default: -patrimonio_liquido
            description: "Ordena por: ticker, preco, dy, dy_12m, pvp, vacancia, pl,
              patrimonio_liquido. Prefixe com '-' para decrescente (ex.:
              -dy_12m). Default: -patrimonio_liquido."
      summary: Universo de FIIs filtrável por segmento e tijolo/papel
      description: Lista o universo de FIIs ATIVOS (com informe mensal nos últimos 6
        meses; include_stale=true inclui encerrados/incorporados), filtrável por
        segmento, tijolo/papel e PL mínimo (min_pl); ordena por `sort`.
        Paginação por cursor (meta.next_cursor). Retorna ticker, nome, segmento
        e indicadores (dy, pvp, vacância…).
