        protocol:
          type:
            - string
            - "null"
          description: Identificador do documento na fonte (protocolo CVM/FNET) —
            auditável em conjunto com source.
        source:
          type:
            - string
            - "null"
          description: "Conector de origem do documento (ex.: cvm_ipe, fnet_fii,
            fnet_fiagro)."
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
        download_url:
          type:
            - string
            - "null"
          format: uri
        heading_path:
          type:
            - string
            - "null"
        version:
          $ref: "#/components/schemas/DocumentVersion"
      required:
        - ticker
        - company_name
        - entity_type
        - issuer_cnpj
        - asset_code
        - asset_family
        - doc_category
        - doc_type_raw
        - document_kind
        - reference_date
        - filed_at
        - filed_at_source
        - protocol
        - source
        - page_start
        - download_url
        - heading_path
        - version
      additionalProperties: false
    DocumentChunk:
      type: object
      properties:
        text:
          type: string
        text_expanded:
          type: string
          description: Entorno costurado (context-expansion), quando disponível.
        score:
          type: number
          minimum: -1
          maximum: 1
          description: Similaridade (1 - distância cosseno).
        ticker:
          type:
            - string
            - "null"
          deprecated: true
        company_name:
          type:
            - string
            - "null"
          deprecated: true
        doc_category:
          type:
            - string
            - "null"
          deprecated: true
        doc_type:
          type:
            - string
            - "null"
          deprecated: true
        reference_date:
          type:
            - string
            - "null"
          format: date
          deprecated: true
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
          deprecated: true
        download_url:
          type:
            - string
            - "null"
          format: uri
          deprecated: true
        heading_path:
          type:
            - string
            - "null"
          deprecated: true
        citation:
          $ref: "#/components/schemas/DocumentCitation"
        is_table:
          type: boolean
      required:
        - text
        - score
        - citation
        - is_table
      additionalProperties: false
    DocumentTaxonomy:
      type: object
      properties:
        kinds:
          type: array
          items:
            type: object
            properties:
              kind:
                $ref: "#/components/schemas/DocumentKind"
              label:
                type: string
              document_count:
                type: integer
                minimum: 0
              categories:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type:
                        - string
                        - "null"
                    doc_type_raw:
                      type:
                        - string
                        - "null"
                    document_count:
                      type: integer
                      minimum: 0
                    shape:
                      type:
                        - string
                        - "null"
                      description: "Como um segundo documento da categoria se relaciona com o
                        anterior. `event`: cada documento é um fato próprio.
                        `superseding`: o mais recente é o vigente. `amending`: o
                        vigente é o original mais todos os aditamentos.
                        `periodic`: chaveado por competência; só a republicação
                        da mesma competência substitui. Nulo significa forma não
                        declarada, não `event`."
                    shape_meaning:
                      type:
                        - string
                        - "null"
                      description: "O que a forma quer dizer, em uma frase. Viaja junto porque o nome
                        sozinho não é acionável: `amending` não avisa que ler
                        apenas o documento mais recente devolve o aditamento
                        isolado."
                    version_family:
                      type:
                        - string
                        - "null"
                      description: 'A FILA de que esta categoria participa. Duas categorias com a
                        MESMA família entram na mesma linha do tempo, ainda que
                        a fonte as rotule diferente: é assim que "Instrumento
                        Particular de Alteração do Regulamento" encontra o
                        "Regulamento" que ele altera. Nulo quando a categoria
                        não versiona.'
                    version_role:
                      type:
                        - string
                        - "null"
                      description: '`base` restabelece o texto inteiro e aposenta o base anterior
                        junto com as emendas dele; `amendment` altera o base em
                        vigor sem repetir o que não muda. Uma categoria
                        `amendment` NUNCA responde sozinha "o que vale hoje".'
                  required:
                    - category
                    - doc_type_raw
                    - document_count
                    - shape
                    - shape_meaning
                    - version_family
                    - version_role
                  additionalProperties: false
            required:
              - kind
              - label
              - document_count
              - categories
            additionalProperties: false
        entity_types:
          type: array
          description: Tipos de entidade aceitos como filtro.
          items:
            $ref: "#/components/schemas/DocumentEntityType"
        asset_families:
          type: array
          description: Famílias aceitas para documentos de crédito e fundos.
          items:
            type: string
            enum:
              - DEB
              - CRI
              - CRA
              - OTS
              - FIDC
              - FIAGRO
        reference_years:
          type: object
          properties:
            min:
              type:
                - integer
                - "null"
            max:
              type:
                - integer
                - "null"
          required:
            - min
            - max
          additionalProperties: false
      required:
        - kinds
        - entity_types
        - asset_families
        - reference_years
      additionalProperties: false
    DocumentReadChunk:
      type: object
      properties:
        chunk_index:
          type: integer
          minimum: 0
          description: Posição do trecho no documento; a paginação preserva esta ordem.
        text:
          type: string
        heading_path:
          type:
            - string
            - "null"
        is_table:
          type: boolean
        page_start:
          type:
            - integer
            - "null"
          minimum: 1
        page_end:
          type:
            - integer
            - "null"
          minimum: 1
      required:
        - chunk_index
        - text
        - heading_path
        - is_table
        - page_start
        - page_end
      additionalProperties: false
    DocumentReadResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentReadChunk"
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: Passe como cursor na próxima chamada; null encerra o documento.
            count:
              type: integer
              minimum: 0
            protocol:
              type: string
            source:
              type: string
            citation:
              $ref: "#/components/schemas/DocumentCitation"
          required:
            - next_cursor
            - count
            - protocol
            - source
            - citation
          additionalProperties: false
      required:
        - data
        - meta
      additionalProperties: false
    MarketEventSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: integer
                description: Use em /v1/events/{id} e /v1/events/{id}/similar.
              dedup_key:
                type: string
                description: Chave de idempotência do evento na origem.
              day:
                type: string
                description: Dia BRT do evento (AAAA-MM-DD).
              layer:
                type: string
                description: estrutural | setorial | corporativa
              category:
                type: string
                description: macro | politica | internacional | commodities | corporate | fii |
                  cripto | mercado | outros
              title:
                type: string
              summary:
                type:
                  - string
                  - "null"
              entities:
                type: array
                items:
                  type: string
              tickers:
                type: array
                items:
                  type: string
                description: Um papel por posição.
              transmission_channels:
                type: array
                items:
                  type: string
                description: dolar | ibov | brent | curva | selic
              score:
                type:
                  - number
                  - "null"
                description: Rank do funil (imprensa) ou |z| (mercado) — NÃO é a relevância da
                  busca.
              detectors:
                type: array
                items:
                  type: string
                description: official | press | market
              thread_slug:
                type:
                  - string
                  - "null"
                description: Use em /v1/events/threads/{slug}.
              source_refs:
                type: array
                items:
                  type: object
              similarity:
                type: number
                description: Relevância semântica desta busca (maior = mais próximo da
                  pergunta).
            required:
              - event_id
              - dedup_key
              - day
              - layer
              - category
              - title
              - similarity
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
    DocumentSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"
        meta:
          type: object
          properties:
            next_cursor:
              type:
                - string
                - "null"
              description: "Sempre null: resposta em página única."
            count:
              type: integer
              description: Itens nesta página.
            query:
              type: string
            context:
              type: string
              description: Bloco pronto p/ prompt, com citação por trecho. Vazio quando
                include_context=false.
            warnings:
              type: array
              items:
                type: string
              description: "Avisos de semântica da busca (ex.: exclusão de documentos sem
                filed_at no modo point-in-time). Ausente quando não há avisos."
          required:
            - next_cursor
            - count
      required:
        - data
        - meta
tags:
  - name: Companies
    description: "Documentos protocolados na CVM (IPE) por companhia. O cadastro e
      as demonstrações financeiras são do OBJETO companhia
      (`getObjectProperties` e `getObjectHistory`), e a COMPANHIA é objeto
      separado do PAPEL: preço e indicador de mercado ficam em Stocks."
  - name: Stocks
    description: "Ações por PAPEL (PETR3 e PETR4 são fichas distintas): cotação
      diária, indicadores fundamentalistas TTM, eventos societários, insiders e
      o fluxo de fundos no papel. A ficha do papel é o objeto."
  - name: Objects
    description: "Grafo de identidade e contexto: resolve nomes e códigos para um
      objeto canônico, lê apelidos, fatos, propriedades e relações. Procure
      conceitos também pelo nome, não só por ticker. Indicadores medidos por
      fontes (`kind=indicator`) apontam para suas séries; agregados calculados
      (`kind=data_series`) expõem `indicator_value` e histórico."
  - name: Corporate
    description: "Eventos societários que valem para o mercado inteiro, não para um
      papel: quem está fora de operação regular (recuperação judicial e afins) e
      as sucessões de código. Os mesmos dados existem por papel como propriedade
      do objeto; aqui são o conjunto."
  - name: Quotes
    description: "Cotação ao vivo com delay de 15 min durante o pregão: lote de
      papéis ou índice e a série intradiária de minuto. Fechamento diário e
      histórico ficam em Stocks/Indices."
  - name: FIIs
    description: "Fundos imobiliários listados: perfil, indicadores do informe
      mensal (DY, P/VP, vacância, VP/cota) e o histórico deles. O universo
      filtrável está em Screener."
  - name: Bonds
    description: "Títulos públicos: Tesouro Direto (taxas e PUs por título), curva
      do Tesouro, curvas de mercado (DI, pré, IPCA+, implícita) e leilões
      primários. Crédito privado é Credit."
  - name: Credit
    description: Crédito privado — debêntures, CRI/CRA, FIDC, ratings, curvas de
      crédito, risco de emissor e negócios de balcão. É a maior superfície de
      renda fixa privada do contrato. Não confunda com Bonds (título público)
      nem com COE, que é payoff de derivativo sobre o risco do banco emissor e
      vive só no objeto (`listObjects(kind=instrument, subkind=coe)`).
  - name: Commodities
    description: "Ajuste diário dos contratos FUTUROS de mercadoria na B3 (boi
      gordo, milho, café, etanol, soja, ouro). ATENÇÃO: é preço de ajuste por
      vencimento, NÃO preço à vista — o vencimento mais curto é base futura, não
      spot. Para o preço internacional de Brent, minério de ferro e soja,
      resolva a série (`fred:<id>`) e peça `getObjectHistory`."
  - name: Minerais
    description: "Produção e reservas de MINERAIS por país (o catálogo é
      `listObjects(kind=commodity)`) (lítio, cobre, nióbio, cobalto, terras
      raras, grafita, ferro, ouro, fosfato...), da publicação Mineral Commodity
      Summaries do USGS. Responde quem produz e quem detém reserva, em
      quantidade física e participação no total mundial. Não confunda com
      Commodities, que é ajuste de contrato FUTURO da B3 em BRL: aqui não há
      preço. 'Reserves' é estimativa geológica agregada por país, NÃO reserva
      provada sob SEC S-K 1300, JORC ou NI 43-101."
  - name: Crypto
    description: Snapshot quase-live de criptoativos, 24/7, em BRL e USD. O catálogo
      e as velas diárias são do objeto (`listObjects(kind=crypto_asset)` e
      `getObjectHistory`).
  - name: EUA
    description: "Ativos dos EUA (ações do S&P 500 e do Nasdaq-100 e ETFs): perfil
      com fundamentos da SEC, cotação EOD em USD, BDR correspondente e filings
      no EDGAR. O catálogo é `listObjects(kind=company, where=market=us)`."
  - name: Indices
    description: "Índices da B3 (IBOV, IFIX, SMLL, IDIV…): catálogo, nível diário,
      intradiário e carteira teórica vigente. O índice CONTÉM papéis, não
      companhias."
  - name: Events
    description: Ledger de eventos de mercado e mundo — o que foi relevante em cada
      dia (decisões de juros, medidas provisórias, tarifas, geopolítica,
      anomalias de preço), com fontes. Não confunda com eventos SOCIETÁRIOS
      (listCorporateEvents) nem com a agenda de resultados (earnings).
  - name: Market
    description: Fluxo por perfil de investidor na B3 (estrangeiro, institucional,
      pessoa física…), diário e mensal por segmento. Fluxo de fundos num PAPEL
      fica em Stocks (ownership-flow).
  - name: Primary Market
    description: Ofertas públicas de distribuição registradas na CVM (ações,
      debêntures, cotas de fundos), do histórico ICVM 400/476 ao rito RCVM 160,
      uma linha por série da oferta.
  - name: Funds
    description: "Fundos de investimento (CVM 175), pelo CNPJ da CLASSE: perfil,
      carteira mensal (CDA), grafo fundo-de-fundos nos dois sentidos e
      look-through. FIDC tem superfície própria em Credit."
  - name: Options
    description: "Opções sobre ações na B3: vencimentos, cadeia vigente do
      subjacente e histórico EOD de uma série."
  - name: Macro
    description: "Engrenagens da economia e o regime crescimento × inflação. As
      séries macroeconômicas (BCB, FRED, Banco Mundial, benchmarks) e as
      expectativas Focus são objetos `data_series`: enumere por
      `listObjects(kind=data_series)` e peça os pontos em `getObjectHistory`."
  - name: Screener
    description: Universos filtráveis e ordenáveis de ações, FIIs, fundos e
      debêntures. Para cortar por várias propriedades ou por medida arbitrária,
      a superfície de objetos (rankObjects/aggregateObjects com where) é mais
      geral.
  - name: System
    description: Saúde da API e da ingestão (frescor por fonte) e a busca unificada
      por nome ou código em todas as classes.
  - name: Documentos
    description: "Descoberta, busca semântica e leitura paginada de documentos
      oficiais CVM/B3. Fluxo para agentes: getDocumentTaxonomy descobre facetas;
      searchDocuments encontra documentos e passagens; readDocument percorre um
      protocolo na ordem, até meta.next_cursor=null. Em crédito privado,
      identifique emissor, papel e família separadamente e preserve
      protocol/source/página e as duas datas da citação."
paths:
  /v1/health:
    get:
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: getHealth
      tags:
        - System
      parameters: []
      summary: Status da API e frescor dos dados
      security: []
      description: 'Estado da API e a data-base mais recente de cada família de dados
        (cotações, fundamentos, fundos, macro…). Chame antes de responder
        "hoje", "agora" ou "último": `data_freshness` diz até quando cada dado
        vai. Resposta direta, sem `data`.'
      x-capability: system
  /v1/companies/{company}/documents:
    get:
      responses:
        "200":
          description: Página de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      total:
                        type: integer
                        description: Itens no universo filtrado, ignorando a paginação. Só com
                          `?total=true`.
                      subject:
                        type: object
                        additionalProperties:
                          type: string
                        description: Os parâmetros de caminho desta requisição, ecoados. Presente em
                          toda rota endereçada por um objeto. Use-o para
                          conferir a atribuição quando fizer chamadas
                          concorrentes — sem ele, resposta trocada e resposta
                          certa têm exatamente a mesma cara.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listCompanyDocuments
      tags:
        - Companies
      parameters:
        - in: path
          name: company
          schema:
            type: string
            minLength: 1
            maxLength: 32
            description: "Ticker do papel (BBAS3), código CVM numérico da companhia (1023)
              OU CNPJ de 14 dígitos (10531501000158). O CNPJ é a porta para a
              companhia SEM ação em bolsa: quem se registra na CVM apenas para
              emitir dívida (Categoria B) entrega demonstração financeira
              completa e não tem ticker. Debênture, FIDC e informe de
              securitização identificam o emissor por CNPJ, nunca por cd_cvm."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor opaco de `meta.next_cursor` da página anterior; omita na
              primeira página.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: Itens por página (1–1000, default 100).
        - in: query
          name: total
          schema:
            type: string
            description: true = inclui `meta.total` (contagem do universo filtrado). Custa
              uma consulta a mais.
        - in: query
          name: kind
          schema:
            $ref: "#/components/schemas/DocumentKind"
            description: "Tipo estável do documento (mesma taxonomia do campo `kind` da
              resposta). Prefira este filtro a `category`: a categoria é texto
              livre em português e muda com a fonte."
        - in: query
          name: category
          schema:
            type: string
            description: "Categoria bruta do documento no IPE/CVM, ex.: 'Fato Relevante',
              'Comunicado ao Mercado', 'Aviso aos Acionistas', 'Assembleia',
              'Dados Econômico-Financeiros'."
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Filtra pela data de referência do documento (o período a que ele se
              refere), não pela de protocolo, que vem em `filed_at`.
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fim do período (data de referência, inclusive).
      summary: Documentos e comunicados (IPE/CVM)
      description: Fatos relevantes, comunicados e documentos protocolados na CVM
        (IPE) da companhia. Aceita ticker (BBAS3), código CVM (1023) ou CNPJ de
        14 dígitos (10531501000158). Filtre por `kind` (taxonomia estável),
        `category` (texto bruto da fonte) e período (`from`/`to`); paginação por
        cursor.
      x-capability: market-data
      x-lifecycle: default
  /v1/corporate/trading-status:
    get:
      responses:
        "200":
          description: Página de emissoras em situação excepcional
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker:
                          type: string
                        entity_id:
                          type:
                            - string
                            - "null"
                          description: O objeto do PAPEL no grafo de identidade. Nulo quando o ticker
                            ainda não resolveu no spine
                        trading_status:
                          type: string
                          enum:
                            - regular
                            - sancionada
                            - concordataria
                            - recuperacao_extrajudicial
                            - recuperacao_judicial
                          description: Situação da emissora segundo a B3. `concordataria` só aparece no
                            histórico (o instituto foi extinto pela Lei
                            11.101/2005).
                        trading_status_since:
                          type:
                            - string
                            - "null"
                          description: Desde quando a situação vale (AAAA-MM-DD)
                        last_session:
                          type:
                            - string
                            - "null"
                          description: Último pregão observado para o papel
                      required:
                        - ticker
                        - entity_id
                        - trading_status
                        - trading_status_since
                        - last_session
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      total:
                        type: integer
                        description: Itens no universo filtrado, ignorando a paginação. Só com
                          `?total=true`.
                      subject:
                        type: object
                        additionalProperties:
                          type: string
                        description: Os parâmetros de caminho desta requisição, ecoados. Presente em
                          toda rota endereçada por um objeto. Use-o para
                          conferir a atribuição quando fizer chamadas
                          concorrentes — sem ele, resposta trocada e resposta
                          certa têm exatamente a mesma cara.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listTradingStatus
      tags:
        - Corporate
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor opaco de `meta.next_cursor` da página anterior; omita na
              primeira página.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: Itens por página (1–1000, default 100).
        - in: query
          name: total
          schema:
            type: string
            description: true = inclui `meta.total` (contagem do universo filtrado). Custa
              uma consulta a mais.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - sancionada
              - concordataria
              - recuperacao_extrajudicial
              - recuperacao_judicial
            description: Filtra por uma situação específica. Omitir = todas as
              não-regulares.
      summary: Lista emissoras em situação excepcional
      description: "Papéis cuja emissora está em situação excepcional no CODBDI da B3:
        recuperação judicial, extrajudicial, concordata ou sancionada. Não é
        suspensão de negociação. Use `total=true` para a contagem sem paginar."
      x-capability: market-data
      x-lifecycle: default
  /v1/corporate/successions:
    get:
      responses:
        "200":
          description: Página de sucessões
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        old_ticker:
                          type: string
                        new_ticker:
                          type: string
                          description: "O código que sucedeu o antigo NA `ex_date` — o próximo elo da
                            cadeia, não o fim dela. O par (destino, data) tem de
                            ser verdadeiro junto: em 14/08/2021 VVAR3 virou
                            VIIA3, e BHIA3 só existe desde 2023. Para o código
                            negociável hoje use `current_ticker`; para
