            'none_cnpj_root_only' (só a raiz de 8 dígitos casa — SPE de grupo
            registrado; o balanço da holding NÃO é atribuído a ela) ou
            'none_issuer_not_in_cvm_registry'. Os dois 'none_*' são limite da
