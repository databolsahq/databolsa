      summary: Curva de crédito observada no secundário de debêntures (spread por prazo)
      description: "Quanto o mercado exige de crédito privado por prazo, derivado dos
        negócios reais do secundário de debêntures: janela de 21 pregões
        terminando em `meta.date`, papéis da família que negociaram na janela,
        bucketados pelo prazo restante (0-2, 2-4, 4-7, 7+ anos), medianas por
        papel (não por volume). Como ler: `spread_median_pct_aa` é a mediana do
        spread DA EMISSÃO (as-filed) dos papéis em mercado — reflete o mix de
        safras negociadas, NÃO o yield implícito negociado; o termômetro do
        reapreçamento é `pct_of_curve_median` (mediana do último preço de cada
        papel como % do PU teórico da curva: <100 = estoque negociando com
        deságio = stress de crédito). Na família IPCA o spread é a taxa real da
        emissão (comparável à NTN-B). Bucket com menos de 5 papéis sai com
        medianas null e `n_papers` real."
