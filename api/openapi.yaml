          required: false
          description: Linhas por página (1–500, default 100).
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: Cursor opaco de meta.next_cursor — mesma paginação das demais
            listagens.
          schema:
            type: string
      responses:
        "200":
          description: Linhas do import.
          content:
            application/json:
