              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo canônico do objeto. `equity_security` é o papel, separado de
              `company`; `securitization` é a emissão, separada da série
              negociável (`instrument`); e `fund_share_class` é a subclasse,
              separada da classe com CNPJ (`fund`). `indicator` representa o
              conceito medido, enquanto `data_series` representa uma publicação
              ou cálculo específico. `offering`, `market_event` e `norm` são
              objetos porque possuem identidade, atributos e relações próprias.
          required: false
        - in: query
          name: start_subkind
          schema:
            type: string
            description: Subtipo na partida (`fidc` em vez de `fund`).
          required: false
        - in: query
          name: end_id
          schema:
            type: string
            description: Prende a ponta final a um objeto.
          required: false
        - in: query
          name: end_kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo canônico do objeto. `equity_security` é o papel, separado de
              `company`; `securitization` é a emissão, separada da série
              negociável (`instrument`); e `fund_share_class` é a subclasse,
              separada da classe com CNPJ (`fund`). `indicator` representa o
              conceito medido, enquanto `data_series` representa uma publicação
              ou cálculo específico. `offering`, `market_event` e `norm` são
              objetos porque possuem identidade, atributos e relações próprias.
          required: false
        - in: query
          name: end_subkind
          schema:
            type: string
            description: Subtipo na ponta final (`debenture` em vez de `instrument`).
          required: false
        - in: query
          name: count_at
          schema:
            type: integer
            minimum: 0
            maximum: 3
            description: Posição contada na cadeia; 0 é a partida. Omitido conta a ponta
              final.
          required: false
        - in: query
          name: return_at
          schema:
            type: integer
            minimum: 0
            maximum: 3
            description: Posição listada; 0 (default) é a partida.
