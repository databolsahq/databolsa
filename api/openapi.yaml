        série amortizada com cota 0 e rentabilidade 0; quem filtrar só pela
        primeira mostra série fantasma rendendo 0% e puxa a média da classe para
        baixo. A série ENCERRADA fica na resposta de propósito — omiti-la
        produziria viés de sobrevivente no track record da gestora.


        O acumulado encadeia só mês OBSERVADO: buraco na série não vira zero.
        Compare `months_in_window` com os meses do período antes de concluir que
        um acumulado está baixo. Mês com `return_implausible` (a fonte publica
        coisas como -1.165,85%) fica fora do encadeamento, mas continua as-filed
        na linha.
