      summary: Curvas de juros de mercado por vértice (DI, pré, IPCA+, implícita)
      description: "Um ponto por vértice de prazo, em % a.a. `di` vem dos juros
        futuros; as demais são curvas de referência de mercado. Complementa a
        getYieldCurve (que é a régua do Tesouro Direto, um ponto por título).
        ATENÇÃO: `tenor_days` é em dias CORRIDOS (o vértice de 1 ano-calendário
        fica em ~365-374 dias, não em 252) — para comparar prazos entre curvas
        use `tenor_years`, que normaliza a convenção."
