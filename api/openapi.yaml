          type:
            - string
            - "null"
        qty_issued:
          type:
            - number
            - "null"
        qty_issued_zero_reason:
          type:
            - string
            - "null"
          description: "Só quando qty_issued = 0 e há valor nominal: 'not_placed' (série
            registrada e não colocada) | 'unreported'. O volume da emissão é
            face_value_issue x qty_issued, então sem isto a emissão parece valer
            R$ 0."
        qty_outstanding:
          type:
            - number
            - "null"
        qty_outstanding_as_filed:
          type:
            - number
            - "null"
          description: Quantidade em mercado exatamente como o SND arquiva, inclusive
            quando é 0. Serve para auditar a diferença contra qty_outstanding;
            para cálculo, use qty_outstanding.
        qty_outstanding_zero_reason:
          type:
            - string
            - "null"
          description: "Só quando a fonte arquiva 0 em mercado. O campo do SND tem largura
            fixa ('000000000000'), então zero e 'não informado' são a mesma
            string — este motivo é o que separa os dois. 'not_placed' (nada
            emitido) e 'fully_redeemed' (baixas fecham com o emitido, papel
            vencido e sem negócio recente) são zeros verificáveis e mantêm
            qty_outstanding = 0. 'contradicted_by_recent_trades' (negociou nos
            últimos 90 dias, logo não pode ter 0 em circulação),
            'redeemed_before_maturity_unverifiable' (baixas fecham mas a emissão
            segue registrada com vencimento à frente), 'unreported_no_movement'
            (nenhuma baixa arquivada), 'unreported_partial_movement' (baixas
            menores que o emitido) e 'unparseable' vêm com qty_outstanding null:
            não trate como zero."
