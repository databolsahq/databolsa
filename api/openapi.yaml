              - in
              - out
            default: in
            description: Lado da coorte na aresta de `rel`.
          required: false
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vigência das relações do recorte por `rel`. Sem `at`, usa o acervo
              histórico, como `listObjectLinks`.
          required: false
        - in: query
          name: where
          schema:
            type: string
            description: Cortes por palavra (`sector=Bancos`, `situation!=Em Liquidação`),
              com a sintaxe de `rankObjects`. Corte por número responde 422; use
              `rankObjects`.
          required: false
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
            maxLength: 120
            description: Busca por nome dentro da coorte, sem acento nem caixa. Para
              resolver uma identidade por chave ou apelido, use `resolveObject`.
          required: false
        - in: query
          name: props
          schema:
            type: string
            description: Propriedades a projetar em cada linha, separadas por vírgula (até
              8), pelos nomes de `meta.filterable_properties` —
              `bdr_kind,last_traded`. Saem em `properties`, como texto; nulo é
              folha sem a linha. É o catálogo numa página, sem uma chamada de
              `getObjectProperties` por objeto.
          required: false
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor opaco de `meta.next_cursor` da página anterior; omita na
              primeira página.
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: Itens por página (1–1000, default 100).
          required: false
        - in: query
          name: total
          schema:
            type: string
            description: true = inclui `meta.total` (contagem do universo filtrado). Custa
              uma consulta a mais.
          required: false
      summary: Lista objetos por tipo e propriedades
      description: Enumera a coorte do cadastro sem exigir uma medida. `kind`,
        `subkind`, relações e propriedades usam o mesmo recorte de `rankObjects`
        e `aggregateObjects`. Use `rankObjects` para filtros numéricos, `q` para
        nome dentro da coorte e `resolveObject` para localizar uma identidade.
        `props` projeta propriedades do catálogo em cada linha (`properties`),
        para o catálogo sair numa página. Com `total=true`, leia o total em
        `meta.cohort_size`.
