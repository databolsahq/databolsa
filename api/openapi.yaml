  /v1/theses:
    get:
      operationId: listMyTheses
      tags:
        - Teses
      summary: Minhas teses
      description: "Lista as teses do dono da chave (resumo: título, ticker,
        visibilidade, status de export) e o teto do plano. O documento completo
        vem no getThesis."
      responses:
        "200":
          description: Teses + limite do plano (null = ilimitado).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThesisSummary"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      limit:
                        type: number
                        nullable: true
                        description: Teto de teses do plano (null = ilimitado).
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createThesis
      tags:
        - Teses
      summary: Criar tese
      description: "Cria uma tese escrita em markdown (`md`). Título, ticker e tipo
        saem do frontmatter. Respeita o limite de teses do plano (402
        plan_required ao estourar). FORMATO: Markdown com frontmatter YAML.
        Obrigatórios no frontmatter: `kind`
        (equity|fii|macro|setor|carta|carteira) e `title`. Opcionais:
        `subtitle`, `ticker`, `date` (AAAA-MM-DD), `tags`. Autor, capa, ids de
        seção e disclaimer o servidor preenche — não escreva. No corpo: `##
        Título` abre uma seção; parágrafos, listas e `###` viram prosa em GFM;
        tabela GFM vira tabela do relatório; `>
        [!risco|tese|catalisador|atenção|info] Título` vira caixa de destaque
        (linhas `- item` viram bullets). Blocos ricos vão em cercas ```db:<tipo>
        com corpo YAML, onde <tipo> é rating, keyStats, summary, chart,
        scenarios, sources, quote, figure, table, cover ou disclaimer. Um bloco
        fora do formato NÃO derruba a tese: ele degrada para um aviso de atenção
        no documento e aparece em `warnings` na resposta, com linha e campo,
        para você corrigir depois. O campo `doc` (ReportDoc JSON pronto)
        continua aceito no lugar de `md`, para clientes antigos, mas ali a
        validação é tudo-ou-nada: um campo fora do schema recusa o documento
        inteiro."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - md
              properties:
                md:
                  type: string
                  description: "Markdown da tese. Markdown com frontmatter YAML. Obrigatórios no
                    frontmatter: `kind` (equity|fii|macro|setor|carta|carteira)
                    e `title`. Opcionais: `subtitle`, `ticker`, `date`
                    (AAAA-MM-DD), `tags`. Autor, capa, ids de seção e disclaimer
                    o servidor preenche — não escreva. No corpo: `## Título`
                    abre uma seção; parágrafos, listas e `###` viram prosa em
                    GFM; tabela GFM vira tabela do relatório; `>
                    [!risco|tese|catalisador|atenção|info] Título` vira caixa de
                    destaque (linhas `- item` viram bullets). Blocos ricos vão
                    em cercas ```db:<tipo> com corpo YAML, onde <tipo> é rating,
                    keyStats, summary, chart, scenarios, sources, quote, figure,
                    table, cover ou disclaimer. Um bloco fora do formato NÃO
                    derruba a tese: ele degrada para um aviso de atenção no
                    documento e aparece em `warnings` na resposta, com linha e
                    campo, para você corrigir depois."
                doc:
                  allOf:
                    - $ref: "#/components/schemas/ReportDocInput"
                  deprecated: true
                  description: "OBSOLETO — use `md`. ReportDoc JSON pronto, aceito para clientes
                    anteriores ao markdown. Aqui a validação é tudo-ou-nada: um
                    campo fora do schema recusa o documento inteiro."
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                  description: "Default: private."
      responses:
        "201":
          description: Tese criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
                  warnings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThesisWarning"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/theses/{id}/edit:
    post:
      operationId: editThesis
      tags:
        - Teses
      summary: Editar um trecho da tese
      description: "Substitui UM trecho do markdown, sem reenviar o documento inteiro
        — é o caminho barato para corrigir um parágrafo, um número ou um bloco.
        `old_text` precisa aparecer EXATAMENTE UMA vez: se não aparecer, ou
        aparecer mais de uma, a operação falha dizendo quantas vezes achou, em
        vez de trocar a ocorrência errada em silêncio. Inclua as linhas ao redor
        até o trecho ficar único. `new_text` vazio remove o trecho. Para
        reescritas grandes, use updateThesis."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_text
                - new_text
              properties:
                old_text:
                  type: string
                  description: Trecho exato do markdown a substituir, como veio no `md` do
                    getThesis.
                new_text:
                  type: string
                  description: Texto que entra no lugar. Vazio remove o trecho.
      responses:
        "200":
          description: Tese atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
                  warnings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThesisWarning"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
