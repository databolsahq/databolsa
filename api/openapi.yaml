      summary: Detalhe de uma tese
      description: Markdown da tese (`md`) + visibilidade + status do export (quando
        `ready`, `pdfUrl`/`previewUrl` apontam para a mídia pública). Para ler
        ou editar, use `md`; o documento compilado é derivado dele e só vem com
