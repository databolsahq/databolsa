      additionalProperties: false
      description: Documento de report estruturado, com seções e blocos discriminados
        por `kind`. O schema é gerado do mesmo validador que aceita escritas no
        servidor; erros voltam com o caminho do campo violado.
    PortfolioHolding:
      type: object
      description: Posição computada da carteira (snake_case, como todo o /v1).
        `asset_type` e `transactions[].trade_date` são os MESMOS campos do
        ledger (listPortfolioTransactions). Valores monetários sempre em BRL;
        ativos em moeda estrangeira (asset_type=us) expõem também currency,
        price_native (US$), fx_rate e o bloco `native` com a MESMA posição em
        dólar (custo, valor de mercado e P&L).
      properties:
        symbol:
          type: string
        asset_type:
          type: string
          description: stock | fii | etf | bdr | index | tesouro | crypto | option |
            renda_fixa | debenture | fund | us. `debenture` = crédito privado
            com catálogo próprio (símbolo = código do papel); `fund` = fundo CVM
            175 (símbolo = CNPJ da classe, 14 dígitos).
        name:
          type: string
        qty:
          type: number
        avg_price:
          type:
            - number
            - "null"
          description: Preço médio de custo (null = custo desconhecido/watchlist).
        invested_cost:
          type:
            - number
            - "null"
        cost_basis_known:
          type: boolean
          description: true quando todos os buy/sell têm preço → P&L confiável.
        price:
          type:
            - number
            - "null"
          description: Cotação atual em BRL (null = sem cotação).
        change_pct:
          type:
            - number
            - "null"
          description: Variação do dia em BRL. Em posição estrangeira é o COMPOSTO do
            retorno do ativo com o do câmbio, (1+ativo)×(1+câmbio)−1 — a
            variação só do ativo, na moeda dele, está em native.change_pct.
        market_value:
          type:
            - number
            - "null"
        unrealized_pl:
          type:
            - number
            - "null"
          description: Resultado não-realizado em R$. Com valuation=accrual (renda fixa
            privada) é RENDIMENTO acruado pela taxa contratada, não marcação a
            mercado.
        unrealized_pct:
          type:
            - number
            - "null"
          description: Percentual sobre o custo. null quando o percentual é indefinido —
            veja unrealized_pct_reason.
        unrealized_pct_reason:
          type:
            - string
            - "null"
          enum:
            - zero_cost
            - cost_unknown
            - null
          description: "Por que unrealized_pct é null numa posição aberta e valorada:
            zero_cost = custo abaixo de um centavo (resíduo de fusão/bonificação
            — o percentual é indefinido, não 0 nem centenas de por cento);
            cost_unknown = há buy/sell sem preço no ledger. null = percentual
            definido."
        valuation:
          type:
            - string
            - "null"
          enum:
            - market
            - accrual
            - cost
            - null
          description: "Como a posição foi valorada (linhagem do número): market = cotação
            (para debênture, o PU do secundário com no máx. ~30 dias); accrual =
            renda fixa/debênture acruada pela taxa contratada (contrato do
            usuário ou pré-preenchido do catálogo — veja meta.rf.source); cost =
            sem cotação, marcada pelo custo remanescente; null = sem valor de
            mercado."
        realized_pl:
          type:
            - number
            - "null"
        realized_by_month:
          type: object
          additionalProperties:
            type: number
          description: "'AAAA-MM' → R$ realizado no mês. Só presente com `include=monthly`."
        income_received:
          type: number
          description: Proventos recebidos acumulados (R$).
        income_by_month:
          type: object
          additionalProperties:
            type: number
          description: "'AAAA-MM' → R$ de proventos no mês. Só presente com
            `include=monthly`."
        weight_pct:
          type:
            - number
            - "null"
        day_change_brl:
          type:
            - number
            - "null"
        added_at:
          type:
            - string
            - "null"
          description: Data da 1ª transação (AAAA-MM-DD).
        tx_count:
          type: integer
          description: Nº de transações da posição.
        closed:
          type: boolean
          description: qty = 0 com transações (posição encerrada).
        is_watchlist:
          type: boolean
          description: Entrada sem nenhuma transação (radar).
        priced:
          type: boolean
        renamed_to:
          type:
            - string
            - "null"
          description: Ticker vigente quando o papel foi renomeado/incorporado.
        merged_from:
          type:
            - array
            - "null"
          items:
            type: string
          description: "Tickers antigos fundidos nesta posição por sucessão (ex.:
            ['BCFF11'] num holding BTHF11). O ledger em `transactions` já inclui
            as transações dos predecessores. null = nenhum."
        currency:
          type: string
          description: Moeda nativa de negociação (BRL | USD).
        price_native:
          type:
            - number
            - "null"
          description: Cotação na moeda nativa quando ≠ BRL.
        fx_rate:
          type:
            - number
            - "null"
          description: Câmbio usado na marcação (price = price_native × fx_rate).
        native:
          $ref: "#/components/schemas/PortfolioHoldingNative"
        asset_id:
          type:
            - string
            - "null"
          description: Id do ativo no ledger (correlaciona com /assets e /transactions).
        meta:
          description: "portfolio_assets.meta (ex.: { rf: { indexer, rate } })."
        transactions:
          type: array
          description: Ledger da posição, ordenado por trade_date. Só presente com
            `include=transactions`; o mesmo dado, por ativo, está em
            listPortfolioTransactions.
          items:
            $ref: "#/components/schemas/PortfolioTransaction"
      required:
        - symbol
        - asset_type
        - qty
    PortfolioHoldingNative:
      type:
        - object
        - "null"
      description: >-
        A MESMA posição na moeda em que ela é negociada, quando não é o real
        (hoje, asset_type=us em USD). null para o que negocia em BRL.


        NÃO é o bloco em BRL dividido por fx_rate: é o mesmo cálculo rodado
        sobre o ledger cru, porque cada compra foi convertida pela PTAX da SUA
        data. Por isso invested_cost é o que se pagou em dólar e unrealized_pct
        é o retorno do ATIVO, enquanto o unrealized_pct em BRL embute também a
        variação do câmbio no período. Os dois estão certos e respondem a
        perguntas diferentes.


        Não repete qty (idêntico), weight_pct (adimensional) nem day_change_brl
        (escopo BRL).
      properties:
        currency:
          type: string
          description: "Moeda da negociação (ex.: USD)."
        avg_price:
          type:
            - number
            - "null"
          description: Preço médio pago na moeda nativa.
        invested_cost:
          type:
            - number
            - "null"
        cost_basis_known:
          type: boolean
          description: "Pode divergir do cost_basis_known em BRL: numa data sem PTAX o
            custo em real fica desconhecido enquanto o em dólar segue
            conhecido."
        price:
          type:
            - number
            - "null"
          description: Cotação na moeda nativa (= price_native).
        change_pct:
          type:
            - number
            - "null"
          description: Variação do dia do ativo, sem o câmbio.
        market_value:
          type:
            - number
            - "null"
        unrealized_pl:
          type:
            - number
            - "null"
        unrealized_pct:
          type:
            - number
            - "null"
          description: Retorno do ativo, sem o efeito do câmbio.
        realized_pl:
          type:
            - number
            - "null"
        income_received:
          type: number
      required:
        - currency
    PortfolioFx:
      type:
        - object
        - "null"
      description: >-
        Câmbio USD/BRL aplicado na marcação a mercado das posições estrangeiras
        desta carteira. Publicado para a conversão ser conferível: os totais da
        carteira são BRL e dependem desta taxa. null quando a carteira não tem
        ativo em moeda estrangeira.


        Atenção: esta é a taxa SPOT, usada só na marcação. O custo de cada
        compra foi convertido pela PTAX da data do trade, então invested_cost ÷
        usd_brl não devolve o custo em dólar — para isso use
        holdings[].native.invested_cost.
      properties:
        usd_brl:
          type: number
          description: Reais por dólar.
        as_of:
          type: string
          description: Timestamp da taxa. Com source=usdt é ISO 8601 completo (o par é
            atualizado a cada minuto); com source=bcb é a data do pregão
            (AAAA-MM-DD).
        source:
          type: string
          enum:
            - usdt
            - bcb
          description: usdt = par USDT/BRL, atualizado 24/7 e fresco mesmo fora do horário
            de pregão; bcb = PTAX de venda do BCB (série 1), último fechamento —
            o fallback.
        change_pct:
          type:
            - number
            - "null"
          description: Variação da PRÓPRIA fonte acima (24h do par × pregão a pregão da
            PTAX), nunca uma mistura das duas. Compõe change_pct das posições
            estrangeiras.
      required:
        - usd_brl
        - as_of
        - source
    PortfolioByCarteira:
      type: object
      properties:
        name:
          type: string
        patrimonio:
          type: number
        unrealized_pct:
          type: number
        open_positions:
          type: integer
          description: Posições com quantidade > 0 nesta carteira.
        watchlist_entries:
          type: integer
          description: Entradas sem nenhuma transação (radar) nesta carteira.
      required:
        - name
        - patrimonio
        - unrealized_pct
        - open_positions
        - watchlist_entries
    PortfolioListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ledger_assets:
          type: integer
          description: Nº de LINHAS DE ATIVO no ledger da carteira. Inclui posições já
            encerradas e tickers predecessores fundidos por sucessão, que não
            têm holding próprio — por isso é ≥ holdings_count do detalhe, que
            por sua vez é ≥ open_positions.
        created_at:
          type: string
          format: date-time
        exclude_from_consolidated:
          type: boolean
          description: true = carteira de simulação.
      required:
        - id
        - name
    PortfolioDetail:
      type: object
      description: "Carteira computada: posições derivadas do ledger + métricas
        agregadas (snake_case)."
      properties:
        id:
          type: string
        name:
          type: string
        visibility:
          type: string
        created_at:
          type:
            - string
            - "null"
        exclude_from_consolidated:
          type: boolean
          description: true = carteira de simulação.
        holdings_count:
          type: integer
          description: "Linhas devolvidas em holdings[]. Default: abertas + watchlist; com
            `include=closed` soma também as encerradas."
        open_positions:
          type: integer
          description: Posições com quantidade > 0.
        closed_positions:
          type: integer
          description: Posições zeradas por venda (qty = 0 com transações).
        watchlist_entries:
          type: integer
          description: Entradas sem nenhuma transação (radar).
        merged_assets:
          type: integer
          description: Tickers predecessores fundidos nas posições por sucessão. Contam em
            ledger_assets (listPortfolios) e não em holdings_count — é a
            diferença entre as duas contagens.
        patrimonio:
          type: number
        invested:
          type: number
        unrealized_pl:
          type: number
        unrealized_pct:
          type: number
        realized_pl:
          type: number
        realized_by_month:
          type: object
          additionalProperties:
            type: number
        income_received:
          type: number
        income_by_month:
          type: object
          additionalProperties:
            type: number
        total_pl:
          type: number
          description: unrealized_pl + realized_pl.
        xirr:
          type:
            - number
            - "null"
          description: "XIRR (TIR anualizada, money-weighted): o retorno REAL do
            investidor sobre os fluxos datados (aportes/resgates/proventos) +
            patrimônio a mercado como valor terminal. Decimal a.a. (0,1423 =
            14,23%). null quando custo desconhecido, fluxo sem TIR definível ou
            implausível (> +300% a.a., artefato de giro/curto prazo → use o
            twr). Mesmo valor de returns.xirr, onde ele aparece ao lado do
            time-weighted."
        returns:
          $ref: "#/components/schemas/PortfolioReturns"
        day_change_brl:
          type: number
        day_change_pct:
          type: number
        kind_mix:
          type: string
          description: "Resumo humano, ex.: '3 ações · 2 FIIs'."
        is_watchlist:
          type: boolean
        any_unpriced:
          type: boolean
        any_cost_unknown:
          type: boolean
        fx:
          $ref: "#/components/schemas/PortfolioFx"
        holdings:
          type: array
          description: "Posições com qty, preço médio, valor de mercado, P&L, proventos e
            peso. Default compacto: só abertas + watchlist (posições encerradas
            exigem `include=closed`) e sem as séries mensais por posição
            (`include=monthly`)."
          items:
            $ref: "#/components/schemas/PortfolioHolding"
    PortfolioTransaction:
      type: object
      description: Transação do ledger. É o MESMO shape das transações embutidas em
        PortfolioHolding.transactions.
      properties:
        id:
          type: string
        kind:
          type: string
          description: buy | sell | split | adjust
        trade_date:
          type: string
          description: AAAA-MM-DD
        quantity:
          type: number
        price:
          type:
            - number
            - "null"
          description: Preço unitário (null = custo desconhecido).
        fees:
          type: number
        ratio:
          type:
            - number
            - "null"
          description: Fator do split (só kind=split).
        currency:
          type: string
          description: "Moeda de price/fees DESTA linha. O ledger é devolvido CRU, como
            lançado: o de um ativo americano vem em USD e NÃO passou pela
            conversão que as posições sofrem. Sem ler este campo o consumidor
            assume real e exibe uma compra de US$ 178,40 como R$ 178,40."
        note:
          type:
            - string
            - "null"
        event_kind:
          type:
            - string
            - "null"
          description: "Subtipo do evento societário de origem quando a transação veio de
            evento (import da Movimentação B3): split | bonus | incorporation |
            subscription | fraction. null = lançamento comum."
      required:
        - id
        - kind
        - trade_date
        - quantity
    PortfolioTwr:
      type:
        - object
        - "null"
      description: TWR (time-weighted return) derivado da série mensal — neutraliza o
        efeito do timing dos aportes, o número comparável a benchmark
        (CDI/IBOV/IPCA). null quando não há período válido.
      properties:
        cumulative:
          type: number
          description: Retorno acumulado na janela (decimal; 0,25 = +25%).
        annualized:
          type:
            - number
            - "null"
          description: Equivalente anualizado (decimal).
        months:
          type: integer
          description: Meses na grade.
    PortfolioReturns:
      type: object
      description: As DUAS medidas de retorno da carteira no mesmo objeto. Elas
        divergem sempre que os aportes não são uniformes — é esperado, não é
        erro, e `explain` diz isso em uma linha.
      properties:
        xirr:
          type:
            - number
            - "null"
          description: Money-weighted anualizada (decimal a.a.).
        twr:
          $ref: "#/components/schemas/PortfolioTwr"
        explain:
          type: string
          description: Nota curta sobre a diferença entre as duas medidas.
    PortfolioHistoryResponse:
