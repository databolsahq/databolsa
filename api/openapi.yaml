            sem os fatores disponíveis."
        local_return_pct:
          type:
            - number
            - "null"
          description: "Quanto a série andou ALÉM do que os fatores explicam, em %. É o
            descolamento próprio do dia: um IBOV que cai 5% num dia de queda
            global de 5% tem local_return_pct ≈ 0."
        local_zscore:
          type:
            - number
            - "null"
          description: "Desvios-padrão do descolamento local. É o critério de anomalia
            quando presente: separa 'o mundo caiu' de 'o Brasil caiu'."
        explained_by:
          oneOf:
            - $ref: "#/components/schemas/PublicMarketEvent"
            - type: "null"
          description: Evento que explica o dia anômalo, quando casado.
      required:
        - day
        - series_code
        - return_pct
        - zscore
        - direction
        - factor_model
        - local_return_pct
        - local_zscore
        - explained_by
