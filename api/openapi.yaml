                      count:
                        type: integer
                        description: Itens nesta página.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/imports/{importId}/rows:
    get:
      operationId: listPortfolioImportRows
      tags:
        - Carteira
      summary: Linhas de um import
      description: "Drill-down de um import: cada linha do arquivo com status
        (imported, ignored, duplicate, error) e motivo."
