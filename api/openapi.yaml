              - cpr_financeira
              - warrant_agropecuario
              - cri
              - cra
              - cr
              - cdca
              - outros_securitizacao
              - cota_fidc
              - cota_fii
              - cota_fip
              - cota_fiagro
              - cota_fundo
              - cota_fundo_infra
              - cota_funcine
              - token_cota_fundo
              - cert_audiovisual
              - cert_energia
              - tic
              - nao_mapeado
            description: Instrumento CANÔNICO — o filtro recomendado. A fonte usa um
              vocabulário por regime (60 grafias para ~28 instrumentos), então
              `instrumento=debenture` recupera tanto 'Debêntures' quanto
              'DEBÊNTURES SIMPLES'.
        - in: query
          name: familia
          schema:
            type: string
            enum:
              - divida
              - securitizacao
              - equity
              - fundo
              - outro
              - nao_mapeado
            description: "Agrupamento do instrumento: divida | securitizacao | equity |
              fundo | outro."
        - in: query
          name: tipo_ativo
          schema:
            type: string
            description: Grafia AS-FILED da fonte, casada sem acento e sem caixa. Não
              expande para as grafias irmãs do mesmo instrumento — para o
              conjunto completo use `instrumento`. Aceita também um valor de
              `instrumento`/`familia`, e nesse caso filtra pela coluna canônica.
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Recorta por `data_referencia`, a mesma coluna da ordenação default.
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Recorta por `data_referencia`, a mesma coluna da ordenação default.
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - data_referencia
              - data_registro
              - data_processo
              - data_encerramento
              - valor_total
            default: data_registro
            description: "Campo de ordenação. `data_registro` e `data_referencia` são
              sinônimos e ordenam por data_referencia (data_registro >
              data_inicio > data_processo): o acervo ICVM 476 não tem data de
              registro, e ordenar pela coluna crua o empurrava todo para o fim."
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - in: query
          name: fields
          schema:
            type: string
            description: "Projeção: lista de campos separada por vírgula (ex.:
              `instrumento,valor_total,data_referencia`). `offering_id` sempre
              incluído. Sem o parâmetro, a resposta traz todos os 29 campos."
      summary: Ofertas públicas de distribuição (mercado primário)
      description: >-
        Registro de ofertas públicas (IPO/follow-on de ações, debêntures, cotas
        de fundos), unificando o histórico ICVM 400/476/555 e o rito automático
        RCVM 160. Grão: SÉRIE da oferta — um processo multissérie tem uma linha
        por série, e o valor pode diferir entre elas. Filtrável por emissor,
        regime, instrumento/família e período; ordena por `sort`/`order`
        (default: `data_referencia` decrescente). Fonte: CVM.


        COBERTURA. O acervo de esforços restritos (ICVM 476, 2008-2022) é 44% da
        base e não tem `data_registro` nem `numero_processo` — use
        `data_referencia` para série temporal e `regime_registro` para separar
        ofertas registradas de dispensadas.


        ANTES DE SOMAR `valor_total`: é o valor REGISTRADO, não o colocado, e é
        campo livre na fonte. Exclua `value_is_sentinel` (preenchimento com
        noves; um único registro de 2022 infla o ano em 40x) e
        `value_pre_real_currency` (cruzeiro/cruzado não convertido).
