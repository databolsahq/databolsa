      forward_name: offered_instruments
      inverse_name: offering
      note: 'A oferta contém este instrumento registrado na CVM. `from` é a oferta; a
        leitura "em que oferta este papel saiu" usa a direção `in`. A forma é
        `static` porque identifica o item ofertado. O casamento deve ser
        determinístico: registro CVM; emissor, quantidade e família; ou
        securitizadora, família, emissão e série. Nunca relacione por nome ou
        título parecido. Conflito entre regras fica sem aresta até revisão;
        oferta multissérie pode ter uma aresta por série'
    - rel: owes_under
      shape: snapshot
      max_gap_days: 45
      domain_kinds:
        - company
        - fund
      range_kinds:
        - securitization
      forward_name: obligations
      inverse_name: obligors
      note: 'O DEVEDOR DEVE sob os créditos que lastreiam o objeto — o sacado do
        recebível securitizado, declarado por competência no informe mensal de
        securitizadora (Fonte: CVM). `from` é o devedor; a leitura "quem deve
        sob esta emissão" usa a direção `in`. `snapshot` porque a lista é um
        retrato por competência. `magnitude` é a participação declarada do
        devedor em pontos percentuais (`share_pct`) e fica nula quando a fonte
        não publica uma parte válida. DEVEDOR NÃO É EMISSOR: a securitizadora
        emite, o cedente transfere o recebível e o devedor o paga. Uma empresa
        que exerça mais de um papel gera arestas distintas, nunca uma fusão
        semântica'
    - rel: produces
      shape: snapshot
      max_gap_days: 400
      domain_kinds:
        - country
      range_kinds:
        - commodity
      forward_name: produced_commodities
      inverse_name: producers
      note: "O PAÍS PRODUZ a commodity mineral, por ano de referência do USGS. `from`
        é o país porque `from` é sempre quem pratica a ação do verbo. NÃO liga
        empresa a produto: os produtores que a fonte publica são PAÍSES, e ligar
        Vale a minério de ferro por semelhança de nome seria o vínculo
        silencioso e errado de sempre — quando existir fonte que ligue companhia
        a produto, ela entra por aqui sem mudar o verbo. As duas linhas
        agregadas da fonte (`World total` e `Other countries`) ficam de fora:
        nenhuma das duas é um país. `magnitude` é a PARTICIPAÇÃO NO TOTAL
        MUNDIAL em pontos percentuais, não a quantidade: quantidade sai em
        toneladas, quilates ou quilos conforme a commodity e não se compara
        entre elas, enquanto a participação se compara sempre. Nula onde a
        própria fonte marca as bases como não somáveis (`incomparable_basis`:
        nas reservas de boro a Turquia declara borato refinado, o Chile ulexita
        e a China óxido bórico). Commodity com mais de um agregado (cobre tem
        produção de mina e de refino, com totais mundiais distintos) usa UM
        recorte só — o que mais países reportam —, e o país que só reporta o
        outro recorte mantém a aresta com magnitude nula: a relação é verdadeira
        mesmo quando o número não é comparável"
    - rel: rates
      shape: event
      max_gap_days: null
      domain_kinds:
        - service_provider
      range_kinds:
        - instrument
        - fund
        - company
      forward_name: rated
      inverse_name: rated_by
      note: 'A AGÊNCIA AVALIA o papel ou o emissor — `from` é a agência porque `from`
        é sempre quem pratica a ação do verbo; a leitura natural "este CRI é
        avaliado pela Fitch" é a direção `in`. Fonte é o relatório da própria
        agência lido por LLM e NÃO o campo declarado no informe da CVM (texto
        livre com ~4% de nota legível; serve para conferir e não para publicar).
        `event` porque a ação de rating tem DATA e permanece fato histórico:
        rebaixamento de 2023 continua tendo acontecido depois de a nota subir em
        2025'
    - rel: registered_as
      shape: interval
      max_gap_days: null
      domain_kinds:
        - company
        - service_provider
      range_kinds:
        - role
      forward_name: roles
      inverse_name: registrants
      note: "A empresa ou prestador está autorizado a exercer o papel segundo o
        registro da CVM; autorização não prova exercício. `from` é quem possui o
        registro. Mantenha esta relação separada de `manages`, `administers`,
        `rates` e `distributes`, que afirmam atuação observada. Nunca derive
        autorização do cadastro de um fundo. A forma é `interval`: `dt_reg` abre
        a vigência, `dt_cancel` fecha e `valid_to` nulo significa registro
        aberto"
    - rel: regulated_by
      shape: static
      max_gap_days: null
      domain_kinds:
        - offering
        - fund
        - fund_share_class
        - service_provider
        - instrument
        - company
      range_kinds:
        - norm
      forward_name: regulating_norms
      inverse_name: regulated
      note: 'O OBJETO ESTÁ SOB a norma — o regime regulatório que o rege, como um lado
        de aresta e não como string. `from` é o objeto regulado porque é ele que
        está sujeito à norma; a leitura "tudo que está sob a RCVM 88" é a
        direção `in`. ESTRUTURAL (`static`): a oferta de 2019 continua tendo
        sido feita sob a ICVM 476 mesmo depois de a 476 ser revogada — a
        vigência é da NORMA (propriedade `status`, aresta `revokes`), não da
        relação. SÓ ONDE A FONTE DECLARA O REGIME: `regime_registro` da oferta
        registrada, `regime` do token, o tipo de comunicado do sistema de
        esforços restritos (crowdfunding) e o cadastro CROWDFUNDING/CAD
        (plataforma); a classe de fundo do cadastro vigente da CVM opera sob a
        RCVM 175 por definição da própria norma. O mapeamento string → norma é o
        seed `norm_regime_rules.csv`, não SQL escrito à mão. Nasceu em
        29/08/2026, quando "cvm88" no chat resolvia para crédito privado
        qualquer porque a norma não era objeto'
    - rel: revokes
      shape: event
      max_gap_days: null
      domain_kinds:
        - norm
      range_kinds:
        - norm
      forward_name: revoked_norms
      inverse_name: revoked_by
      note: A NORMA REVOGA outra — a RCVM 88 revoga a ICVM 588, a RCVM 175 revoga a
        ICVM 555. `from` é quem revoga; "o que a 175 revogou" é a direção `out`.
        `event` datado pela publicação da norma revogadora. Vem do seed
        `norms.csv` (coluna `revoked_by`); a norma revogada segue objeto e segue
        como lado de `regulated_by` das ofertas feitas sob ela — revogar a norma
        não reescreve a história
    - rel: same_owner
      shape: static
      max_gap_days: null
      domain_kinds:
        - company
      range_kinds:
        - company
      forward_name: same_owner
      inverse_name: same_owner
      note: Dois cedentes que compartilham sócio PJ — simétrica
    - rel: shareholder_of
      shape: static
      max_gap_days: null
      domain_kinds:
        - company
        - fund
        - service_provider
      range_kinds:
        - company
      forward_name: shareholdings
      inverse_name: shareholders
      note: Sócio pessoa jurídica na Receita — participação societária SEM percentual
        nem qualificação
    - rel: succeeded_by
      shape: event
      max_gap_days: null
      domain_kinds:
        - fund
        - company
        - equity_security
      range_kinds:
        - fund
        - company
        - equity_security
      forward_name: successors
      inverse_name: predecessors
      note: Sucessão societária real (incorporação/cisão) — não é renome de código
    - rel: tokenized_as
      shape: static
      max_gap_days: null
      domain_kinds:
        - offering
      range_kinds:
        - instrument
      forward_name: tokens
      inverse_name: tokenized_offering
      note: 'A OFERTA FOI TOKENIZADA como este contrato — a oferta RCVM 88 e o token
        ERC-20 que a representa na rede. `from` é a oferta porque é ela que
        pratica a ação (foi tokenizada); a leitura "qual oferta é este token" é
        a direção `in`. ESTRUTURAL, não datada: o token é a mesma oferta em
        outro registro. SÓ ONDE O CASAMENTO É DETERMINÍSTICO: mesma plataforma e
        quantidade exata, única na plataforma, ou desempatada pela data de
        criação do contrato a ≤ 45 dias. Não casa por nome (a CVM não nomeia a
        oferta) nem por valor aproximado — tranches seriadas com lote idêntico e
        tokens migrados de rede ficam sem aresta, e a diferença entre
        "tokenizável" declarado e token de fato é exatamente o que este verbo
        mede. Nasceu em 26/08/2026 com a MB (24 de 32 tokens casados)'
