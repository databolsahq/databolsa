      description: >-
        Todas as ações observadas, append-only: um rating é evento datado, não
        atributo mutável — 'a Fitch atribuiu AA+ em 12/03/2025' continua verdade
        depois de um rebaixamento em 2026. Exige `assetCode` (ISIN) ou
        `issuerCnpj`.


        `superseded_by` preenchido marca a linha corrigida: correção cria linha
        nova em vez de editar o fato, e a linha antiga fica como trilha de
        auditoria. `extracted_at` é quando nós soubemos; `action_date` é quando
        a agência agiu — as duas datas são distintas de propósito.
