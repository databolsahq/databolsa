        funds_shares_delta:
          type:
            - number
            - "null"
          description: Variação de posição em QUANTIDADE, medida só no painel balanceado;
            null quando não é comparável
        funds_value_flow_brl:
          type:
            - number
            - "null"
          description: "O fluxo em R$ (Δqtd × preço implícito). O Δ do valor bruto NÃO
            serve como fluxo: em ITUB4 (04→05/2026) o bruto dá −44,2 Mi enquanto
            o fluxo é +153,2 Mi — sinal trocado."
        funds_value_price_effect_brl:
          type:
            - number
            - "null"
          description: parcela do Δ em R$ que veio só da marcação
        funds_entered:
          type:
            - number
            - "null"
          description: fundos que abriram posição COMPRADA (short entra em
            funds_opened_short)
        funds_exited:
          type:
            - number
            - "null"
          description: fundos que zeraram posição COMPRADA
        funds_increased:
          type:
            - number
            - "null"
        funds_decreased:
          type:
            - number
            - "null"
        funds_opened_short:
          type:
            - number
            - "null"
          description: fundos que abriram posição vendida
        funds_closed_short:
          type:
            - number
            - "null"
          description: fundos que zeraram posição vendida
        funds_qty_undisclosed:
          type:
            - number
            - "null"
          description: fundos cortados do delta por declararem R$ sem quantidade num dos
            meses
        funds_partial_disclosure:
          type:
            - number
            - "null"
          description: fundos cortados do painel por divulgação parcial
        funds_appeared:
          type:
            - number
            - "null"
          description: fundos cortados do delta por terem COMEÇADO a divulgar carteira —
            entrada na base, não compra
        funds_panel_n:
          type:
            - number
            - "null"
          description: fundos presentes nas DUAS competências
        funds_panel_coverage_pct:
          type:
            - number
            - "null"
          description: PERCENTUAL (0–100) do universo coberto pelo painel — 98,16
            significa 98,16%, não 0,98%. Abaixo do limiar de 90 o delta sai null
            com o motivo em funds_delta_reason. Para o TAMANHO do painel use
            funds_panel_n, que é a contagem de fundos.
        funds_delta_reason:
          type:
            - string
            - "null"
          enum:
            - fora_da_janela_cda
            - primeira_competencia
            - competencia_ausente
            - painel_incompleto
            - null
          description: por que o delta não existe; null = delta válido
        issuer_cnpj:
          type:
            - string
            - "null"
        is_issuer_anchor_ticker:
          type:
            - boolean
            - "null"
          description: true no ÚNICO ticker somável do emissor — filtre por ele antes de
            agregar insider
        insider_net_shares:
          type:
            - number
            - "null"
        insider_net_value_brl:
          type:
            - number
            - "null"
        insider_buy_value_brl:
          type:
            - number
            - "null"
        insider_sell_value_brl:
          type:
            - number
            - "null"
        insider_corporate_event_shares:
          type:
            - number
            - "null"
          description: NÃO SOMAR a insider_net_shares — eventos não-mercado (bonificação,
            herança, grupamento)
        insider_reason:
          type:
            - string
            - "null"
          enum:
            - sem_cnpj_no_cadastro
            - ativo_sem_insider
            - sem_vlmo_no_mes
            - null
          description: por que não há insider no mês; null = há dado
        lineage:
          type:
            - string
            - "null"
      required:
