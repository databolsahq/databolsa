    get:
      responses:
        "200":
          description: Página de COEs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoeInstrument"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      secondary_window:
                        $ref: "#/components/schemas/CoeSecondaryWindow"
                    required:
                      - next_cursor
                      - count
                      - secondary_window
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listCoes
      tags:
        - Estruturados
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: issuer
          schema:
            type: string
            description: Busca pelo nome do emissor (parcial).
        - in: query
          name: maturityFrom
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento a partir de (YYYY-MM-DD).
        - in: query
          name: maturityTo
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento até (YYYY-MM-DD).
        - in: query
          name: minIssueSize
          schema:
            type: number
            description: Tamanho mínimo da emissão, em BRL.
        - in: query
          name: tradedOnly
          schema:
            type: boolean
            description: Somente os que tiveram negócio em secundário dentro da janela de
              pregões coberta (`meta.secondary_window`). Não é "já girou alguma
              vez".
      summary: "Catálogo de COE registrado no balcão: emissor, tamanho, prazo e
        secundário observado"
      description: >-
        COE (Certificado de Operações Estruturadas) do registro público de
        balcão da B3, um código por linha, com o cadastro as-filed mais recente
        e o agregado de negociação secundária **sobre os pregões de balcão que
        observamos** — a janela efetiva vem em `meta.secondary_window` (`from`,
        `to`, `sessions`).


        **Esta superfície é separada de `/v1/credit` de propósito.** O corte de
        `/credit` é quem deve — debênture, CDB, LCI/LCA, CRI/CRA são risco de
        emissor com retorno contratado. O COE não é isso: é um payoff de
        derivativo embrulhado no risco de crédito do banco emissor, e o
        investidor carrega os dois. Tratá-lo como renda fixa é o erro que a
        opacidade do produto explora.


        **O que este endpoint NÃO responde:** se um COE é bom, quanto ele rende,
        se tem capital protegido, qual o ativo subjacente ou quais os cenários
        de retorno. Isso vive no DIE (Documento de Informações Essenciais), que
        não é dado estruturado público.
        `indexer`/`indexer_pct`/`additional_rate_pct` são campos do REGISTRO e
        não descrevem o retorno do investidor — lê-los como taxa é o erro
        clássico aqui.


        **O que ele responde:** quanto cada emissor colocou no mercado, com que
        prazo, e o que girou em secundário nos pregões cobertos.


        **Como ler o secundário null.** Os campos
        `trade_days`/`trade_count_total`/`volume_brl_total`/`last_trade_date`
        vêm null para a maioria esmagadora dos papéis, e o único significado
        exato disso é: nenhum negócio registrado nos pregões de
        `meta.secondary_window`. **Leia sempre contra `sessions`** — enquanto a
        janela é curta, o null é dominado por ela e não mede a liquidez do
        papel. Que o COE seja feito para ser carregado até o vencimento, sem
        mercado de saída organizado, é propriedade do DESENHO do produto e está
        no DIE, não uma conclusão que este agregado sustente hoje.
        `tradedOnly=true` isola quem teve negócio na janela; não é um filtro de
        "já girou alguma vez na vida".


        Negócios instrumento a instrumento, por pregão, ficam em
        `/v1/credit/otc` com `family=COE`: lá é o fluxo, aqui é o catálogo.
