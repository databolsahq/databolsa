        - in: query
          name: minNetWorth
          schema:
            type: number
            description: Patrimônio líquido mínimo, em BRL.
      summary: "Classes de FIDC por competência: patrimônio, carteira e inadimplência"
      description: >-
        Fundos de direitos creditórios do informe mensal da CVM. O FIDC tem
        superfície própria e não aparece nas séries de `/funds` porque sua cota
        é marcada a **laudo** e não passa pelo informe diário — servi-lo por lá
        devolveria fundo sem série.


        A chave é a **classe**, não o fundo: um fundo multiclasse tem um CNPJ
        por classe, e as classes têm prioridades diferentes. `entity_kind` vem
        null nas competências anteriores a 2020-11, quando a fonte publicava o
        CNPJ do fundo e o grão era outro — é o marcador da era, não uma lacuna.


        As duas séries de inadimplência **não se somam**: em `*_with_risk` o
        cedente responde pelo crédito, em `*_no_risk` o fundo carrega a perda.
        `impaired_ratio` é fração da **carteira** (não do patrimônio) e vem null
        quando o inadimplente declarado excede a carteira — nesse caso
        `impaired_exceeds_portfolio` é true e os componentes brutos continuam na
        resposta.


        Sem `date`, serve a competência mais recente com dado.
