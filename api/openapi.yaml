            description: Corte temporal (AAAA-MM-DD). Sem `at`, usa o acervo histórico.
              Conforme o `shape` de `listObjectRelations`, `event` acumula até a
              data, `snapshot` escolhe o retrato aplicável e `static` pode ser
              recusada por não afirmar vigência passada.
          required: false
        - in: query
          name: order
          schema:
            type: string
            enum:
              - name
              - a_count
              - b_count
              - total
            default: name
            description: "`name` é alfabética. `a_count`, `b_count` e `total` ordenam pelo
              número de contrapartes distintas; em `union` e `difference` só
              `a_count` se aplica."
          required: false
        - in: query
          name: op
          schema:
            type: string
            enum:
              - intersect
              - union
              - difference
            default: intersect
            description: "`intersect` = nos dois; `union` = em qualquer um; `difference` =
              em A e não em B."
          required: false
      summary: Combina conjuntos definidos por duas relações
      description: Aplica `intersect`, `union` ou `difference` a conjuntos definidos
        por duas relações. `a_to_id` e `b_to_id` prendem a contraparte e
        permitem comparar dois objetos concretos. Use `total=true` e leia
        `meta.total` para obter o tamanho sem paginar.
      x-capability: object-context
      x-lifecycle: object-native
