    DocumentEntityType:
      type: string
      enum:
        - stock
        - fii
        - fiagro
        - issuer
        - securitization
        - fidc
      description: stock = companhia com ação negociada · fii = fundo imobiliário ·
        fiagro = fundo das cadeias produtivas agroindustriais · issuer =
        companhia registrada apenas para emitir dívida (não tem ticker) ·
        securitization = certificado CRI/CRA/OTS, identificado pelo ISIN · fidc
        = fundo de direitos creditórios.
    DocumentVersion:
      description: "Posição deste documento na fila dos seus semelhantes, ou o motivo
        de não haver fila. Leia antes de citar: a fila mistura `base` e
        `amendment`, e o texto em vigor é o último base mais as alterações
        protocoladas depois dele. `is_current: true` só vale para o base em
        vigor sem emendas posteriores; nos demais casos, leia `current_base` e
        `amendments_after`. Nunca é omitido: sem fila, vem o objeto de motivo."
      oneOf:
        - type: object
          title: Posição na fila
          properties:
            key:
              type: string
              description: 'O que identificou "a mesma coisa": `cnpj:<emissor>` quando a
                família é chaveada pelo emissor (regulamento, estatuto),
                `asset:<instrumento>` quando é pelo instrumento (termo de
                securitização, escritura).'
            family:
              type: string
              description: A fila de que este documento participa. Documentos da mesma família
                e da mesma chave formam UMA linha do tempo, ainda que venham de
                categorias diferentes da fonte.
            role:
              type: string
              description: "`base` restabelece o texto inteiro e aposenta o base anterior com
                as emendas dele; `amendment` altera o base em vigor e só contém
                o que mudou."
            index:
              type: integer
              minimum: 1
              description: Posição por data de protocolo na fila INTEIRA, base e emendas
                juntas. 1 = o mais antigo.
            total:
              type: integer
              minimum: 1
              description: Quantos documentos há na fila, incluindo os sem data.
            is_current:
              type:
                - boolean
                - "null"
              description: "`true` quando este documento, sozinho, é o texto em vigor: o
                último `base` sem emenda posterior. `false` quando foi
                substituído, quando há emendas depois dele (`amendments_after`)
                ou quando é uma emenda. `null` quando há documento sem data na
                fila ou nenhum `base` a que somar as emendas."
            current_base:
              type:
                - string
                - "null"
              description: Protocolo do `base` em vigor — o documento a que as emendas de
                `amendments_after` se somam. Nulo quando a fila não tem base
                nenhum.
            amendments_after:
              type: array
              items:
                type: string
              description: 'Protocolos que alteram `current_base`, do mais antigo ao mais
                recente. Lista vazia é medição, não omissão: o base em vigor não
                recebeu emenda. É este campo que separa "leia este documento" de
                "leia este documento MAIS estes três".'
            is_latest_in_chain:
              type: boolean
              description: Este é o último elo datado da fila. Afirmação do servidor, para não
                obrigar a derivá-la de `next_in_chain == null` com `index ==
                total`. Falso quando há documento sem data, porque aí não há
                último.
            undated:
              type: integer
              minimum: 0
              description: Documentos da fila sem data de protocolo, excluídos da ordenação
                para não decidir o vigente por posição arbitrária.
            unindexed:
              type: integer
              minimum: 0
              description: 'Documentos da fila que EXISTEM no acervo e ainda não foram lidos:
                contam para a ordem e para a vigência, mas `readDocument` ainda
                não os recupera. "Não existe" e "existe e ainda não foi
                processado" são a mesma ausência com significados opostos.'
            previous:
              type:
                - string
                - "null"
              description: Protocolo do imediatamente anterior na fila, seja base ou emenda.
            next_in_chain:
              type:
                - string
                - "null"
              description: Protocolo do imediatamente posterior na fila, seja base ou emenda.
            superseded_by:
              type:
                - string
                - "null"
              description: O `base` seguinte, que aposentou este. Nulo em emendas, que se
                somam em vez de revogar; para caminhar na cadeia use
                `next_in_chain`.
            amends:
              type:
                - string
                - "null"
              description: 'Para `role: "amendment"`, o `base` que ele altera — o último base
                anterior a ele.'
            shape:
              type: string
              description: "A forma temporal declarada da categoria/tipo deste documento.
                Texto livre de propósito: forma nova não deve virar erro de
                validação numa rota de leitura."
          required:
            - key
            - family
            - role
            - index
            - total
            - is_current
            - current_base
            - amendments_after
            - is_latest_in_chain
            - undated
            - unindexed
            - previous
            - next_in_chain
            - superseded_by
            - amends
            - shape
          additionalProperties: false
        - type: object
          title: Sem fila, com motivo
          properties:
            reason:
              type: string
              enum:
                - shape_has_no_versions
                - missing_key
                - missing_date
                - not_implemented
              description: "`shape_has_no_versions`: a categoria é `event` ou não declara
                forma. `missing_key`: falta o identificador do grupo (o
                instrumento, numa família chaveada por instrumento).
                `missing_date`: o documento não tem data de protocolo.
                `not_implemented`: a forma é `periodic` e a fila por competência
                ainda não é calculada, ou a categoria declara forma sem família
                de versão."
            detail:
              type: string
              description: O motivo em uma frase, com o campo que falta nomeado.
          required:
            - reason
            - detail
          additionalProperties: false
        - type: "null"
    DocumentCitation:
      type: object
      properties:
        ticker:
          type:
            - string
            - "null"
          description: Null para documento de crédito — use asset_code/issuer_cnpj.
