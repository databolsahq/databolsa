      description: "Negócios consolidados por pregão desde 2013: PU
        mínimo/médio/máximo, número de negócios e preço como % do PU teórico na
        curva (>100 = ágio). Mais recente primeiro."
  /v1/credit/debentures/{code}/holders:
    get:
      responses:
        "200":
          description: Página de fundos detentores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DebentureHolder"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      code:
                        type: string
                      comptc_date:
                        type:
                          - string
                          - "null"
                      funds_panel_n:
                        type:
                          - number
                          - "null"
                    required:
                      - next_cursor
                      - count
                      - code
                      - comptc_date
                      - funds_panel_n
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listDebentureHolders
      tags:
        - Credit
      parameters:
        - in: path
          name: code
          schema:
            type: string
            minLength: 3
            description: "Código de negociação da debênture, ex.: CPTM11, VALE29."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (YYYY-MM-DD, fim de mês). Default: a mais
              recente divulgada."
      summary: Fundos que detêm a debênture (look-through da carteira mensal)
      description: "Lista os fundos com posição no papel na carteira mensal mais
        recente divulgada, ordenados por valor de posição; `date` (YYYY-MM-DD,
        fim de mês) consulta uma competência histórica.
        `buy_value_brl`/`sell_value_brl` são compras e vendas declaradas pelo
        próprio fundo NO mês da competência. `meta.funds_panel_n` = total de
        fundos divulgando qualquer debênture na competência: o universo de
        divulgação encolhe muito fora dos meses de fechamento de trimestre,
        então nunca compare a lista de fundos entre competências sem olhar esse
        denominador."
  /v1/credit/debentures/{code}/demand:
    get:
      responses:
        "200":
          description: Série mensal de demanda
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DebentureDemandPoint"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      code:
                        type: string
                    required:
                      - next_cursor
                      - count
                      - code
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listDebentureDemand
      tags:
        - Credit
      parameters:
        - in: path
          name: code
          schema:
            type: string
            minLength: 3
            description: "Código de negociação da debênture, ex.: CPTM11, VALE29."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      summary: Demanda institucional pela debênture, mês a mês
      description: "Série mensal da demanda de fundos pelo papel: nº de fundos
        detentores, quantidade e valor somados, e o fluxo declarado do mês
        (`net_traded_brl` = compras − vendas informadas pelos próprios fundos).
        CAVEAT essencial: o painel de fundos que divulga carteira muda de
        tamanho todo mês (`funds_panel_n` — meses de fim de trimestre têm quase
        o dobro de divulgantes), então queda de `funds_value_brl` entre meses
        geralmente mede queda de DIVULGAÇÃO, não venda. Para fluxo real use
        `net_traded_brl`, nunca a diferença de posição entre meses. Mais recente
        primeiro."
  /v1/credit/otc:
    get:
      responses:
        "200":
          description: Página de negócios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditOtcQuote"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listOtcQuotes
      tags:
        - Credit
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          required: false
        - in: query
          name: family
          schema:
            type: string
            minLength: 2
            description: "Família do instrumento: CDB, CCB, CRI, CRA, LCI, LCA, LF, LIG, NC,
              COE…"
          required: true
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Pregão exato (default: o mais recente com negócios)."
          required: false
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
      summary: Secundário de balcão por instrumento (CDB, CRI, CRA, LCI, LCA…)
      description: >-
        Negócios consolidados de renda fixa privada de balcão, instrumento a
        instrumento. Sem recorte temporal, responde o pregão mais recente da
        família; só entra linha com evidência de negócio (quantidade, número de
        negócios ou volume financeiro).


        CAVEAT de divulgação: em CCB, LCA, LCI, CCI, CCCB, CDAWA e LC a B3 OMITE
        o tamanho e publica apenas preços e volume financeiro. Nessas famílias
        `quantity` e `trade_count` vêm `null` — é sigilo de quantidade, não
        ausência de negócio, e nunca 0. Para dimensionar o giro use
        `volume_brl`, que é real; a quantidade implícita é `volume_brl /
        price_avg`.


        **A profundidade desta série é a do próprio balcão na nossa cobertura, e
        ainda é curta fora de debênture** (debênture tem fonte própria e
        histórico longo em `/v1/credit/debentures/{code}/quotes`). Ausência de
        um papel aqui é ausência nos pregões cobertos, não prova de que ele
        nunca negociou. `listCoes` publica a janela medida em
        `meta.secondary_window`.


        `family=COE` devolve os NEGÓCIOS de COE, não o catálogo. O cadastro
        (emissor, tamanho da emissão, vencimento, secundário agregado na janela
        coberta) fica em `/v1/structured/coe` — COE tem superfície própria
        porque não é renda fixa nem crédito puro: é payoff de derivativo sobre o
        risco do banco emissor.
