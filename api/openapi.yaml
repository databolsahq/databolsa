          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Quem é o passivo da classe, por tipo de cotista e senioridade
      description: >-
        De quem é o dinheiro que está dentro do fundo. Quem corre primeiro numa
        crise não é o mesmo em todo FIDC: uma sênior de fundo de pensão e RPPS
        tem passivo estável por mandato, uma de pessoa física reage a manchete.
        O informe já dava o total de cotistas; esta rota diz de quem são.


        `pct_of_seniority` usa como denominador o total da **própria
        senioridade**, não o da classe. O motivo é da fonte: mezanino não tem
        coluna nesta tabela, então um percentual sobre o total da classe não
        fecharia em 100 e ninguém saberia por quê.


        `is_institutional` é **classificação nossa, não da fonte**, e por isso
        viaja ao lado de `investor_type` em vez de substituí-lo. Agrupa quem tem
        mandato e prazo (previdência aberta e fechada, RPPS, seguradora,
        capitalização, banco). Fundo e corretora ficam de fora de propósito: são
        veículos de passagem e por trás deles pode haver varejo — contá-los
        inventaria uma estabilidade que não se sabe existir.


        A série **começa em 2019-11**, a mesma virada de formulário que separou
        os blocos de cedente. Antes disso o informe não abria o cotista por
        tipo, e a ausência marca a era, não é lacuna de coleta.
