          name: tipo_ativo
          schema:
            type: string
            description: Grafia AS-FILED da fonte, casada sem acento e sem caixa. Não
              expande para as grafias irmãs do mesmo instrumento — para o
              conjunto completo use `instrumento`. Aceita também um valor de
              `instrumento`/`familia`, e nesse caso filtra pela coluna canônica.
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Recorta por `data_referencia`, a mesma coluna da ordenação default.
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Recorta por `data_referencia`, a mesma coluna da ordenação default.
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - data_referencia
              - data_registro
              - data_processo
              - data_encerramento
              - valor_total
            default: data_registro
            description: "Campo de ordenação. `data_registro` e `data_referencia` são
              sinônimos e ordenam por data_referencia (data_registro >
              data_inicio > data_processo): o acervo ICVM 476 não tem data de
              registro, e ordenar pela coluna crua o empurrava todo para o fim."
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
            description: asc ou desc (default desc).
        - in: query
          name: fields
          schema:
            type: string
            description: "Projeção: lista de campos separada por vírgula (ex.:
              `instrumento,valor_total,data_referencia`). `offering_id` sempre
              incluído. Sem o parâmetro, a resposta traz todos os 29 campos."
      summary: Ofertas públicas no mercado primário
      description: Retorna ofertas CVM por série, com filtros de emissor, regime,
        instrumento e período. Use `data_referencia` para séries históricas;
        esforços restritos antigos podem não ter data de registro ou processo.
        `valor_total` é registrado, não necessariamente colocado. Exclua
        `value_is_sentinel` e `value_pre_real_currency` antes de somar valores.
      x-capability: market-data
      x-lifecycle: default
