            description: "Como interpretar o `id`: `auto` segue fusões e, em cisões,
              responde 409 com os sucessores; `exact` lê literalmente o objeto
              desse id. Use `exact` para acessar o ramo de uma cisão que
              preservou o identificador original ou para desativar o
              redirecionamento automático."
          required: false
      summary: Descobre como dois objetos se conectam
      description: Descobre cadeias entre dois objetos; use `traverseObjectPath`
        quando a cadeia já for conhecida. Agrupa resultados por cadeia, traz
        intermediários em `examples` e conta sequências distintas em
        `path_count`, sem duplicar fontes. Cadeias curtas vêm primeiro. O padrão
        é dois saltos; o terceiro é mais caro.
