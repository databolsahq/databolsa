        - in: query
          name: thread
          schema:
            type: string
            description: "Slug da thread (ex.: 'mp-1376')."
      summary: Eventos de mercado (ledger point-in-time)
      description: "O que foi relevante em cada dia: eventos estruturais (decisão do
        Copom, medida provisória, tarifa, geopolítica), setoriais e
        corporativos, detectados por ato oficial, cobertura de imprensa
        multi-fonte e anomalia de preço. Cada evento carrega as fontes
        (source_refs) e os canais de transmissão a preço. Histórico profundo via
        backfill de fontes oficiais. NÃO são eventos societários (para
        grupamentos/bonificações use listCorporateEvents) nem a agenda de
        resultados."
  /v1/events/anomalies:
    get:
      responses:
        "200":
          description: Página de dias anômalos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMarketAnomaly"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listMarketAnomalies
      tags:
        - Events
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: series
          schema:
            type: string
            enum:
              - IBOV
              - IFIX
              - USDBRL
              - BRENT
              - VIX
              - SP500
              - NASDAQ
        - in: query
          name: min_z
          schema:
            type: number
            minimum: 3
            maximum: 20
            default: 4
            description: Corte de |z-score| (default 4).
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      summary: Dias anômalos de mercado (z-score) e o evento que os explica
      description: >-
        Dias em que uma série acompanhada (IBOV, IFIX, dólar, brent, VIX, S&P
        500, Nasdaq) se moveu N desvios-padrão além do regime dos 252 pregões
        anteriores (histórico desde 1968), com o evento explicador quando
        casado. Um dia anômalo sem explicação é lacuna de cobertura do ledger,
        não ausência de causa.


        Para IBOV e IFIX a anomalia é medida sobre o DESCOLAMENTO LOCAL
        (`local_zscore`), não sobre o retorno bruto: descontado o que Nasdaq e
        dólar explicam, sobra o movimento próprio do mercado brasileiro. Isso
        separa 'o mundo caiu' de 'o Brasil caiu' — um IBOV que cai 5% num dia de
        queda global de 5% não é evento brasileiro, e um que cai 3% enquanto o
        mundo sobe 5% é. O `min_z` corta pelo z efetivo (local quando existe,
        bruto caso contrário), que é o mesmo critério do detector. Séries
        globais e o período anterior a 2000 (sem os fatores disponíveis) seguem
        medidos pelo bruto, com `factor_model` nulo.
