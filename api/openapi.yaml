              as referências (mistura anos); informe um ano para uma série
              limpa."
          required: false
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
      summary: Expectativas Focus (consenso por indicador)
      description: Consenso do Boletim Focus (BCB) para ipca, selic, pib ou cambio.
        Informe `reference` (ano) para uma série limpa; sem ele, mistura todos
        os anos de referência. As pesquisas vêm em `data` (o campo `surveys` da
        raiz não existe mais); indicador, referência e realizado em `meta`.
