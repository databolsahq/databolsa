                $ref: "#/components/schemas/Problem"
      operationId: findObjectPaths
      tags:
        - Objects
      parameters:
        - in: query
          name: from_id
          schema:
            type: string
            description: Objeto de origem (pub_…).
          required: true
        - in: query
          name: to_id
          schema:
            type: string
            description: Objeto de destino (pub_…).
          required: true
        - in: query
          name: max_hops
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 2
            description: Comprimento máximo da cadeia (1–3, default 2). O terceiro salto
              custa segundos.
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
            description: Cadeias distintas a devolver (1–25, default 10).
          required: false
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Aplica a data a cada salto. Sem ela, a ligação pode ser histórica.
              Relações `static` são excluídas de buscas passadas e informadas em
              `meta.excluded_shapes`. Corte temporal (AAAA-MM-DD). Sem `at`, usa
              o acervo histórico. Conforme o `shape` de `listObjectRelations`,
              `event` acumula até a data, `snapshot` escolhe o retrato aplicável
              e `static` pode ser recusada por não afirmar vigência passada.
