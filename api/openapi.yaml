                          mais de um: em retrato pode ter recuado; em evento é o
                          teto do corte."
                      excluded_shapes:
                        type: array
                        items:
                          type: string
                          enum:
                            - event
                            - snapshot
                            - static
                            - interval
                          description: "`event`: aconteceu numa data e se acumula (emissão, sucessão); a
                            contagem é o total. `snapshot`: retrato por
                            competência que substitui o anterior (carteira de
                            fundo, de índice); a contagem é o último retrato.
                            `static`: o registro publica só o vigente (gestor,
                            custodiante, auditor, sócio). `interval`: a fonte
                            declara começo e fim (registro na CVM, distribuição
                            de oferta); `valid_to` nulo é aberto."
                        description: Formas removidas do conjunto pela data. `static` sai quando `at` é
                          passado e a consulta não prende um verbo, porque o
                          registro só publica o vigente.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listGlobalLinks
      tags:
        - Objects
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor opaco de `meta.next_cursor` da página anterior; omita na
              primeira página.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: Itens por página (1–1000, default 100).
        - in: query
          name: total
          schema:
            type: string
            description: true = inclui `meta.total` (contagem do universo filtrado). Custa
              uma consulta a mais.
        - in: query
          name: rel
          schema:
            type: string
            enum:
              - issued
              - distributes
              - tokenized_as
              - registered_as
              - assigned_to
              - owes_under
              - holds
              - manages
              - administers
              - custodies
              - audits
              - same_owner
              - shareholder_of
              - indexed_to
              - rates
              - mentions
              - measures
              - forecasts
              - contains
              - member_of
              - exposed_to_issuer
              - succeeded_by
              - produces
              - covers
              - coordinates
              - offers
              - exposed_to_sector
              - regulated_by
              - amends
              - revokes
            description: Verbo da relação; `from` é quem pratica a ação e `to` quem a
              recebe. `measures` liga uma série ao conceito observado;
              `forecasts`, ao conceito projetado. `manages` identifica o gestor
              e `administers` o administrador fiduciário. Consulte
              `listObjectRelations` para forma temporal, tipos de origem e
              destino e semântica de `magnitude` de cada verbo.
        - in: query
          name: from_kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo do objeto que pratica o verbo.
        - in: query
          name: to_kind
          schema:
            type: string
            enum:
              - company
              - equity_security
              - fund
              - service_provider
              - instrument
              - index
              - crypto_asset
              - commodity
              - country
              - indicator
              - data_series
              - offering
              - fund_share_class
              - market_event
              - role
              - sector
              - securitization
              - norm
            description: Tipo do objeto que recebe o verbo.
        - in: query
          name: from_subkind
          schema:
            type: string
            description: Subtipo na origem (`fidc` em vez de `fund`).
        - in: query
          name: to_subkind
          schema:
            type: string
            description: Subtipo no destino.
        - in: query
          name: from_id
          schema:
            type: string
            description: Prende a origem a um objeto (`pub_…`).
        - in: query
          name: to_id
          schema:
            type: string
            description: Prende o destino a um objeto (`pub_…`).
        - in: query
          name: at
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Corte temporal (AAAA-MM-DD). Sem `at`, usa o acervo histórico.
              Conforme o `shape` de `listObjectRelations`, `event` acumula até a
              data, `snapshot` escolhe o retrato aplicável e `static` pode ser
              recusada por não afirmar vigência passada.
      summary: Lista relações do grafo inteiro
      description: Pagina as relações de um verbo sem partir de um objeto,
        opcionalmente presas a um lado (`from_id`, `to_id`) ou a tipos
        (`from_kind`, `to_kind`). Para contagens e extremos, use
        `getObjectLinkStats`.
