  /v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Documentos
      x-capability: documents
      summary: Busca semântica em documentos
      description: Encontra trechos semanticamente próximos em documentos CVM/B3. Use
        `getDocumentTaxonomy` para descobrir facetas e `readDocument` para
        leitura completa. Em crédito, diferencie emissor (`issuer_cnpj`), papel
        (`asset_code`) e família. `score` mede proximidade, não confiança
        factual; preserve protocolo, fonte, página, `reference_date` (período
        coberto) e `filed_at` (publicação). Ausência de hit não prova ausência
        do fato. Para o documento mais recente, filtre por data em vez de
        depender do ranking.
      parameters:
        - name: q
          in: query
          required: true
          description: Termo/pergunta em linguagem natural.
          schema:
            type: string
            minLength: 1
        - name: tickers
          in: query
          required: false
          description: "Filtra por papéis, ex.: PETR4,PRIO3."
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        - name: category
          in: query
          required: false
          description: Categoria bruta, sensível ao rótulo exato da fonte. Descubra em
            getDocumentTaxonomy; prefira document_kind quando possível.
          schema:
            type: string
            minLength: 1
        - name: document_kind
          in: query
          required: false
          description: "Taxonomia estável do DataBolsa. Para crédito: debt_instrument
            reúne escrituras, termos de securitização e aditamentos;
            governing_document reúne regulamentos/documentos constitutivos."
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: entity_type
          in: query
          required: false
          description: "Que tipo de entidade o documento descreve. `issuer` é a companhia
            registrada apenas para emitir dívida (concessionária, SPE): publica
            demonstrações e documentos, e não tem ticker. `securitization` é o
            certificado (CRI/CRA/OTS), identificado pelo ISIN e não pela
            securitizadora."
          schema:
            $ref: "#/components/schemas/DocumentEntityType"
        - name: issuer_cnpj
          in: query
          required: false
          description: CNPJ do emissor (14 dígitos; pontuação é aceita e ignorada). É a
            chave de entidade para documentos de crédito, que não têm ticker.
          schema:
            type: string
            minLength: 14
        - name: asset_code
          in: query
          required: false
          description: "Identificador do papel: ISIN, código ANBIMA da debênture ou código
            de instrumento da B3 — qualquer um dos que a emissão carrega."
          schema:
            type: string
            minLength: 3
        - name: asset_family
          in: query
          required: false
          description: Família do papel; eixo independente de entity_type.
          schema:
            type: string
            enum:
              - DEB
              - CRI
              - CRA
              - OTS
              - FIDC
              - FIAGRO
        - name: year
          in: query
          required: false
          description: Ano de referência do documento (AAAA).
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: filed_before
          in: query
          required: false
          description: Inclui apenas documentos protocolados até a data. Exclui itens sem
            `filed_at` conhecido e sinaliza isso em `warnings`; não confundir
            com o período de referência.
          schema:
            type: string
            format: date
        - name: filed_after
          in: query
          required: false
          description: Só documentos protocolados (filed_at) a partir desta data.
            Documentos sem data de publicação são excluídos.
          schema:
            type: string
            format: date
        - name: protocol
          in: query
          required: false
          description: Restringe a UM documento exato (protocolo CVM/FNET) — busca dentro
            do documento.
          schema:
            type: string
            minLength: 1
        - name: reference_date
          in: query
          required: false
          description: "Período de referência exato do documento (ex.: 2022-06-30 = 2T22)."
          schema:
            type: string
            format: date
        - name: reference_from
          in: query
          required: false
          description: Início do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: reference_to
          in: query
          required: false
          description: Fim do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: doc_type
          in: query
          required: false
          description: "Subtipo bruto, sensível ao rótulo exato da fonte (ex.: Relatório
            de Agência de Rating). Descubra em getDocumentTaxonomy."
          schema:
            type: string
            minLength: 1
        - name: tables_only
          in: query
          required: false
          description: Restringe a trechos de tabela (fatos numéricos).
          schema:
            type: boolean
        - name: financial_only
          in: query
          required: false
          description: Restringe a emissores financeiros quando true; false restringe aos
            demais.
          schema:
            type: boolean
        - name: include_context
          in: query
          required: false
          description: false remove o bloco duplicado meta.context e reduz tokens;
            data[].text/text_expanded e citation continuam completos. Em
            clientes MCP, prefira false salvo quando precisar de contexto pronto
            para colar em outro prompt.
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          required: false
          description: Máximo de trechos (1–25, default 8).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 8
      responses:
        "200":
          description: Trechos relevantes + bloco de contexto com citação.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "429":
          description: Limite diário de requisições do plano atingido.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-lifecycle: default
