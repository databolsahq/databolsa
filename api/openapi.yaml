          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listFidcOriginators
      tags:
        - Credit
      parameters:
        - in: path
          name: cnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ completo do emissor, 14 dígitos sem pontuação.
          required: true
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Cedentes declarados da classe — quem vende o recebível para o fundo
      description: >-
        Quem ORIGINOU os direitos creditórios que o fundo comprou. É a ponte
        entre o FIDC e o risco de verdade: o fundo é registrado, publica informe
        e tem auditor, mas quem vende os recebíveis para ele costuma ser empresa
        fechada — sem ação, sem balanço público e sem rating. O informe obriga a
        declarar o documento dos maiores cedentes, e é o único lugar em que
        esses CNPJs aparecem de graça.


        **As duas listas não se somam.** `origin_block` separa os cedentes com
        risco de recompra (`with_risk`, o cedente responde pelo crédito) dos sem
        risco (`no_risk`, o fundo carrega a perda), e **o mesmo cedente aparece
        nos dois blocos** — somá-los o conta duas vezes, a mesma armadilha das
        duas séries de inadimplência. O terceiro bloco, `legacy`, é a lista
        ÚNICA que a fonte publicava até 2019-10, antes de separar risco de
        recompra: `risk_retained` vem null nele porque ele não é nenhum dos
        dois, e atribuí-lo a um lado inventaria uma distinção que a fonte não
        fazia.


        `document_kind` é o campo a ler antes de qualquer conclusão. `invalido`
        é a MAIORIA das declarações e não é lixo: são os placeholders de "não
        divulgado" da própria fonte. Eles ficam na resposta porque é deles que
        sai `undisclosed_share_pct` — **quanto da carteira vem de cedente que a
        classe não identificou**, que é a leitura de concentração que não existe
        em nenhuma outra superfície. `cpf` marca cedente pessoa física e o
        documento **não viaja**: as fontes federais de enriquecimento publicam
        CPF mascarado, então não há o que cruzar, e carregar a PII adiante só
        criaria exposição.


        `share_pct` é as-filed, em percentual (35,2 = 35,2%). Uma parcela em
        3,8% das declarações cai fora de [0, 100] — quem preencheu reais no
        campo de percentual — e essas passam com `share_pct_implausible`
        marcado, em vez de corrigidas. `declared_share_total_implausible` marca
        o caso análogo no total do bloco.


        Para a pergunta inversa — em quais classes um cedente aparece — use
        `/credit/originators/{cnpj}`.
