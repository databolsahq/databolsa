    get:
      operationId: listPortfolios
      tags:
        - Carteira
      summary: Suas carteiras
      description: Lista as carteiras do dono da chave (id, nome, nº de linhas de
        ativo no ledger, flag de simulação). Use o `id` nas demais operações de
        carteira.
      responses:
        "200":
          description: Carteiras da conta.
          content:
            application/json:
              schema:
