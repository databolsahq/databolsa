              schema:
                $ref: "#/components/schemas/Problem"
      operationId: listFidcs
      tags:
        - Credit
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            description: Cursor opaco de `meta.next_cursor` da página anterior; omita na
              primeira página.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: Itens por página (1–1000, default 100).
        - in: query
          name: q
          schema:
            type: string
            description: Busca pela denominação social da classe.
        - in: query
          name: cnpj
          schema:
            type: string
            pattern: ^\d{14}$
            description: CNPJ da CLASSE (14 dígitos).
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: "Competência exata (fim de mês). Default: a mais recente."
        - in: query
          name: minNetWorth
          schema:
            type: number
            description: Patrimônio líquido mínimo, em BRL.
      summary: "Classes de FIDC por competência: patrimônio, carteira e inadimplência"
      description: >-
        Fundos de direitos creditórios do informe mensal da CVM. O FIDC tem
        superfície própria e não aparece nas séries de `/funds` porque sua cota
        é marcada a **laudo** e não passa pelo informe diário — servi-lo por lá
        devolveria fundo sem série.


        A chave é a **classe**, não o fundo: um fundo multiclasse tem um CNPJ
        por classe, e as classes têm prioridades diferentes. `entity_kind` vem
        null nas competências anteriores a 2020-11, quando a fonte publicava o
        CNPJ do fundo e o grão era outro — é o marcador da era, não uma lacuna.


        As duas séries de inadimplência **não se somam**: em `*_with_risk` o
        cedente responde pelo crédito, em `*_no_risk` o fundo carrega a perda.
        `impaired_ratio` é fração da **carteira** (não do patrimônio) e vem null
        quando o inadimplente declarado excede a carteira — nesse caso
        `impaired_exceeds_portfolio` é true e os componentes brutos continuam na
        resposta. `overdue_*` (vencido e não pago) e `impaired_*` (reconhecido
        como inadimplente) também são rubricas distintas e nunca substituem uma
        à outra.


        Um FIDC feeder pode declarar recebíveis diretos e inadimplência iguais a
        zero porque carrega cotas de outros FIDCs. Isso significa risco em outra
        camada, não ausência de risco; `/funds/:cnpj/holdings` e
        `/funds/:cnpj/invested-funds` cobrem fundos ordinários e podem vir
        vazios nesse caso.


        Sem `date`, serve a competência mais recente com dado.


        **Os filtros daqui são de CADASTRO e tamanho** (`cnpj`, `q`,
        `minNetWorth`). Para cortar por uma MEDIDA — grande E inadimplente,
        inadimplência acima de um limiar, os N maiores de um recorte — use
        `rankObjects` / `aggregateObjects` com `where`: é uma chamada, contra
        paginar as 4.208 classes e calcular do lado de fora. Atenção à escala ao
        compor: `impaired_ratio` é FRAÇÃO (0,05 = 5%) e `top_originator_pct` é
        PERCENTUAL (35,2 = 35,2%).
      x-capability: credit-market-data
      x-lifecycle: default
