                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      total:
                        type: integer
                        description: Linhas do import que casam o filtro, antes do recorte da página.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolios/{id}/reconcile:
    post:
      operationId: reconcilePortfolioAsset
      tags:
        - Carteira
      summary: Reconciliar posição à B3
      description: "AJUSTA a posição calculada de um ativo à quantidade declarada pela
        B3 (`target_qty` na data `as_of`), inserindo um ajuste idempotente —
        útil quando um evento (ex.: subscrição) não veio no extrato. Confirme a
        quantidade com o usuário antes de chamar."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
                - target_qty
                - as_of
              properties:
                asset_type:
                  type: string
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: Ticker.
                target_qty:
                  type: number
                  description: Quantidade declarada pela B3 (>= 0).
                as_of:
                  type: string
                  description: Data de referência (AAAA-MM-DD).
      responses:
        "200":
          description: Resultado do ajuste (delta aplicado).
          content:
            application/json:
              schema:
                type: object
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/suitability:
    get:
      operationId: getSuitability
      tags:
        - Carteira
      summary: Seu perfil de investidor
      description: "Retorna o perfil de investidor (suitability) do dono da chave:
        nível (Conservador/Moderado/Arrojado), a posição na régua 0–100 (não é
        uma nota) e as respostas do questionário. `profile` é nulo se o usuário
        ainda não definiu o perfil."
      responses:
        "200":
          description: Perfil de investidor do usuário (ou nulo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuitabilityEnvelope"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Documentos
      summary: Busca semântica em documentos
      description: Busca semântica no TEXTO de documentos CVM/B3 (fatos relevantes,
        releases de resultado, balanços, relatórios gerenciais de FII, atas de
        assembleia). Ideal para perguntas qualitativas que os dados estruturados
        não respondem. Filtre por papel, categoria e ano quando souber.
      parameters:
        - name: q
          in: query
          required: true
          description: Termo/pergunta em linguagem natural.
          schema:
            type: string
            minLength: 1
        - name: tickers
          in: query
          required: false
          description: "Filtra por papéis, ex.: PETR4,PRIO3."
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        - name: category
          in: query
          required: false
          description: Categoria bruta da fonte. Consulte /v1/documents/taxonomy para
            valores disponíveis.
          schema:
            type: string
            minLength: 1
        - name: document_kind
          in: query
          required: false
          description: Taxonomia estável do DataBolsa.
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: entity_type
          in: query
          required: false
          description: "Que tipo de entidade o documento descreve. `issuer` é a companhia
            registrada apenas para emitir dívida (concessionária, SPE): publica
            demonstrações e documentos, e não tem ticker. `securitization` é o
            certificado (CRI/CRA/OTS), identificado pelo ISIN e não pela
            securitizadora."
          schema:
            $ref: "#/components/schemas/DocumentEntityType"
        - name: issuer_cnpj
          in: query
          required: false
          description: CNPJ do emissor (14 dígitos; pontuação é aceita e ignorada). É a
            chave de entidade para documentos de crédito, que não têm ticker.
          schema:
            type: string
            minLength: 14
        - name: asset_code
          in: query
          required: false
          description: "Identificador do papel: ISIN, código ANBIMA da debênture ou código
            de instrumento da B3 — qualquer um dos que a emissão carrega."
          schema:
            type: string
            minLength: 3
        - name: asset_family
          in: query
          required: false
          description: Família do papel; eixo independente de entity_type.
          schema:
            type: string
            enum:
              - DEB
              - CRI
              - CRA
              - OTS
              - FIDC
        - name: year
          in: query
          required: false
          description: Ano de referência do documento (AAAA).
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: filed_before
          in: query
          required: false
          description: "Corte point-in-time: só documentos PROTOCOLADOS (filed_at) até
            esta data — o que estava publicamente disponível na data, não o
            período de referência. Documentos sem data de publicação conhecida
            são EXCLUÍDOS (a exclusão é sinalizada em warnings). A cobertura de
            filed_at do acervo histórico está em backfill; documentos ainda não
            cobertos ficam fora do corte em vez de aparecer com data inferida."
          schema:
            type: string
            format: date
        - name: filed_after
          in: query
          required: false
          description: Só documentos protocolados (filed_at) a partir desta data.
            Documentos sem data de publicação são excluídos.
          schema:
            type: string
            format: date
        - name: protocol
          in: query
          required: false
          description: Restringe a UM documento exato (protocolo CVM/FNET) — busca dentro
            do documento.
          schema:
            type: string
            minLength: 1
        - name: reference_date
          in: query
          required: false
          description: "Período de referência exato do documento (ex.: 2022-06-30 = 2T22)."
          schema:
            type: string
            format: date
        - name: reference_from
          in: query
          required: false
          description: Início do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: reference_to
          in: query
          required: false
          description: Fim do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: doc_type
          in: query
          required: false
          description: "Subtipo bruto da fonte (ex.: Press-release). Consulte
            /v1/documents/taxonomy."
          schema:
            type: string
            minLength: 1
        - name: tables_only
          in: query
          required: false
          description: Restringe a trechos de tabela (fatos numéricos).
          schema:
            type: boolean
        - name: financial_only
          in: query
          required: false
          description: Restringe a emissores financeiros quando true; false restringe aos
            demais.
          schema:
            type: boolean
        - name: include_context
          in: query
          required: false
          description: false devolve `meta.context` vazio e reduz tokens; os trechos em
            `data` e suas citações continuam presentes.
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          required: false
          description: Máximo de trechos (1–25, default 8).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 8
      responses:
        "200":
          description: Trechos relevantes + bloco de contexto com citação.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "429":
          description: Limite diário de requisições do plano atingido.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
