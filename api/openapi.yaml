        abriu por setor. Sem ele, um mix parcial passaria por completo, e a
        classe que não declara nada devolveria lista vazia — indistinguível de
        fundo sem carteira. `pct_of_portfolio` é fração da CARTEIRA, não do
        patrimônio: um FIDC alavancado tem carteira maior que o PL e usar PL
