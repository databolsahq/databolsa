        false` são as 11 categorias de topo e já cobrem a carteira inteira; as
        demais reabrem algumas delas em detalhe (consignado dentro de
        Financeiro, precatório dentro de Setor público), com `parent_code`
        apontando a mãe. Somar as duas juntas dobra a carteira — quem quer o mix
        filtra o topo.


