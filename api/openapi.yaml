                            property:
                              type: string
                            op:
                              type: string
                              enum:
                                - eq
                                - ne
                            values:
                              type: array
                              items:
                                type: string
                              description: Valores pedidos, como vieram.
                            matched:
                              type: array
                              items:
                                type: string
                              description: Valores que casaram, na grafia canônica da fonte. Caixa e acento
