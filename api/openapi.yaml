        meses; include_stale=true inclui encerrados/incorporados), filtrável por
        segmento, tijolo/papel e PL mínimo (min_pl); ordena por `sort`.
        Paginação por cursor (meta.next_cursor). Retorna ticker, nome, segmento
        e indicadores (dy, pvp, vacância…).
  /v1/screener/funds:
    get:
      responses:
        "200":
          description: Página de fundos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundScreenerItem"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: screenFunds
      tags:
        - Screener
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: classificacao
          schema:
            type: string
            description: "Filtra por classificação CVM do fundo (match exato), ex.: 'Renda
              Fixa', 'Ações'."
        - in: query
          name: manager
          schema:
            type: string
            description: "Filtra pelo GESTOR, por substring da razão social publicada pela
              CVM (ex.: 'paramis')."
        - in: query
          name: min_net_worth
          schema:
            type: number
            description: Patrimônio líquido mínimo (R$).
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - net_worth
              - return_1m
              - return_12m
              - return_ytd
              - shareholders
            default: net_worth
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      summary: Screener de fundos de investimento (CVM 175)
      description: Ranqueia o universo de fundos por patrimônio, retorno (1m/12m/YTD)
        ou nº de cotistas; filtra por classificação CVM e PL mínimo.
        `return_12m` fica null enquanto não houver 12m de histórico.
  /v1/screener/debentures:
    get:
      responses:
        "200":
          description: Página de debêntures ranqueadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DebentureScreenerRow"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default:
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      operationId: screenDebentures
      tags:
        - Screener
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: q
          schema:
            type: string
            description: Busca por código do papel ou nome do emissor (substring).
        - in: query
          name: indexer
          schema:
            type: string
            description: "Indexador as-filed: DI, IPCA, IGP-M, PRÉ, TR…"
        - in: query
          name: incentivada
          schema:
            type: boolean
            description: true = só incentivadas (Lei 12.431, isentas de IR para pessoa
              física).
        - in: query
          name: active
          schema:
            type: boolean
            default: true
            description: Default true = só emissões vivas. active=false lista as saídas
              (vencidas/resgatadas).
        - in: query
          name: maturityFrom
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento a partir de (YYYY-MM-DD).
        - in: query
          name: maturityTo
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Vencimento até (YYYY-MM-DD).
        - in: query
          name: minSpread
          schema:
            type: number
            description: Spread mínimo em % a.a. sobre o indexador.
        - in: query
          name: maxSpread
          schema:
            type: number
            description: Spread máximo em % a.a. sobre o indexador.
        - in: query
          name: minTrades30d
          schema:
            type: number
            description: "Piso de liquidez: nº mínimo de negócios no secundário na janela de
              30 dias."
        - in: query
          name: minFundHolders
          schema:
            type: number
            description: Nº mínimo de fundos com posição no papel na última carteira mensal
              divulgada.
        - in: query
          name: orderBy
          schema:
            type: string
            enum:
              - spread
              - maturity
              - volume_30d
              - trades_30d
              - fund_holders
              - pct_of_curve
            default: volume_30d
            description: "Critério de ordenação: spread (spread_pct_aa), maturity
              (vencimento), volume_30d, trades_30d, fund_holders ou pct_of_curve
              (last_pct_of_curve). Papel sem a métrica vai para o fim em
              qualquer sentido."
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      summary: "Screener de debêntures: indexação, spread, liquidez e demanda de fundos"
      description: "Filtra e ranqueia o universo de debêntures por indexador, spread,
        vencimento, liquidez do secundário e demanda institucional. Como ler
        cada métrica: `spread_pct_aa` é a taxa aditiva sobre o indexador
        (indexer='DI' + indexer_pct=100 + spread=1,6 lê-se DI a 100% + 1,6%
        a.a.); `years_to_maturity` é o prazo restante em anos (null = vencida ou
        perpétua); `last_pct_of_curve` é o preço do último negócio como % do PU
        teórico na curva — <100 = deságio (risco percebido ou iliquidez), >100 =
        ágio; `trades_30d`/`volume_brl_30d` (e 90d) medem liquidez em janelas
        contadas do último pregão disponível, com volume aproximado por PU médio
        × quantidade; `fund_holders`/`funds_value_brl` dizem quantos fundos
        detêm o papel e o valor somado dessas posições na carteira mensal mais
        recente (null = fora das carteiras divulgadas, não zero).
        `is_incentivada` = isenta de IR para pessoa física (Lei 12.431).
        Default: só emissões vivas (active=true), ordenadas por volume_brl_30d
        desc."
  /v1/macro/gears:
