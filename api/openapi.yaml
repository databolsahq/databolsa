      summary: Fluxo de cotas e cobertura de resgate, mês a mês
      description: >-
        Está entrando ou saindo dinheiro, e o fundo consegue honrar o que já foi
        pedido. São duas tabelas do informe que só valem juntas: a movimentação
        de cotas dá o resgate **solicitado e ainda não pago**, e a liquidez do
        ativo dá quanto da carteira vira caixa em até 30 dias.


        `redemption_coverage_30d` é a razão entre as duas. **Abaixo de 1 é
        pedido maior que capacidade** — um problema com data marcada, não uma
        métrica de conforto. Vem null quando não há resgate solicitado, e
        ausência de pedido é ausência de risco: ler isso como cobertura zero
        inverteria o sinal.


        **Amortização não é resgate**, e por isso não entra em `net_flow`.
        Amortização é devolução programada de principal prevista em regulamento
        — sinal de fundo funcionando —, enquanto resgate é decisão do cotista.
        Somadas, um fundo amortizando rigorosamente no prazo pareceria em fuga.
        Pelo mesmo cuidado, `net_flow` usa o resgate PAGO e não o solicitado: os
        dois se sobrepõem no tempo (o mesmo dinheiro é pedido num mês e pago no
        outro) e empilhá-los conta a saída duas vezes.


        As faixas de liquidez são **cumulativas**: `liquid_30d` é "até 30 dias"
        e já engloba `liquid_now`. Somar as faixas conta o mesmo ativo mais de
        uma vez.
