          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: from
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      summary: "Movimentação da carteira: ticket médio, recompra e parte relacionada"
      description: >-
        Como a carteira de direitos creditórios se mexeu no mês — o que o fundo
        comprou, o que o cedente comprou de volta e o que foi vendido para quem.


        `avg_ticket` é a **pulverização**, que era premissa do produto ("riscos
        não correlacionados") e até aqui indemonstrável: 100 recebíveis de R$ 1
        milhão e 1 milhão de recebíveis de R$ 100 são a mesma carteira em valor
        e riscos opostos.


        `repurchase_to_portfolio` é o cedente comprando de volta o recebível que
        já cedeu, tipicamente o que vencia e não ia pagar. É a forma clássica de
        uma carteira parecer saudável enquanto o excesso de spread é queimado
        para maquiar atraso — e como a recompra some da inadimplência declarada,
        ela não aparece em nenhuma outra métrica. O denominador é a
        **carteira**, não o patrimônio: fundo alavancado tem carteira maior que
        o PL, e usar PL faria a mesma recompra parecer menor.


        `related_party_sale_pct` é o fundo vendendo recebível de volta para o
        cedente ou para prestadores de serviço. Em volume relevante muda a
        natureza do veículo: deixa de ser comprador de risco e vira financiador
        do cedente. Venda para terceiro fica fora da conta de propósito — isso é
        mercado, não conflito. É raro, e é a raridade que faz a ocorrência valer
        alarme.


        **Comprar direito já inadimplente não é necessariamente defeito:** há
        fundo cuja tese é comprar carteira vencida com deságio. Vira sinal num
        fundo que se apresenta como performado, e essa distinção é de quem
        consome — por isso o campo se chama `acquired_impaired` e descreve o
        fato em vez de julgá-lo.


        Garantia tem cobertura baixíssima na fonte (180 classes em 13,5 anos):
        `collateral_amount` null é a fonte calada, **nunca zero de garantia**.
