openapi: 3.1.0
info:
  title: DataBolsa API
  description: >-
    API aberta de dados financeiros locais e globais, com maior profundidade no
    Brasil.


    Convenções:

    - Datas em ISO 8601; valores monetários em BRL salvo campo `currency`.

    - Preços de ações **ajustados por proventos por default** (`adjusted=true`).

    - Indicadores fundamentalistas **TTM por default**, de demonstrações
    consolidadas.

    - **Toda listagem e toda série** respondem `{ data, meta }`: os itens em
    `data` e, em `meta`,
      sempre a paginação (`next_cursor`, `count`). Parte das rotas ecoa também o contexto da
      consulta em `meta` (ticker, sessão, indicador, data-base...) — confira o schema da
      operação antes de depender disso, porque não é universal. Rotas sem cursor trazem
      `next_cursor: null` — nunca um envelope diferente.
    - Paginação por cursor onde ela existe: `?cursor=&limit=`; siga
    `meta.next_cursor` até null.

    - Recursos singulares (um papel, uma companhia, um fundo, uma thread de
    eventos, a saúde da
      ingestão) respondem o objeto direto, sem `data`.
    - Erros seguem RFC 9457 (`application/problem+json`).

    - Toda métrica é rastreável à fonte primária (campo `lineage`).
  version: 3.9.0
  contact:
    name: DataBolsa
  license:
    name: Apache-2.0
servers:
  - url: https://api.databolsa.com
    description: Produção
  - url: http://localhost:8080
    description: Self-hosted
security:
  - bearerApiKey: []
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
        build:
          type:
            - string
            - "null"
          description: SHA do commit da imagem que respondeu.
        instance:
          type:
            - string
            - "null"
          description: Identificador do processo/pod que respondeu.
        data_freshness:
          type: object
          additionalProperties:
            type: string
      required:
        - status
        - version
        - build
        - instance
        - data_freshness
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: O erro em forma LEGÍVEL POR PROGRAMA (membro de extensão do RFC
            9457). `detail` é a frase humana e pode mudar; o que um cliente
            precisa decidir por ele mora aqui — `code` (`not_found`, `split`,
            `budget_exceeded`…), `successors` num 409 de cisão, os números
            recebidos e os tetos num 422 de orçamento.
      required:
        - type
        - title
        - status
    Document:
      type: object
      properties:
        cvm_code:
          type: integer
        kind:
          $ref: "#/components/schemas/DocumentKind"
          description: Tipo estável do documento, derivado de `category`. Use-o para
            filtrar (`kind=material_fact`) em vez de casar a string em
            português, que varia com o vocabulário da fonte.
        category:
          type:
            - string
            - "null"
          description: Categoria como publicada no IPE/CVM (texto livre)
        type:
          type:
            - string
            - "null"
        subject:
          type:
            - string
            - "null"
        reference_date:
          type:
            - string
            - "null"
        filed_at:
          type:
            - string
            - "null"
        protocol:
          type:
            - string
            - "null"
        download_url:
          type:
            - string
            - "null"
      required:
        - cvm_code
        - kind
        - category
        - type
        - subject
        - reference_date
        - filed_at
        - protocol
        - download_url
    DocumentKind:
      type: string
      enum:
        - material_fact
        - market_communication
        - financial_report
        - shareholder_notice
        - shareholder_meeting
        - periodic_report
        - management_report
        - debt_instrument
        - governing_document
        - offering_document
        - regulation
        - other
      description: Classificação estável. debt_instrument = escritura/termo de
        securitização/aditamento; governing_document = regulamento ou documento
        constitutivo; offering_document = lâmina/informações essenciais de
        oferta (Anexo E da RCVM 88); regulation = texto consolidado de norma
        (Resolução/Instrução CVM, Resolução CMN/BCB, lei), cujo objeto dono é
        `norm` no grafo.
    EntityListRow:
      type: object
      properties:
        id:
          type: string
          description: Id aceito por `getObject`, `getObjectFacts` e `listObjectLinks`.
        kind:
          type: string
        subkind:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
          description: Nulo é objeto sem nome resolvido.
        anchor_type:
          type: string
          description: Tipo da chave âncora (cnpj, ticker, isin).
        anchor_value:
          type: string
          description: A chave âncora, identificador estável do objeto.
        tickers:
          type:
            - array
            - "null"
          items:
            type: string
          description: Códigos de negociação do objeto (BDR, ETF, papel, FII), quando os
            tem. A âncora do BDR é o ISIN e a do ETF é o CNPJ; o ticker viaja
            aqui para o catálogo linkar sem pedir a série de cada um.
        properties:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
          description: As propriedades pedidas em `props`, por nome, como texto. Nulo é
            folha sem a linha. Ausente quando `props` não foi pedido.
      required:
        - id
        - kind
        - subkind
        - name
        - anchor_type
        - anchor_value
        - tickers
    EntityLinkObservationRow:
      type: object
      properties:
        rel:
          type: string
          description: Verbo da relação como o servidor o publica; `string`, não enum,
            para que verbo novo não derrube a resposta. `listObjectRelations`
            lista os vigentes.
        shape:
          type: string
          enum:
            - snapshot
            - event
          description: "`snapshot`: a magnitude publicada numa competência (uma linha por
            competência). `event`: uma DECISÃO datada — ação de agência de
            rating com rótulo, perspectiva, aviso e o recorte de série avaliado;
            duas camadas do mesmo fundo no mesmo dia são duas linhas."
        direction:
          type: string
          enum:
            - out
            - in
        other_id:
          type: string
        other_kind:
          type: string
          description: Tipo do objeto como o servidor o publica; `string`, não enum.
            `getObjectCensus` lista os vigentes.
        other_name:
          type:
            - string
            - "null"
        other_key_type:
          type:
            - string
            - "null"
          description: Tipo de identificador como o servidor o publica; `string`, não
            enum. `getObjectCensus` lista os vigentes.
        other_key:
          type:
            - string
            - "null"
        source:
          type: string
        observed_at:
          type: string
          description: Competência da magnitude publicada (`snapshot`) ou data da decisão
            da agência (`event`).
        magnitude:
          type:
            - number
            - "null"
          description: Tamanho publicado na competência (`snapshot`) ou notch da nota na
            escala (`event`). Nulo não é zero; em `event` é ação sem número.
        magnitude_unit:
          type:
            - string
            - "null"
          description: Unidade da magnitude; em `rates` é a escala (`national_br`,
            `global`), e notch só compara dentro da mesma escala.
        label:
          type:
            - string
            - "null"
          description: "`event`: a nota como a agência a escreveu (`brAAA(sf)`, `AA+`).
            Nulo em `snapshot`."
        outlook:
          type:
            - string
            - "null"
          description: "`event`: perspectiva declarada (`stable`, `positive`, `negative`,
            `developing`). Nulo quando a fonte não a afirma."
        watch:
          type:
            - string
            - "null"
          description: "`event`: aviso de revisão (`positive`, `negative`). Nulo quando
            não há."
        action:
          type:
            - string
            - "null"
          description: "`event`: a ação (`assigned`, `affirmed`, `upgraded`, `downgraded`,
            `withdrawn`, `watch_placed`). Nulo quando o documento não a nomeia."
        series:
          type:
            - string
            - "null"
          description: "`event`: o recorte avaliado dentro do sujeito, como
            `classe:número:tranche:emissão` (`senior:1::`, `mezzanine::A:`).
            Nulo quando a decisão é sobre o sujeito inteiro; separa as camadas
            avaliadas no mesmo dia."
        confidence:
          type: string
          enum:
            - high
            - low
      required:
        - rel
        - shape
        - direction
        - other_id
        - other_kind
        - other_name
        - other_key_type
        - other_key
        - source
        - observed_at
        - magnitude
        - magnitude_unit
        - label
        - outlook
        - watch
        - action
        - series
        - confidence
    EntityEvidence:
      type: object
      properties:
        protocol:
          type: string
          description: Protocolo do documento na fonte; identifica o documento em
            `readDocument`.
        source:
          type: string
          description: Conector que trouxe o documento (IPE da CVM, FNET, DFP/ITR).
        url:
          type:
            - string
            - "null"
          description: Link da fonte, quando publicado.
        category:
          type:
            - string
            - "null"
        type:
          type:
            - string
            - "null"
        reference_date:
          type:
            - string
            - "null"
        filed_at:
          type:
            - string
            - "null"
          description: Data de protocolo; é a que vale para leitura point-in-time.
        page_start:
          type:
            - integer
            - "null"
        page_end:
          type:
            - integer
            - "null"
        heading:
          type:
            - string
            - "null"
          description: Caminho de títulos até o trecho, quando o documento tem estrutura.
        excerpt:
          type: string
          description: Texto do documento, não resumo.
      required:
        - protocol
        - source
        - url
        - category
        - type
        - reference_date
        - filed_at
        - page_start
        - page_end
        - heading
        - excerpt
    FactAxes:
      type:
        - object
        - "null"
      properties:
        dimension:
          type:
            - string
            - "null"
          description: "O que o número é: `currency`, `rate`, `share`, `ratio`, `index`,
            `points`, `count`, `duration`."
        scale:
          type:
            - string
            - "null"
          description: "Escala em que o valor é servido: `unit`, `percent`, `bps`,
            `thousand`, `million`, `billion`, `business_days`. O valor vem como
            publicado; a escala diz como lê-lo."
        period:
          type:
            - string
            - "null"
          description: "Janela coberta pelo número: `none`, `daily`, `monthly`,
            `quarterly`, `annual`, `ttm_12m`, `cagr_3y`. Não é a cadência de
            publicação. `none` indica nível, sem janela."
        seasonal_adjustment:
          type:
            - string
            - "null"
          description: "`nsa` sem ajuste, `sa` com ajuste, `saar` ajustado e anualizado.
            Nulo fora das séries macro."
        expected_range:
          type:
            - object
            - "null"
          properties:
            min:
              type: number
            max:
              type: number
          required:
            - min
            - max
          description: Faixa plausível declarada, na mesma escala do valor. Alimenta
            `out_of_prior`.
        concept:
          type: string
          description: O conceito medido, sem a régua. Medidas com o mesmo `concept`
            compartilham `dimension` e `period`; moeda e escala podem divergir.
            O vocabulário é `x-ontology.concepts`.
        aggregation:
          type:
            - string
            - "null"
          description: "Como as observações se juntam no tempo: `flow` (quantidade por
            período: soma), `rate_compound` (variação % do período: compõe),
            `rate_level` (taxa que é nível: média ou diferença em p.p.), `level`
            (estoque ou índice: média, variação %, diferença). Decide quais
            `transform` de `getObjectHistory` a série aceita. Nulo quando a
            medida não declara."
      required:
        - dimension
        - scale
        - period
        - seasonal_adjustment
        - expected_range
        - concept
        - aggregation
    PublicMarketEvent:
      type: object
      properties:
        event_id:
          type: number
        day:
          type: string
          description: Dia do evento (YYYY-MM-DD, BRT).
        layer:
          type: string
          description: estrutural | setorial | corporativa
        category:
          type: string
          description: macro | politica | internacional | commodities | corporate | fii |
            cripto | mercado | outros
        title:
          type: string
        summary:
          type:
            - string
            - "null"
        entities:
          type: array
          items:
            type: string
          description: Atores/empresas citados (ticker NÃO é obrigatório).
        tickers:
          type: array
          items:
            type: string
        transmission_channels:
          type: array
          items:
            type: string
          description: "Canais de transmissão a preço: dolar | ibov | brent | curva |
            selic."
        score:
          type:
            - number
            - "null"
        detectors:
          type: array
          items:
            type: string
          description: "Quais detectores confirmaram: official | press | market. 2+ =
            evento forte."
        thread_slug:
          type:
            - string
            - "null"
          description: Thread (evento-pai) quando o evento faz parte de uma história em
            curso.
        source_refs:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSourceRef"
      required:
        - event_id
        - day
        - layer
        - category
        - title
        - summary
        - entities
        - tickers
        - transmission_channels
        - score
        - detectors
        - thread_slug
        - source_refs
    MarketEventSourceRef:
      type: object
      properties:
        kind:
          type: string
          description: "Origem da evidência: dou | rss | copom | fedreg | camara | gdelt |
            price"
        id:
          anyOf:
            - type: string
            - type: number
        url:
          type:
            - string
            - "null"
        title:
          type: string
      required:
        - kind
        - id
        - url
        - title
    LiveQuote:
      type: object
      properties:
        ticker:
          type: string
        price:
          type:
            - number
            - "null"
        change_pct:
          type:
            - number
            - "null"
        ts:
          type: string
        session_date:
          type: string
        prev_close:
          type:
            - number
            - "null"
        source:
          type: string
          enum:
            - intraday
            - eod
        sessions_behind:
          type: integer
          description: Pregões entre `session_date` e a última sessão do mercado. 0 =
            preço da sessão corrente. > 0 = último negócio conhecido do papel,
            congelado — `change_pct` vem null nesse caso.
      required:
        - ticker
        - price
        - change_pct
        - ts
        - session_date
        - prev_close
        - source
        - sessions_behind
    Quote:
      type: object
      properties:
        date:
          type: string
        open:
          type:
            - number
            - "null"
        high:
          type:
            - number
            - "null"
        low:
          type:
            - number
            - "null"
        close:
          type:
            - number
            - "null"
        close_raw:
          type:
            - number
            - "null"
          description: Fechamento bruto (não ajustado), como reportado pela B3
        close_tr:
          type:
            - number
            - "null"
          description: "Fechamento de retorno total: ajustado por eventos + proventos
            reinvestidos (bruto). = close quando não há fonte de proventos
            (units/FII)"
        volume:
          type:
            - number
            - "null"
          description: Volume financeiro (R$)
        quantity:
          type:
            - number
            - "null"
        trades:
          type:
            - number
            - "null"
          description: "Nº de negócios — null: fonte aberta dá quantidade, não contagem"
        adjusted:
          type: boolean
        adjust_type:
          type:
            - string
            - "null"
        adjust_quality:
          type:
            - string
            - "null"
      required:
        - date
        - open
        - high
        - low
        - close
        - close_raw
        - close_tr
        - volume
        - quantity
        - trades
        - adjusted
        - adjust_type
        - adjust_quality
    IntradayPoint:
      type: object
      properties:
        ts:
          type: string
        price:
          type:
            - number
            - "null"
        change_pct:
          type:
            - number
            - "null"
      required:
        - ts
        - price
        - change_pct
    IndicatorValue:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        value:
          type:
            - number
            - "null"
          description: null quando não calculável — ver reason
        unit:
          type: string
          enum:
            - ratio
            - percent
            - brl
            - brl_per_share
            - count
            - days
        reason:
          type:
            - string
            - "null"
        reference_date:
          type:
            - string
            - "null"
        ttm:
          type: boolean
        lineage:
          $ref: "#/components/schemas/Lineage"
        methodology_url:
          type: string
      required:
        - name
        - label
        - value
        - unit
        - reason
        - reference_date
        - ttm
        - lineage
        - methodology_url
    Lineage:
      type: object
      properties:
        source:
          type: string
        reference:
          type: string
        url:
          type:
            - string
            - "null"
      required:
        - source
        - reference
    CorporateEvent:
      type: object
      properties:
        ticker:
          type: string
          description: "O código sob o qual o evento foi gravado — pode ser um código
            ANTIGO do mesmo papel: a rota resolve o papel pelo grafo de
            identidade e devolve o histórico inteiro, renomeações incluídas"
        entity_id:
          type:
            - string
            - "null"
          description: O objeto do PAPEL no grafo de identidade. Nulo quando o código não
            resolveu no spine
        type:
          type:
            - string
            - "null"
        approved_date:
          type:
            - string
            - "null"
        ex_date:
          type:
            - string
            - "null"
        factor:
          type:
            - number
            - "null"
        detail:
          type:
            - string
            - "null"
      required:
        - ticker
        - entity_id
        - type
        - approved_date
        - ex_date
        - factor
        - detail
    InsiderMove:
      type: object
      properties:
        reference_month:
          type: string
          description: AAAA-MM
        net_shares:
          type:
            - number
            - "null"
        net_value_brl:
          type:
            - number
            - "null"
        buy_value_brl:
          type:
            - number
            - "null"
        sell_value_brl:
          type:
            - number
            - "null"
        corporate_event_shares:
          type:
            - number
            - "null"
          description: "NÃO SOMAR a net_shares. Saldo de eventos NÃO-mercado do mesmo mês
            — bonificação, doação, herança, grupamento/desdobramento, empréstimo
            de ações e posse/desligamento de cargo — que mudam a posição do
            insider sem nenhuma compra ou venda. Vem separado porque a magnitude
            é maior que a do fluxo: 719.464 Mi de ações em módulo contra 184.689
            Mi do net de mercado (3,9×), presente em 39,1% dos meses do acervo."
        lineage:
          $ref: "#/components/schemas/Lineage"
      required:
        - reference_month
        - net_shares
        - net_value_brl
        - buy_value_brl
        - sell_value_brl
        - corporate_event_shares
        - lineage
    FundTickerMove:
      type: object
      properties:
        ticker:
          type: string
        comptc_date:
          type: string
          description: competência do CDA (AAAA-MM-DD)
        cnpj:
          type: string
          description: CNPJ da classe que se moveu
        prev_comptc_date:
          type:
            - string
            - "null"
          description: competência anterior COMPARÁVEL, não o mês calendário
        fund_name:
          type:
            - string
            - "null"
        fund_manager:
          type:
            - string
            - "null"
        qty_prev:
          type:
            - number
            - "null"
        qty_cur:
          type:
            - number
            - "null"
        qty_delta:
          type:
            - number
            - "null"
          description: Variação em QUANTIDADE, posição econômica (direta + cedida em
            empréstimo − obrigação por recebida). Negativo = posição reduzida ou
            vendida.
        value_prev_brl:
          type:
            - number
            - "null"
        value_cur_brl:
          type:
            - number
            - "null"
        move_kind:
          type:
            - string
            - "null"
          enum:
            - entrou
            - aumentou
            - reduziu
            - saiu
            - abriu_venda
            - zerou_venda
            - manteve
            - indeterminado
            - null
          description: "Classificado pelo SINAL da posição econômica, não pelo zero: a
            posição pode ser negativa (obrigação por ações recebidas > posse),
            então abrir venda é `abriu_venda` e não `entrou`. `indeterminado` =
            um dos meses declarou R$ sem quantidade, e aí o zero não significa
            ausência de posição."
        delta_reason:
          type:
            - string
            - "null"
          enum:
            - posicao_liquida_negativa
            - somente_emprestimo
            - quantidade_nao_divulgada
            - null
          description: Anotação de leitura da linha; null = posição comprada, declarada e
            com quantidade.
        lineage:
          type:
            - string
            - "null"
      required:
        - ticker
        - comptc_date
        - cnpj
        - prev_comptc_date
        - fund_name
        - fund_manager
        - qty_prev
        - qty_cur
        - qty_delta
        - value_prev_brl
        - value_cur_brl
        - move_kind
        - delta_reason
        - lineage
    TickerDemand:
      type: object
      properties:
        ticker:
          type: string
        month_ref:
          type: string
          description: AAAA-MM
        comptc_date:
          type:
            - string
            - "null"
          description: competência do CDA; null quando o mês só tem insider
        asset_kind:
          type:
            - string
            - "null"
          enum:
            - equity
            - bdr
            - null
        funds_holders:
          type:
            - number
            - "null"
          description: fundos com posição econômica POSITIVA no ativo; o vendido está em
            funds_short_holders
        funds_short_holders:
          type:
            - number
            - "null"
          description: fundos com posição econômica negativa (obrigação por ações
            recebidas > posse)
        funds_shares:
          type:
            - number
            - "null"
        funds_value_brl:
          type:
            - number
            - "null"
        funds_implied_price:
          type:
            - number
            - "null"
          description: preço implícito do próprio CDA (R$/qtd), não o fechamento
        funds_shares_delta:
