            - string
            - "null"
        label:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        external_id:
          type:
            - string
            - "null"
        raw: {}
      required:
        - row_index
        - status
    PortfolioPosition:
      type: object
      description: Posição resumida do consolidado (o detalhe completo vem em
        getPortfolioDetail).
      properties:
        symbol:
          type: string
        asset_type:
          type: string
        qty:
          type: number
        weight_pct:
          type:
            - number
            - "null"
        market_value:
          type:
            - number
            - "null"
        unrealized_pct:
          type:
            - number
            - "null"
      required:
        - symbol
        - asset_type
        - qty
    PortfolioContext:
      type: object
      description: Carteira consolidada do usuário (mesmo resumo que o agente de IA usa).
      properties:
        has_portfolio:
          type: boolean
        carteiras:
          type: integer
        patrimonio:
          type: number
        invested:
          type: number
        unrealized_pl:
          type: number
        unrealized_pct:
          type: number
        realized_pl:
          type: number
        xirr:
          type:
            - number
            - "null"
          description: XIRR (TIR anualizada, money-weighted) do consolidado. Decimal a.a.
            (0,14 = 14%).
        day_change_brl:
          type: number
        kind_mix:
          type: string
        any_unpriced:
          type: boolean
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPosition"
          description: Todas as posições consolidadas (qty > 0), ordenadas por valor
            (maiores primeiro).
        by_carteira:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioByCarteira"
      required:
        - has_portfolio
        - carteiras
        - patrimonio
        - invested
        - unrealized_pl
        - unrealized_pct
        - realized_pl
        - day_change_brl
        - kind_mix
        - any_unpriced
        - positions
        - by_carteira
    SuitabilityProfile:
      type: object
      properties:
        level:
          type: string
          enum:
            - Conservador
            - Moderado
            - Arrojado
        score:
          type: integer
          description: Posição na régua 0–100 (Conservador→Arrojado), não uma nota.
        answers:
