      summary: Percorre uma cadeia de relações
      description: Percorre de uma a três relações declaradas como `verbo:direção` e
        ordena por objetos distintos alcançados. `return_at` escolhe a posição
        listada; `count_at`, a contada. `end_id` e `end_kind` restringem a
        ponta. `at` aplica a mesma data a todos os passos. Com `total=true`,
        leia o total em `meta.total`.
