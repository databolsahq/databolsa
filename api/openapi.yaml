        - in: query
          name: to
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      summary: Cotações EOD de um ativo dos EUA (USD)
      description: Preços diários em USD, ajustados por desdobramento na fonte.
  /v1/us/assets/{ticker}/filings:
    get:
      responses:
        "200":
          description: Página de filings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsFiling"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a1
      operationId: listUsFilings
      tags:
        - EUA
      parameters:
        - in: path
          name: ticker
          schema:
            type: string
            pattern: ^[A-Z0-9.\-]+$
            minLength: 1
            maxLength: 10
            description: "Ticker do ativo nos EUA, ex.: AAPL, MSFT, SPY."
          required: true
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: form
          schema:
            type: string
            description: Filtra por formulário (10-K, 10-Q, 8-K…)
      summary: Filings SEC de uma empresa dos EUA (10-K, 10-Q, 8-K…)
      description: Metadados e link do documento oficial no EDGAR (SEC).
  /v1/search:
    get:
      responses:
        "200":
          description: Resultados ranqueados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                      count:
                        type: integer
                        description: Itens nesta página
                      query:
                        type: string
                    required:
                      - next_cursor
                      - count
                      - query
                required:
                  - data
                  - meta
        default: *a1
      operationId: search
      tags:
        - System
      parameters:
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
            maxLength: 64
            description: Termo de busca (ticker ou nome) — ações, FIIs, ETFs, BDRs, índices,
              títulos do Tesouro, séries macro, cripto e ativos dos EUA.
              Acento-insensível; ótimo p/ resolver ticker↔nome.
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          required: false
      summary: Busca unificada (typeahead) por
        ações/FIIs/ETFs/BDRs/índices/títulos/macro/cripto/EUA
      description: Resolve ticker↔nome em todas as classes cobertas. Para ações vem
        também o `cvm_code` da companhia, que abre os documentos e as
        demonstrações (esses endpoints também aceitam o ticker direto).
  /v1/ingest:
    get:
      responses:
        "200":
          description: Saúde da ingestão
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest:
                    oneOf:
                      - $ref: "#/components/schemas/IngestRunDetail"
                      - type: "null"
                  latest_by_trigger:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestRunDetail"
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestSourceHealth"
                  pollers:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestPollerHealth"
                  recent_runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestRunSummary"
                required:
                  - latest
                  - latest_by_trigger
                  - sources
                  - pollers
                  - recent_runs
        default: *a1
      operationId: getIngestHealth
      tags:
        - System
      parameters: []
      summary: Saúde da ingestão (pipeline, fontes, pollers, histórico)
      description: "`latest` é o último run do pipeline completo, não o último run a
        terminar: reparos e recargas pontuais têm trigger próprio e aparecem em
        `latest_by_trigger`, com as mensagens de erro em `errors`. Uma fonte
        pode estar fresca e oca ao mesmo tempo — `missing_ratio` mede a fração
        de partições sem dado e `status: incomplete` sinaliza quando ela deixa
        de ser sazonal."
  /v1/portfolio:
    get:
      operationId: getPortfolio
      tags:
        - Carteira
      summary: Sua carteira (consolidada)
      description: "Retorna a carteira consolidada do dono da chave de API:
        patrimônio, total investido, P&L realizado e não-realizado, variação do
        dia, composição por classe, TODAS as posições (`positions`, maiores
        primeiro) e quebra por carteira. Exige uma chave de API por usuário
        (crie em https://databolsa.com/conta)."
      responses:
        "200":
          description: Carteira consolidada do usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioContext"
        default: &a3
          description: Erro (RFC 9457 application/problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/portfolio/history:
    get:
      operationId: getPortfolioHistory
      tags:
        - Carteira
      summary: Histórico mensal consolidado
      description: "Série mensal do patrimônio consolidado do dono da chave: valor de
        mercado, aporte acumulado, proventos recebidos e resultado realizado,
        mês a mês. Exclui carteiras marcadas como simulação."
      responses:
        "200":
          description: Pontos mensais em `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHistoryResponse"
        default: *a3
  /v1/portfolios:
    get:
      operationId: listPortfolios
      tags:
        - Carteira
      summary: Suas carteiras
      description: Lista as carteiras do dono da chave (id, nome, nº de linhas de
        ativo no ledger, flag de simulação). Use o `id` nas demais operações de
        carteira.
      responses:
        "200":
          description: Carteiras da conta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioListItem"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a3
    post:
      operationId: createPortfolio
      tags:
        - Carteira
      summary: Criar carteira
      description: CRIA uma carteira REAL na conta do dono da chave. O número de
        carteiras é limitado pelo plano (resposta 402 quando o teto é atingido).
        Nome único por conta (409 em duplicidade).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome da carteira (até 60 caracteres, único na conta).
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                  description: Visibilidade (default private).
      responses:
        "201":
          description: Carteira criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListItem"
        default: *a3
  /v1/portfolios/import-template:
    get:
      operationId: getPortfolioImportTemplate
      tags:
        - Carteira
      summary: Template CSV de import manual
      description: "Baixa o template CSV de preenchimento manual (colunas: ticker,
        operacao, data, quantidade, preco) aceito pelo import de planilha."
      responses:
        "200":
          description: Arquivo CSV.
          content:
            text/csv:
              schema:
                type: string
        default: *a3
  /v1/portfolios/{id}:
    get:
      operationId: getPortfolioDetail
      tags:
        - Carteira
      summary: Detalhe de uma carteira
      description: "Carteira computada: posições com preço médio, quantidade, valor de
        mercado, P&L, proventos e alocação, além dos totais e das duas medidas
        de retorno (`returns`). A posição é derivada do ledger de transações,
        que NÃO vem embutido: peça `include=transactions` quando precisar dele,
        ou use listPortfolioTransactions por ativo."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira (de listPortfolios).
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Camadas opcionais, separadas por vírgula. `transactions` embute o
            ledger completo em cada posição — dezenas de vezes maior que o
            payload padrão numa carteira com histórico.
          schema:
            type: string
            enum:
              - transactions
      responses:
        "200":
          description: Carteira computada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDetail"
        default: *a3
    patch:
      operationId: updatePortfolio
      tags:
        - Carteira
      summary: Editar carteira
      description: "ALTERA a carteira REAL do dono da chave: renomeia (`name`), muda a
        visibilidade (`visibility`) e/ou marca como simulação
        (`exclude_from_consolidated`, fora do consolidado). Informe ao menos um
        campo."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Novo nome (até 60 caracteres, único na conta).
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                  description: Nova visibilidade.
                exclude_from_consolidated:
                  type: boolean
                  description: true = carteira de simulação (fora do consolidado).
      responses:
        "200":
          description: Campos alterados.
          content:
            application/json:
              schema:
                type: object
        default: *a3
    delete:
      operationId: deletePortfolio
      tags:
        - Carteira
      summary: Apagar carteira
      description: APAGA a carteira REAL do dono da chave, com TODOS os ativos e
        transações (cascata, irreversível). Confirme com o usuário antes de
        chamar.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Carteira apagada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        default: *a3
  /v1/portfolios/{id}/history:
    get:
      operationId: getPortfolioHistoryById
      tags:
        - Carteira
      summary: Histórico mensal de uma carteira
      description: Série mensal (patrimônio, aporte, proventos, realizado) de UMA
        carteira específica, com o TWR time-weighted. A xirr money-weighted da
        mesma carteira está em getPortfolioDetail (`returns`).
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Pontos mensais em `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHistoryDetailResponse"
        default: *a3
  /v1/portfolios/{id}/assets:
    post:
      operationId: addPortfolioAsset
      tags:
        - Carteira
      summary: Adicionar ativo à carteira
      description: "ADICIONA um ativo à carteira REAL do dono da chave (idempotente —
        repetir não duplica). Ativo sem transações funciona como watchlist;
        lance transações para rastrear posição. Para Tesouro Direto use o nome
        oficial do título (ex.: TESOURO SELIC 2029)."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
              properties:
                asset_type:
                  type: string
                  enum:
                    - stock
                    - fii
                    - bdr
                    - index
                    - tesouro
                    - crypto
                    - option
                    - renda_fixa
                    - us
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: "Ticker (ex.: PETR4) ou nome oficial do título do Tesouro."
      responses:
        "201":
          description: Ativo na carteira.
          content:
            application/json:
              schema:
                type: object
        default: *a3
    delete:
      operationId: removePortfolioAsset
      tags:
        - Carteira
      summary: Remover ativo da carteira
      description: REMOVE um ativo da carteira REAL do dono da chave, APAGANDO o
        ledger de transações dele nesta carteira (cascata, irreversível).
        Confirme com o usuário antes de chamar.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo.
          schema:
            type: string
            enum:
              - stock
              - fii
              - bdr
              - index
              - tesouro
              - crypto
              - option
              - renda_fixa
              - us
        - name: symbol
          in: query
          required: true
          description: Ticker ou nome do título.
          schema:
            type: string
      responses:
        "200":
          description: Ativo removido.
          content:
            application/json:
              schema:
                type: object
        default: *a3
    patch:
      operationId: updatePortfolioAsset
      tags:
        - Carteira
      summary: Taxa contratada de renda fixa
      description: "DEFINE a taxa contratada de uma posição de renda fixa (para o
        cálculo de rendimento): `rf_indexer` (cdi = % do CDI, prefixado = %
        a.a., ipca = IPCA + % a.a.) e `rf_rate`. Use `rf_indexer: none` para
        limpar."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo (renda_fixa/tesouro).
          schema:
            type: string
        - name: symbol
          in: query
          required: true
          description: Código do papel.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rf_indexer
              properties:
                rf_indexer:
                  type: string
                  enum:
                    - cdi
                    - prefixado
                    - ipca
                    - none
                  description: Indexador (none limpa a taxa).
                rf_rate:
                  type: number
                  description: "Taxa (ex.: 110 = 110% do CDI; 6.2 = IPCA+6,2%)."
      responses:
        "200":
          description: Meta da posição.
          content:
            application/json:
              schema:
                type: object
        default: *a3
  /v1/portfolios/{id}/transactions:
    get:
      operationId: listPortfolioTransactions
      tags:
        - Carteira
      summary: Ledger de um ativo
      description: Lista as transações (compras, vendas, splits, ajustes) de um ativo
        da carteira, em ordem cronológica.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: asset_type
          in: query
          required: true
          description: Tipo do ativo.
          schema:
            type: string
        - name: symbol
          in: query
          required: true
          description: Ticker ou nome do título.
          schema:
            type: string
      responses:
        "200":
          description: Transações do ativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioTransaction"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      asset:
                        type: object
                        description: Ativo do ledger (id, asset_type, symbol).
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a3
    post:
      operationId: addPortfolioTransaction
      tags:
        - Carteira
      summary: Lançar transação
      description: LANÇA uma transação na carteira REAL do dono da chave. Se o ativo
        ainda não está na carteira, ele é adicionado automaticamente — "compra
        de 100 PETR4" é uma única chamada. buy/sell exigem `quantity`; `price` é
        opcional (custo desconhecido); split usa `ratio` (2 = 2:1). Confirme
        valores com o usuário.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
                - kind
                - trade_date
              properties:
                asset_type:
                  type: string
                  enum:
                    - stock
                    - fii
                    - bdr
                    - index
                    - tesouro
                    - crypto
                    - option
                    - renda_fixa
                    - us
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: "Ticker (ex.: PETR4) ou nome oficial do título do Tesouro."
                kind:
                  type: string
                  enum:
                    - buy
                    - sell
                    - split
                  description: Tipo da transação.
                trade_date:
                  type: string
                  description: Data do negócio (AAAA-MM-DD).
                quantity:
                  type: number
                  description: Quantidade (> 0; obrigatória em buy/sell).
                price:
                  type: number
                  description: Preço unitário em BRL (omita se desconhecido).
                fees:
                  type: number
                  description: Custos/corretagem em BRL (default 0).
                ratio:
                  type: number
                  description: Fator do split (2 = 2:1; 0.5 = grupamento 1:2).
                note:
                  type: string
                  description: Observação livre (até 280 caracteres).
      responses:
        "201":
          description: Transação lançada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/PortfolioTransaction"
        default: *a3
  /v1/portfolios/{id}/transactions/{txId}:
    patch:
      operationId: updatePortfolioTransaction
      tags:
        - Carteira
      summary: Editar transação
      description: "ALTERA uma transação existente da carteira REAL do dono da chave
        (patch parcial: informe só os campos a mudar). Confirme com o usuário
        antes de chamar."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: txId
          in: path
          required: true
          description: Id da transação (de listPortfolioTransactions).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - buy
                    - sell
                    - split
                  description: Tipo da transação.
                trade_date:
                  type: string
                  description: Data do negócio (AAAA-MM-DD).
                quantity:
                  type: number
                  description: Quantidade.
                price:
                  type: number
                  description: Preço unitário em BRL.
                fees:
                  type: number
                  description: Custos em BRL.
                ratio:
                  type: number
                  description: Fator do split.
                note:
                  type: string
                  description: Observação.
      responses:
        "200":
          description: Transação atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioTransaction"
        default: *a3
    delete:
      operationId: deletePortfolioTransaction
      tags:
        - Carteira
      summary: Remover transação
      description: REMOVE uma transação do ledger da carteira REAL do dono da chave
        (irreversível). Confirme com o usuário antes de chamar.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: txId
          in: path
          required: true
          description: Id da transação.
          schema:
            type: string
      responses:
        "200":
          description: Transação removida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        default: *a3
  /v1/portfolios/{id}/imports:
    post:
      operationId: importPortfolioFile
      tags:
        - Carteira
      summary: Importar planilha (B3 ou template manual)
      description: "IMPORTA uma planilha para a carteira REAL do dono da chave:
        Negociação ou Movimentação da B3 (.xlsx) ou o template manual
        (.csv/.xlsx) — o formato é detectado automaticamente. Envie o arquivo em
        `content_base64` (máx. 8 MB). Idempotente: reenviar o mesmo arquivo não
        duplica lançamentos. A resposta resume o que entrou (importadas,
        duplicadas, ignoradas) e traz avisos."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_base64
              properties:
                content_base64:
                  type: string
                  description: Conteúdo do arquivo em base64.
                filename:
                  type: string
                  description: Nome do arquivo (ajuda a trilha de auditoria).
      responses:
        "201":
          description: Resumo do import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioImportSummary"
        default: *a3
    get:
      operationId: listPortfolioImports
      tags:
        - Carteira
      summary: Histórico de imports
      description: Lista os imports já feitos nesta carteira (arquivo, fonte, data e
        resumo persistido).
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      responses:
        "200":
          description: Imports da carteira.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioImportListItem"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a3
  /v1/portfolios/{id}/imports/{importId}/rows:
    get:
      operationId: listPortfolioImportRows
      tags:
        - Carteira
      summary: Linhas de um import
      description: "Drill-down de um import: cada linha do arquivo com status
        (imported, ignored, duplicate, error) e motivo."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
        - name: importId
          in: path
          required: true
          description: Id do import (de listPortfolioImports).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtra por status.
          schema:
            type: string
            enum:
              - imported
              - ignored
              - duplicate
              - error
        - name: limit
          in: query
          required: false
          description: Linhas por página (1–500, default 100).
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: Cursor opaco de meta.next_cursor — mesma paginação das demais
            listagens.
          schema:
            type: string
      responses:
        "200":
          description: Linhas do import.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortfolioImportRow"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      total:
                        type: integer
                        description: Linhas do import que casam o filtro, antes do recorte da página.
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a3
  /v1/portfolios/{id}/reconcile:
    post:
      operationId: reconcilePortfolioAsset
      tags:
        - Carteira
      summary: Reconciliar posição à B3
      description: "AJUSTA a posição calculada de um ativo à quantidade declarada pela
        B3 (`target_qty` na data `as_of`), inserindo um ajuste idempotente —
        útil quando um evento (ex.: subscrição) não veio no extrato. Confirme a
        quantidade com o usuário antes de chamar."
      parameters:
        - name: id
          in: path
          required: true
          description: Id da carteira.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type
                - symbol
                - target_qty
                - as_of
              properties:
                asset_type:
                  type: string
                  description: Tipo do ativo.
                symbol:
                  type: string
                  description: Ticker.
                target_qty:
                  type: number
                  description: Quantidade declarada pela B3 (>= 0).
                as_of:
                  type: string
                  description: Data de referência (AAAA-MM-DD).
      responses:
        "200":
          description: Resultado do ajuste (delta aplicado).
          content:
            application/json:
              schema:
                type: object
        default: *a3
  /v1/suitability:
    get:
      operationId: getSuitability
      tags:
        - Carteira
      summary: Seu perfil de investidor
      description: "Retorna o perfil de investidor (suitability) do dono da chave:
        nível (Conservador/Moderado/Arrojado), a posição na régua 0–100 (não é
        uma nota) e as respostas do questionário. `profile` é nulo se o usuário
        ainda não definiu o perfil."
      responses:
        "200":
          description: Perfil de investidor do usuário (ou nulo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuitabilityEnvelope"
        default: *a3
  /v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Documentos
      summary: Busca semântica em documentos
      description: Busca semântica no TEXTO de documentos CVM/B3 (fatos relevantes,
        releases de resultado, balanços, relatórios gerenciais de FII, atas de
        assembleia). Ideal para perguntas qualitativas que os dados estruturados
        não respondem. Filtre por papel, categoria e ano quando souber.
      parameters:
        - name: q
          in: query
          required: true
          description: Termo/pergunta em linguagem natural.
          schema:
            type: string
            minLength: 1
        - name: tickers
          in: query
          required: false
          description: "Filtra por papéis, ex.: PETR4,PRIO3."
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        - name: category
          in: query
          required: false
          description: Categoria bruta da fonte. Consulte /v1/documents/taxonomy para
            valores disponíveis.
          schema:
            type: string
            minLength: 1
        - name: document_kind
          in: query
          required: false
          description: Taxonomia estável do DataBolsa.
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - stock
              - fii
        - name: year
          in: query
          required: false
          description: Ano de referência do documento (AAAA).
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: filed_before
          in: query
          required: false
          description: "Corte point-in-time: só documentos PROTOCOLADOS (filed_at) até
            esta data — o que estava publicamente disponível na data, não o
            período de referência. Documentos sem data de publicação conhecida
            são EXCLUÍDOS (a exclusão é sinalizada em warnings). A cobertura de
            filed_at do acervo histórico está em backfill; documentos ainda não
            cobertos ficam fora do corte em vez de aparecer com data inferida."
          schema:
            type: string
            format: date
        - name: filed_after
          in: query
          required: false
          description: Só documentos protocolados (filed_at) a partir desta data.
            Documentos sem data de publicação são excluídos.
          schema:
            type: string
            format: date
        - name: protocol
          in: query
          required: false
          description: Restringe a UM documento exato (protocolo CVM/FNET) — busca dentro
            do documento.
          schema:
            type: string
            minLength: 1
        - name: reference_date
          in: query
          required: false
          description: "Período de referência exato do documento (ex.: 2022-06-30 = 2T22)."
          schema:
            type: string
            format: date
        - name: reference_from
          in: query
          required: false
          description: Início do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: reference_to
          in: query
          required: false
          description: Fim do intervalo de reference_date (inclusivo).
          schema:
            type: string
            format: date
        - name: doc_type
          in: query
          required: false
          description: "Subtipo bruto da fonte (ex.: Press-release). Consulte
            /v1/documents/taxonomy."
          schema:
            type: string
            minLength: 1
        - name: tables_only
          in: query
          required: false
          description: Restringe a trechos de tabela (fatos numéricos).
          schema:
            type: boolean
        - name: financial_only
          in: query
          required: false
          description: Restringe a emissores financeiros quando true; false restringe aos
            demais.
          schema:
            type: boolean
        - name: include_context
          in: query
          required: false
          description: false devolve `meta.context` vazio e reduz tokens; os trechos em
            `data` e suas citações continuam presentes.
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          required: false
          description: Máximo de trechos (1–25, default 8).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 8
      responses:
        "200":
          description: Trechos relevantes + bloco de contexto com citação.
          headers: &a4
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 1
              description: Segundos até o reinício da janela.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
        "429": &a5
          description: Limite diário de requisições do plano atingido.
          headers: *a4
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default: *a3
  /v1/events/search:
    get:
      operationId: searchMarketEvents
      tags:
        - Events
      summary: Busca semântica no ledger de eventos de mercado
      description: "Busca por significado no histórico de eventos de mercado (decisões
        do Copom, medidas provisórias, tarifas, geopolítica, eventos
        corporativos relevantes). Complementa as leituras estruturadas de
        /v1/events: use quando a pergunta é temática ('renegociação de dívidas
        do agro', 'escalada no Oriente Médio') e depois aprofunde pelo
        event_id."
      parameters:
        - name: q
          in: query
          required: true
          description: Termo/pergunta em linguagem natural.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: Máximo de eventos (1–25, default 8).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 8
      responses:
        "200":
          description: Eventos mais próximos semanticamente da consulta.
          headers: *a4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEventSearchResponse"
        "429": *a5
        default: *a3
  /v1/documents/taxonomy:
    get:
      operationId: getDocumentTaxonomy
      tags:
        - Documentos
      summary: Taxonomia e cobertura de documentos
      description: Lista os tipos normalizados, as categorias e subtipos brutos
        disponíveis no corpus, além dos anos e tipos de entidade cobertos. Use
        antes de filtrar searchDocuments por categoria.
      responses:
        "200":
          description: Facetas disponíveis no corpus indexado.
          headers: *a4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTaxonomy"
        "429": *a5
        default: *a3
  /v1/theses:
    get:
      operationId: listMyTheses
      tags:
        - Teses
      summary: Minhas teses
      description: "Lista as teses do dono da chave (resumo: título, ticker,
        visibilidade, status de export) e o teto do plano. O documento completo
        vem no getThesis."
      responses:
        "200":
          description: Teses + limite do plano (null = ilimitado).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThesisSummary"
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type:
                          - string
                          - "null"
                        description: "Sempre null: resposta em página única."
                      count:
                        type: integer
                        description: Itens nesta página.
                      limit:
                        type: number
                        nullable: true
                        description: Teto de teses do plano (null = ilimitado).
                    required:
                      - next_cursor
                      - count
                required:
                  - data
                  - meta
        default: *a3
    post:
      operationId: createThesis
      tags:
        - Teses
      summary: Criar tese
      description: "Cria uma tese a partir de um documento de report estruturado
        (`doc`). O doc é validado no servidor contra o schema de reports (seções
        → blocos: cover, rating, summary, keyStats, prose, chart, table,
        callout, scenarios, sources, disclaimer…); erros voltam com o caminho do
        campo. Título/ticker/tipo são derivados do próprio doc. Respeita o
        limite de teses do plano (402 plan_required ao estourar)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - doc
              properties:
                doc:
                  $ref: "#/components/schemas/ReportDocInput"
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                  description: "Default: private."
      responses:
        "201":
          description: Tese criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
        default: *a3
  /v1/theses/reorder:
    post:
      operationId: reorderTheses
      tags:
        - Teses
      summary: Reordenar a vitrine
      description: Define a ordem manual das suas teses (perfil público +
        gerenciador). Envie `ids` na ordem desejada; as teses listadas ganham
        posição 0,1,2…, as demais voltam a ordenar por data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Ids das teses na ordem desejada.
      responses:
        "200":
          description: Ordem salva.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default: *a3
  /v1/theses/import:
    post:
      operationId: importThesisFile
      tags:
        - Teses
      summary: Importar tese de arquivo JSON
      description: Cria uma tese enviando o ARQUIVO JSON do documento em base64
        (`content_base64`) — o caminho natural para CLI e automações (`--file
        tese.json`). Mesma validação e limites do createThesis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_base64
              properties:
                filename:
                  type: string
                  description: Nome do arquivo (informativo).
                content_base64:
                  type: string
                  description: JSON do ReportDoc codificado em base64.
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
      responses:
        "201":
          description: Tese criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
        default: *a3
  /v1/theses/{id}:
    get:
      operationId: getThesis
      tags:
        - Teses
      summary: Detalhe de uma tese
      description: Documento completo + visibilidade + status do export (quando
        `ready`, `pdfUrl`/`previewUrl` apontam para a mídia pública).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tese.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
        default: *a3
    put:
      operationId: updateThesis
      tags:
        - Teses
      summary: Atualizar tese
      description: Atualiza o documento, a visibilidade, o arquivamento e/ou as tags.
        O doc, quando enviado, passa pela mesma validação do create. `archived`
        esconde a tese do público sem apagar; `tags` são rótulos PRIVADOS de
        organização (só o dono vê, nunca aparecem na página pública).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doc:
                  $ref: "#/components/schemas/ReportDocInput"
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
                archived:
                  type: boolean
                  description: true arquiva (some do público), false desarquiva.
                tags:
                  type: array
                  items:
                    type: string
                  description: Rótulos privados (substitui o conjunto; máx. 12).
      responses:
        "200":
          description: Tese atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
        default: *a3
    delete:
      operationId: deleteThesis
      tags:
        - Teses
      summary: Excluir tese
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Excluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        default: *a3
  /v1/theses/{id}/publish:
    post:
      operationId: publishThesis
      tags:
        - Teses
      summary: Publicar / mudar visibilidade
      description: "Define a visibilidade: `public` aparece no perfil e tem página
        própria; `unlisted` só por link; `private` volta a ser só sua. O doc
        publicado vai INTEIRO (revisar antes é do autor); leitores anônimos veem
        só a capa e precisam entrar para ler o resto."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - visibility
              properties:
                visibility:
                  type: string
                  enum:
                    - private
                    - unlisted
                    - public
      responses:
        "200":
          description: Visibilidade atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis:
                    $ref: "#/components/schemas/ThesisDetail"
        default: *a3
  /v1/theses/{id}/export:
    post:
      operationId: exportThesis
      tags:
        - Teses
      summary: Exportar em PDF (plano pago)
      description: "Gera o PDF (A4, com preview PNG) da tese e publica num link
        público de mídia. Assíncrono: responde 202 {status: queued} e o
        getThesis passa a devolver `pdfUrl` quando pronto; se o conteúdo não
        mudou desde o último export, responde 200 direto com o link. O PDF traz
        o doc inteiro."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Já exportada (conteúdo inalterado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThesisExportStatus"
        "202":
          description: Export enfileirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThesisExportStatus"
        default: *a3
