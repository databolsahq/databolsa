      summary: Secundário da cota do FIDC (negócios de balcão da classe)
      description: >-
        Por quanto a cota desta classe NEGOCIOU, pregão a pregão. É a outra
        metade do FIDC: o informe mensal diz o que o fundo tem e nunca o preço;
        o balcão diz o preço e nunca de que fundo é.


        Duas coisas que valem saber antes de concluir qualquer coisa da ausência
        de linhas. A primeira é que a B3 publica cota de FIDC sob a família
        **`CFF`** (cota de fundo fechado), junto com FII, FIP e FIF — procurar
        `family=FIDC` em `/credit/otc` devolve vazio, o que parece ausência de
        mercado e é só rótulo diferente. A segunda é que a esmagadora maioria
        das classes simplesmente não tem giro: em 2026, 379 emissores de FIDC
        apareceram no balcão, contra mais de 4.300 classes no informe. Silêncio
        aqui é característica do produto, não falha de cobertura.


        `match_level` viaja em toda linha porque o elo entre as duas fontes é o
        **nome**: o informe de FIDC não publica ISIN e o balcão não publica
        CNPJ. `exact_name` é denominação social normalizada idêntica — 95,3% dos
        emissores de FIDC do balcão resolvem assim, sem nenhum caso ambíguo.
        Quem preferir descartar a ponte fica com o preço, que é as-filed e
        correto de qualquer forma.
