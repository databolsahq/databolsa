            description: "Competência exata (fim de mês). Default: a mais recente."
      summary: Carteira do FIDC por setor do lastro
      description: >-
        Do que a carteira de direitos creditórios é FEITA. É o corte que separa
        fundos incomparáveis com o mesmo patrimônio: consignado, precatório e
        factoring corporativo têm perfis de perda que não se parecem, e sem ele
        o universo de FIDC é uma lista de patrimônios sem natureza.


        **Duas camadas convivem na resposta e NÃO se somam.** `is_subcategory:
        false` são as 11 categorias de topo e já cobrem a carteira inteira; as
        demais reabrem algumas delas em detalhe (consignado dentro de
        Financeiro, precatório dentro de Setor público), com `parent_code`
        apontando a mãe. Somar as duas juntas dobra a carteira — quem quer o mix
        filtra o topo.


        Setor sem exposição não vira linha: a fonte é formulário de
        preenchimento completo e a esmagadora maioria das células vem zerada.
        Ausência de linha significa sem exposição, nunca dado faltando.


        `unclassified_total` no `meta` é a parte da carteira que a classe não
        abriu por setor. Sem ele, um mix parcial passaria por completo, e a
        classe que não declara nada devolveria lista vazia — indistinguível de
        fundo sem carteira. `pct_of_portfolio` é fração da CARTEIRA, não do
        patrimônio: um FIDC alavancado tem carteira maior que o PL e usar PL
        faria a mesma exposição parecer menor.
  /v1/credit/fidc/{cnpj}/originators:
    get:
      responses:
