      summary: Prometido × entregue por série de cota
      description: >-
        A série entregou o que prometeu. É o desfecho na forma em que o
        investidor faz a pergunta, sem proxy — as demais leituras de
        deterioração usam "a inadimplência passou de tanto" como substituto de
        "deu errado", o que é razoável e ainda assim é um substituto.


        **Sênior e subordinada não se comparam.** A sênior promete taxa e a
        subordinada absorve o que sobrar: `performance_gap_pct` negativo na
        subordinada é o desenho funcionando, e na sênior é promessa quebrada.
        `seniority` usa o mesmo vocabulário e a mesma derivação de
        `/credit/fidc/{cnpj}/series`, e vem null quando o rótulo livre da fonte
        não afirma prioridade.


        `declares_target` **separa "não prometeu" de "prometeu zero"**, e sem
        ele o número engana: o campo de retorno esperado vem sempre preenchido
        na fonte e metade das séries traz zero, porque subordinada normalmente
        não promete retorno. Sem a marca, o gap dessas séries leria "superou a
        meta" onde não havia meta nenhuma.


        `shortfall_streak` conta **meses consecutivos** entregando abaixo do
        prometido. Um mês abaixo é ruído de marcação; a sequência é o que a
        série mensal de 13,5 anos permite afirmar. Desempenho negativo é dado e
        não é filtrado.


        `performance_implausible` marca o mês em que a fonte publica percentual
        fora de [-100, +100] — e ela publica: 1.396 linhas trazem realizado
        acima de 1.000%, com topo em 3,0 × 10¹⁶ por cento. O valor sai
        **as-filed**, nunca corrigido nem escondido, e o mês marcado fica FORA
        de `shortfall_streak`: um gap positivo gigante zeraria uma sequência
        real de meses abaixo da meta.
