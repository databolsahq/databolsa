          description: "Regime de registro normalizado: rito_automatico_rcvm_160 |
            dispensa_icvm_476 | registro_ordinario | dispensa_outra | pendente |
            outro. As dispensadas pela ICVM 476 não constam do registro de
            ofertas (listOfferings)."
        indexer:
          type:
            - string
            - "null"
        indexer_pct:
          type:
            - number
            - "null"
        spread_pct_aa:
          type:
            - number
            - "null"
        spread_pct_aa_as_filed:
          type:
            - number
            - "null"
          description: Campo moderno de taxa do SND, cru. Pode ser 0 como placeholder —
            não use para média.
        spread_pct_aa_source:
          type:
            - string
            - "null"
          description: "De onde a taxa veio: 'juros_novo' | 'juros_antigo_parsed'."
        spread_day_count:
          type:
            - number
            - "null"
          description: Base de contagem da taxa (252 | 360 | 365). Taxas em bases
            diferentes não são comparáveis.
        spread_absent_reason:
          type:
            - string
            - "null"
          description: "Motivo da taxa ausente: 'not_filed' | 'no_index_no_rate' |
            'unparseable_legacy' | 'filed_zero_unverifiable'. Preenchido se e
            somente se spread_pct_aa é null."
        is_incentivada:
          type:
            - boolean
            - "null"
        guarantee_type:
          type:
            - string
            - "null"
        debenture_class:
          type:
            - string
            - "null"
        face_value_issue:
          type:
            - number
            - "null"
        face_value_current:
          type:
            - number
            - "null"
        face_value_date:
          type:
            - string
            - "null"
        qty_issued:
          type:
            - number
            - "null"
        qty_issued_zero_reason:
          type:
            - string
            - "null"
          description: "Só quando qty_issued = 0 e há valor nominal: 'not_placed' (série
            registrada e não colocada) | 'unreported'. O volume da emissão é
            face_value_issue x qty_issued, então sem isto a emissão parece valer
            R$ 0."
        qty_outstanding:
          type:
            - number
            - "null"
        qty_outstanding_as_filed:
          type:
            - number
            - "null"
          description: Quantidade em mercado exatamente como o SND arquiva, inclusive
            quando é 0. Serve para auditar a diferença contra qty_outstanding;
            para cálculo, use qty_outstanding.
        qty_outstanding_zero_reason:
          type:
            - string
            - "null"
          description: "Só quando a fonte arquiva 0 em mercado. O campo do SND tem largura
            fixa ('000000000000'), então zero e 'não informado' são a mesma
            string — este motivo é o que separa os dois. 'not_placed' (nada
            emitido) e 'fully_redeemed' (baixas fecham com o emitido, papel
            vencido e sem negócio recente) são zeros verificáveis e mantêm
            qty_outstanding = 0. 'contradicted_by_recent_trades' (negociou nos
            últimos 90 dias, logo não pode ter 0 em circulação),
            'redeemed_before_maturity_unverifiable' (baixas fecham mas a emissão
            segue registrada com vencimento à frente), 'unreported_no_movement'
            (nenhuma baixa arquivada), 'unreported_partial_movement' (baixas
            menores que o emitido) e 'unparseable' vêm com qty_outstanding null:
            não trate como zero."
        early_redemption:
          type:
            - boolean
            - "null"
        fiduciary_agent:
          type:
            - string
            - "null"
          description: "Agente fiduciário da emissão, as-filed. É quem representa os
            debenturistas e assina os relatórios periódicos sobre a emissão,
            então é por ele que se chega ao documento quando a escritura está
            arquivada sob o CNPJ do emissor e não sob o código do papel. Texto
            livre da fonte: a mesma casa aparece com grafias diferentes, e nós
            não canonizamos para não inventar entidade que a fonte não declara."
        mandate_bank:
          type:
            - string
            - "null"
          description: Banco mandatário (liquidação e pagamento da emissão), as-filed.
            Texto livre.
        lead_coordinator:
          type:
            - string
            - "null"
          description: "Coordenador líder da distribuição, as-filed. Texto livre, e não
            confunda com o `nome_lider` de `listOfferings`: aqui é o líder
            declarado no cadastro da emissão, lá é o da oferta registrada, e os
            dois divergem quando a emissão foi redistribuída."
        listed_b3:
          type:
            - boolean
            - "null"
        last_trade_date:
          type:
            - string
            - "null"
        last_pu_avg:
          type:
            - number
            - "null"
        last_pct_of_curve:
